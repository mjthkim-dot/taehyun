# Render 블루프린트 — interview-coach만 배포 (Preply 앱과 무관)
# 사용법: render.com → New → Blueprint → 이 저장소 선택 → 환경변수 2개 입력
services:
  - type: web
    name: interview-coach
    runtime: docker
    rootDir: interview-coach
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # 한국에서 가장 가까운 리전
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY      # console.groq.com 에서 발급한 키
        sync: false
      - key: ACCESS_CODE       # 접속 코드 (본인만 아는 값으로 — 필수!)
        sync: false
