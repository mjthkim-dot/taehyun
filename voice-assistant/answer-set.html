<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 번역 &amp; 영어 답변셋 — PREPLY AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 64px;
    background: #0a0b12; color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9ab0; font-size: 13px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer;
    background: #14151f; border: 1px solid #24263a; color: #9a9ab0; font-size: 14px;
  }
  .tab.active { background: #7c6cf6; color: #fff; border-color: #7c6cf6; }
  .panel { display: none; max-width: 640px; margin: 0 auto; }
  .panel.active { display: block; }
  .card {
    background: #14151f; border: 1px solid #24263a; border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: #9a9ab0; margin-bottom: 6px; }
  textarea, select {
    width: 100%; background: #0f1018; color: #e8e8f0; border: 1px solid #2a2c42;
    border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: #7c6cf6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; color: #9a9ab0; margin-top: 8px; min-height: 18px; }
  .translate-out {
    margin-top: 14px; padding: 14px; border-radius: 10px; background: #0f1018;
    min-height: 48px; font-size: 16px; line-height: 1.5; white-space: pre-wrap;
  }
  .answer {
    border-top: 1px solid #24263a; padding-top: 12px; margin-top: 12px;
  }
  .answer:first-of-type { border-top: none; margin-top: 0; }
  .answer .en { font-size: 16px; font-weight: 600; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #24263a; color: #b8b8d0; margin-left: 8px; vertical-align: middle;
  }
  .kr { color: #b8b8d0; font-size: 14px; margin-top: 4px; }
  .note { color: #7c7c9a; font-size: 12.5px; margin-top: 6px; }
  .refs { margin-top: 6px; font-size: 12px; color: #6a6a84; }
  .refs summary { cursor: pointer; color: #9a9ab0; }
</style>
</head>
<body>
  <h1>🌐 실시간 번역 &amp; 🧩 영어 답변셋 (RAG)</h1>
  <div class="sub">맥북(Ollama 로컬)에서 동작 — 인터넷 연결 없이 사용 가능합니다.</div>

  <div class="tabs">
    <div class="tab active" data-tab="translate">실시간 번역</div>
    <div class="tab" data-tab="answers">영어 답변셋</div>
  </div>

  <div class="panel active" id="panel-translate">
    <div class="card">
      <label for="tr-input">한국어 또는 영어를 입력하세요 (자동 감지)</label>
      <textarea id="tr-input" placeholder="예: 이 근처에 괜찮은 식당 있어요?"></textarea>
      <button id="tr-btn">번역하기</button>
      <div class="status" id="tr-status"></div>
      <div class="translate-out" id="tr-out"></div>
    </div>
  </div>

  <div class="panel" id="panel-answers">
    <div class="card">
      <label for="as-input">영어로 어떻게 말해야 할지 모르는 상황/질문을 한국어로 적어주세요</label>
      <textarea id="as-input" placeholder="예: 체크인 하려는데 창가 자리로 바꿀 수 있을까요?"></textarea>
      <div class="row">
        <div>
          <label for="as-cefr">내 영어 레벨 (CEFR)</label>
          <select id="as-cefr">
            <option value="A1">A1 (입문)</option>
            <option value="A2">A2 (초급)</option>
            <option value="B1" selected>B1 (중급)</option>
            <option value="B2">B2 (중상급)</option>
            <option value="C1">C1 (고급)</option>
          </select>
        </div>
      </div>
      <button id="as-btn">영어 답변셋 생성</button>
      <div class="status" id="as-status"></div>
    </div>
    <div id="as-results"></div>
  </div>

<script>
const $ = (sel) => document.querySelector(sel);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $('#panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ── 실시간 번역: NDJSON 스트림을 읽어 토큰 단위로 이어붙인다 ──────
async function translate() {
  const text = $('#tr-input').value.trim();
  if (!text) return;
  const btn = $('#tr-btn'), out = $('#tr-out'), status = $('#tr-status');
  btn.disabled = true; out.textContent = ''; status.textContent = '번역 중...';

  try {
    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      status.textContent = err.error || `오류 (HTTP ${res.status})`;
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const obj = JSON.parse(line);
          const chunk = obj.message?.content;
          if (chunk) out.textContent += chunk;
        } catch { /* 불완전한 줄은 건너뜀 */ }
      }
    }
    status.textContent = '완료';
  } catch (e) {
    status.textContent = '서버에 연결할 수 없습니다: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
$('#tr-btn').addEventListener('click', translate);
$('#tr-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) translate();
});

// ── 영어 답변셋 (RAG) ────────────────────────────────────────
function renderAnswers(data) {
  const box = $('#as-results');
  box.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  (data.answers || []).forEach((a) => {
    const div = document.createElement('div');
    div.className = 'answer';
    const grounded = (a.grounded_in || []).length
      ? `<details class="refs"><summary>참고 표현 ${a.grounded_in.length}개</summary>${a.grounded_in.map(g => `· ${g}`).join('<br>')}</details>`
      : '';
    div.innerHTML = `
      <div class="en">${a.en}<span class="badge">${a.register || ''}</span></div>
      <div class="kr">${a.kr_back_translation || ''}</div>
      <div class="note">💡 ${a.note_ko || ''}</div>
      ${grounded}
    `;
    card.appendChild(div);
  });
  box.appendChild(card);

  if (data.references && data.references.length) {
    const refCard = document.createElement('div');
    refCard.className = 'card';
    refCard.innerHTML = `<details class="refs" open><summary>🔎 검색된 참고 문장 (RAG, ${data.references.length}개)</summary>` +
      data.references.map(r => `· <b>${r.en}</b> — ${r.kr} <span class="badge">${r.category || ''}</span>`).join('<br>') +
      `</details>`;
    box.appendChild(refCard);
  }
}

async function generateAnswerSet() {
  const situation_ko = $('#as-input').value.trim();
  if (!situation_ko) return;
  const cefr = $('#as-cefr').value;
  const btn = $('#as-btn'), status = $('#as-status');
  btn.disabled = true; status.textContent = '검색 + 생성 중... (최초 실행은 임베딩 인덱스 빌드로 다소 걸릴 수 있어요)';
  $('#as-results').innerHTML = '';

  try {
    const res = await fetch('/api/answer-set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ situation_ko, cefr, k: 5 }),
    });
    const data = await res.json();
    if (!res.ok) {
      status.textContent = data.error || `오류 (HTTP ${res.status})`;
      return;
    }
    status.textContent = '';
    renderAnswers(data);
  } catch (e) {
    status.textContent = '서버에 연결할 수 없습니다: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
$('#as-btn').addEventListener('click', generateAnswerSet);
</script>
</body>
</html>
