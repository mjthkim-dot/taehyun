/* ═══════════════════════════════════════════════════
   STT / TTS
═══════════════════════════════════════════════════ */
let sttFinal = '';       // 이번 발화에서 확정된 텍스트 누적
let sttActive = false;   // 사용자가 마이크를 켜두려는 의도
let sttDrill = false;    // 드릴 모드 여부
let sttSilenceTimer = null;     // 침묵 감지 → 자동 전송
let STT_SILENCE_MS = 2500;      // 회화: 말을 멈추고 2.5초 지나면 자동 전송 (생각하며 말할 여유)
let STT_DRILL_SILENCE_MS = 3500;  // 드릴: 천천히 생각하며 말할 수 있게 넉넉히 (3.5초)
let handsFree = false;   // 실시간 핸즈프리 회화 모드 (AI 답변 후 자동으로 다시 듣기)
let hfWatchdog = null;   // 핸즈프리 루프 감시기 — 인식기가 조용히 죽어도 되살린다
let restartTries = 0;    // onend 연속 재시작 시도 횟수 (폭주 방지)
let lastSpeechActivityAt = 0;      // 마지막으로 실제 사용자 음성이 들린 시각
const HF_IDLE_TIMEOUT_MS = 25000;  // 이 시간 동안 말이 없으면 핸즈프리 듣기를 자동 종료 (소음·환청 자동전송 방지)

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    // Web Speech 미지원(Safari/Firefox 등) → 버튼을 끄지 말고 오프라인 Whisper로 동작.
    if (window.isSecureContext && navigator.mediaDevices?.getUserMedia) {
      sttFallbackWhisper = true;
      console.log('Web Speech 미지원 → Whisper 폴백 사용');
    } else {
      micUnavailable('이 브라우저는 음성 인식을 지원하지 않습니다. <b>Chrome 또는 Edge</b>로 접속하세요.');
    }
    return;
  }
  // 마이크는 보안 컨텍스트(https 또는 localhost)에서만 동작한다.
  // http://192.168.x.x 같은 LAN 주소로 열면 STT가 조용히 막힌다 — 명확히 안내.
  if (!window.isSecureContext) {
    micUnavailable('🔒 보안(https) 연결이 아니라 마이크를 쓸 수 없습니다. '
      + '<b>http://localhost:3777</b> 로 접속하거나, 휴대폰은 <b>start.sh가 만든 https 주소</b>'
      + '(…trycloudflare.com)로 접속하세요. (http://192.168… 같은 주소에서는 마이크가 동작하지 않습니다)');
    return;
  }
  recognition = new SR();
  recognition.continuous = true;       // 잠깐 멈춰도 끊기지 않게
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    // 에코 방지는 회화(talk)에만 적용한다. 드릴은 AI 대화와 무관하므로
    // talk 쪽 isProcessing/pendingUtter 때문에 드릴 STT가 막히면 안 된다.
    if (!sttDrill) {
      reconcilePendingUtter();   // 콜백 누락 시에만(지속 idle) 보정 — 세그먼트 공백엔 반응 안 함
      if (isProcessing || pendingUtter > 0) return;  // AI가 생성/발화 중 → 자기 음성 무시
      // AI 발화 직후 잔향(에코)을 사용자 입력으로 받지 않도록 짧은 쿨다운
      if (Date.now() - lastTtsEndAt < 500) { sttFinal = ''; return; }
    }
    restartTries = 0;   // 정상 인식 중 → 재시작 카운터 리셋
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) sttFinal += res[0].transcript + ' ';
      else interim += res[0].transcript;
    }
    const shown = (sttFinal + interim).replace(/\s+/g, ' ').trim();
    if (shown) lastSpeechActivityAt = Date.now();   // 실제 음성 활동 기록 → 무활동 자동종료 타이머 리셋
    if (sttDrill) {
      const di = document.getElementById('drill-input');
      if (di) di.value = shown;
    } else {
      document.getElementById('text-input').value = shown;
      document.getElementById('interim-text').textContent = shown
        ? '🎙️ ' + shown + '  ·  (잠시 멈추면 자동 전송)'
        : '🎙️ 듣는 중... 편하게 말하세요';
    }
    // 침묵 감지: 말이 멈춘 뒤 기다렸다가 자동 전송 (드릴은 천천히 말할 수 있게 더 길게)
    clearTimeout(sttSilenceTimer);
    if (shown) sttSilenceTimer = setTimeout(() => {
      if (!sttActive) return;
      if (sttDrill) { stopMic(); return; }     // 드릴은 입력칸에 채우고 멈춤
      voiceEndpoint();                          // 회화는 즉시 전송 + 핸즈프리 유지
    }, sttDrill ? STT_DRILL_SILENCE_MS : STT_SILENCE_MS);
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('mic-btn')?.classList.remove('listening');
    document.getElementById('drill-mic')?.classList.remove('listening');
    // 브라우저가 임의로 멈춰도, 계속 듣기를 원하면 살짝 늦춰 안전하게 재시작
    // (즉시 start()는 InvalidStateError로 실패해 루프가 죽는 일이 잦다)
    if (sttActive && restartTries++ < 6) {
      setTimeout(() => {
        if (!sttActive) return;
        try {
          recognition.start();
          isListening = true;
          document.getElementById(sttDrill ? 'drill-mic' : 'mic-btn')?.classList.add('listening');
        } catch (e) { /* 다음 워치독 주기에서 재시도 */ }
      }, 150);
      return;
    }
    // 빠른 재시작이 6회 연속 실패 → 세션 의도를 해제해 워치독이 새 세션으로
    // 되살릴 수 있게 한다 (sttActive를 켠 채 두면 워치독·startMic 가드에 막혀 좀비 상태가 됨).
    sttActive = false;
    restartTries = 0;
    finishListening();
  };

  recognition.onerror = (e) => {
    // no-speech/aborted는 치명적이지 않음 — onend의 재시작/워치독에 맡긴다
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
      sttActive = false; handsFree = false; isListening = false; sttDrill = false;
      clearTimeout(sttSilenceTimer); stopHandsFreeWatchdog();
      document.getElementById('mic-btn')?.classList.remove('listening');
      document.getElementById('drill-mic')?.classList.remove('listening');
      const msg = e.error === 'audio-capture'
        ? '🎙️ 마이크 장치를 찾을 수 없습니다. 마이크가 연결돼 있는지, 다른 앱이 점유하고 있지 않은지 확인하세요.'
        : '🎙️ 마이크 권한이 꺼져 있습니다. 주소창 왼쪽 자물쇠 아이콘 → 마이크 → 허용으로 바꾼 뒤 다시 시도하세요. (모바일은 https 주소에서만 동작합니다)';
      toast(msg, 6000);            // 드릴 화면에서도 보이도록
      addSystemMsg(msg);
      return;
    }
    // network 오류 = 구글 음성서버 도달 실패. 워치독으로 무한 재시작해봐야
    // 계속 실패하며 "음성을 못 알아듣는" 먹통이 된다 → 즉시 오프라인 Whisper로 전환.
    if (e.error === 'network') {
      switchToWhisper('⚠️ 브라우저 음성인식(구글) 연결 실패');
      return;
    }
    // 그 외 일시적 오류: 듣기 의도는 유지하고 워치독이 되살리게 둔다
    isListening = false;
    document.getElementById('mic-btn')?.classList.remove('listening');
    document.getElementById('drill-mic')?.classList.remove('listening');
  };
}

let micGranted = false;   // getUserMedia로 마이크 권한을 한 번이라도 받았는지

function startMic(drillMode) {
  if (!recognition) { toast('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome/Edge를 사용하세요.'); return; }
  if (!window.isSecureContext) { toast('🔒 https(또는 localhost) 연결에서만 마이크가 동작합니다.'); return; }
  if (isListening || sttActive) return;   // 이미 듣는 중이면 중복 start() 방지

  const begin = () => {
    if (isListening || sttActive) return;   // 권한 대기 중 상태가 바뀌었을 수 있음
    stopSpeaking();
    sttFinal = '';
    sttDrill = drillMode;
    restartTries = 0;
    if (!drillMode) lastSpeechActivityAt = Date.now();   // 무활동 자동종료 타이머 기준 갱신
    recognition.lang = 'en-US';
    try {
      recognition.start();
    } catch (e) {
      // InvalidStateError = 직전 세션이 아직 정리 중(곧 onend) → 이미 켜진 셈이라 진행.
      if (e.name !== 'InvalidStateError') {
        toast('🎙️ 마이크를 시작할 수 없습니다: ' + (e.message || e.name));
        return;
      }
    }
    sttActive = true;
    isListening = true;
    if (!drillMode) { handsFree = true; armHandsFreeWatchdog(); }   // 회화는 핸즈프리 루프
    if (drillMode) {
      document.getElementById('drill-mic')?.classList.add('listening');
    } else {
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('interim-text').textContent = '🎙️ 듣는 중... 편하게 말하세요 (멈추면 자동 전송)';
    }
  };

  // 권한을 이미 받았거나 getUserMedia가 없으면 바로 시작.
  if (micGranted || !navigator.mediaDevices?.getUserMedia) { begin(); return; }
  // 최초 1회: 명시적으로 마이크 권한을 요청한다. SpeechRecognition만으로는 일부 환경에서
  // 권한 프롬프트가 안 떠 "음성을 인식 못 하는" 것처럼 보이던 문제를 근본적으로 막는다.
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      stream.getTracks().forEach(t => t.stop());   // 권한만 확인하고 즉시 해제 (SpeechRecognition이 마이크 사용)
      micGranted = true;
      begin();
    })
    .catch(err => {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      const m = denied
        ? '🎙️ 마이크 권한이 거부되었습니다. 주소창 왼쪽 자물쇠 아이콘 → 마이크 → "허용" 으로 바꾼 뒤 페이지를 새로고침하세요.'
        : (err && err.name === 'NotFoundError'
            ? '🎙️ 마이크 장치를 찾을 수 없습니다. 마이크 연결을 확인하세요.'
            : '🎙️ 마이크를 열 수 없습니다: ' + (err && (err.message || err.name)));
      toast(m, 6000); addSystemMsg(m);
    });
}

function stopMic() {
  sttActive = false;  // 의도 해제 → onend에서 재시작하지 않고 마무리
  handsFree = false;  // 사용자가 직접 끔 → 자동 재개하지 않음
  clearTimeout(sttSilenceTimer);
  stopHandsFreeWatchdog();
  try { recognition.stop(); } catch (e) {}
}

/* 핸즈프리 루프 감시기: AI 차례가 아닌데도 마이크가 꺼져 있으면 되살린다.
   Chrome 음성인식이 네트워크/타임아웃으로 조용히 죽어 "응답이 없는" 것처럼
   보이던 문제를 근본적으로 막는 안전망. */
function armHandsFreeWatchdog() {
  stopHandsFreeWatchdog();
  hfWatchdog = setInterval(() => {
    if (currentMode !== 'talk' || !handsFree) { stopHandsFreeWatchdog(); return; }
    // TTS가 실제로는 끝났는데 onend 콜백이 오지 않아 pendingUtter가 안 풀린 경우
    // (일부 브라우저의 SpeechSynthesis 행 버그) — 지속 idle일 때만 강제 정리.
    reconcilePendingUtter();
    if (isProcessing || pendingUtter > 0) return;   // AI 차례 — 정상적으로 대기
    // 오래 말이 없으면 듣기를 자동 종료 — 소음·환청이 사용자 입력으로 잡혀 자동 전송되는 걸 막는다.
    if (lastSpeechActivityAt && Date.now() - lastSpeechActivityAt > HF_IDLE_TIMEOUT_MS) {
      stopMic();
      document.getElementById('interim-text').textContent = '💤 잠시 멈췄어요 — 🎙️를 눌러 대화를 이어가세요';
      return;
    }
    if (sttActive || isListening) return;           // 이미 듣는 중
    startMic(false);                                // 멈춰 있으면 다시 듣기
  }, 1600);
}
function stopHandsFreeWatchdog() {
  if (hfWatchdog) { clearInterval(hfWatchdog); hfWatchdog = null; }
}

/* 회화 전용: 발화가 끝나면 즉시 전송하되, 마이크는 핸즈프리로 유지.
   AI 차례 동안만 인식을 잠시 멈춰 자기 음성을 받아 적지 않게 한다. */
function voiceEndpoint() {
  const text = document.getElementById('text-input').value.trim();
  pauseListening();                  // AI 차례 → 인식 일시정지 (에코 방지)
  document.getElementById('text-input').value = '';
  if (!text) { maybeResumeHandsFree(); return; }
  document.getElementById('interim-text').textContent = '🤖 코치가 답하는 중...';
  sendMessage(text);
}

/* 핸즈프리 의도(handsFree)는 유지한 채 인식기만 잠시 정지 */
function pauseListening() {
  sttActive = false;
  clearTimeout(sttSilenceTimer);
  sttFinal = '';
  try { recognition.stop(); } catch (e) {}
  isListening = false;
  document.getElementById('mic-btn')?.classList.remove('listening');
}

/* AI 답변 + 음성 재생이 모두 끝나면 자동으로 다시 듣기 시작 (실시간 루프) */
function maybeResumeHandsFree() {
  if (!handsFree || isProcessing || pendingUtter > 0) return;
  if (sttActive || isListening || currentMode !== 'talk') return;
  // 인식기가 완전히 풀리고 AI 음성 잔향이 사라지도록 잠시 기다린 뒤 재시작 (에코 방지)
  setTimeout(() => {
    if (handsFree && !isProcessing && pendingUtter <= 0 && !sttActive && currentMode === 'talk') {
      startMic(false);
    }
  }, 450);
}

function finishListening() {
  if (sttDrill) {
    sttDrill = false;
    return;  // 드릴은 입력칸에 채워두고, 사용자가 확인 버튼을 누르게 둠
  }
  // 회화 전송은 voiceEndpoint(침묵 감지)가 전담한다 — 여기서 다시 보내면 중복.
  // 남은 입력이 있는데 핸즈프리가 꺼진 상태(직접 종료)면 한 번 보내준다.
  if (!handsFree && !isProcessing) {
    const text = document.getElementById('text-input').value.trim();
    if (text) { sendMessage(text); document.getElementById('text-input').value = ''; }
    document.getElementById('interim-text').textContent = '';
  }
  sttFinal = '';
}

function toggleMic() {
  if (sttFallbackWhisper || !recognition) {        // Web Speech 막힘 → Whisper 푸시-투-토크
    if (pendingUtter > 0) stopSpeaking();
    startWhisperRecording(false);
    return;
  }
  if (sttActive) { stopMic(); return; }      // 듣는 중 → 끄기
  if (pendingUtter > 0) stopSpeaking();       // AI가 말하는 중이면 끊고(바지인) 바로 듣기
  if (isProcessing) {                          // 아직 AI가 답을 만드는 중
    handsFree = false;
    toast('🤖 코치가 답변을 만드는 중이에요. 잠시 후 자동으로 다시 들어요.');
    return;
  }
  startMic(false);
}

/* 친근한 여성 음성 우선 선택 (macOS/Chrome/Windows 대표 음성 순) */
const PREFERRED_VOICES = {
  en: ['Samantha', 'Ava (Premium)', 'Ava (Enhanced)', 'Ava', 'Google US English', 'Aria', 'Jenny', 'Allison', 'Susan', 'Joanna', 'Zira', 'Victoria', 'Karen', 'Moira', 'Tessa'],
  ko: ['Microsoft SunHi Online', 'Microsoft SunHi', 'Google 한국의', 'Yuna (Premium)', 'Yuna (Enhanced)', 'Yuna', 'Microsoft Heami', 'SunHi', 'Heami', 'Jiyoon', 'Hyunsu', 'InJoon', 'Nara', 'Microsoft', 'Korean'],
};
/* A/B 대화문에서 B 역할에 우선 배정할 남성 음성 이름 — A(여성)와 명확히 구분되는 음역대를 위해 */
const MALE_VOICE_RE = /(daniel|alex|fred|tom|guy|ryan|eric|christopher|matthew|brian|mark|justin|oliver|david|james|male|aaron|nathan)/i;
/* 고품질(사람에 가까운) 음성 표식 — Enhanced/Premium(macOS), Natural(Edge), Siri 등 */
const QUALITY_VOICE_RE = /(natural|neural|premium|enhanced|siri|online)/i;

function voiceScore(v) {
  const prefix = v.lang.replace('_', '-').slice(0, 2);
  let s = 0;
  if (QUALITY_VOICE_RE.test(v.name)) s += 100;  // 고품질 음성 최우선 → 기계음 탈출
  const list = PREFERRED_VOICES[prefix] || [];
  const i = list.findIndex(name => v.name.includes(name));
  if (i >= 0) s += 50 - i;
  if (/google/i.test(v.name)) s += 8;
  if (/female/i.test(v.name)) s += 5;
  if (v.lang.replace('_', '-') === (prefix === 'en' ? 'en-US' : 'ko-KR')) s += 3;
  return s;
}

function pickVoice(lang) {
  const voices = window.speechSynthesis.getVoices();
  const prefix = lang.slice(0, 2);
  const candidates = voices.filter(v => v.lang.replace('_', '-').startsWith(prefix));
  if (!candidates.length) return null;
  // 사용자가 직접 고른 영어 음성이 있으면 최우선
  if (prefix === 'en') {
    const savedName = load('va_voice_en', null);
    const saved = savedName && candidates.find(v => v.name === savedName);
    if (saved) return saved;
  }
  return candidates.sort((a, b) => voiceScore(b) - voiceScore(a))[0];
}

/* 음성으로 읽기 전 정리: 이모지·마크다운 기호 등 어색하게 읽히는 것 제거 */
function cleanForSpeech(t) {
  return String(t)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/[*_#`~•·]/g, '')
    .replace(/\s+/g, ' ').trim();
}

/* 헤더의 음성 선택 드롭다운 — 기기에 설치된 영어 음성 목록에서 직접 선택 */
function initVoiceSelector() {
  const sel = document.getElementById('voice-sel');
  if (!window.speechSynthesis) { sel.style.display = 'none'; return; }
  const populate = () => {
    const voices = window.speechSynthesis.getVoices()
      .filter(v => v.lang.replace('_', '-').startsWith('en'))
      .sort((a, b) => voiceScore(b) - voiceScore(a));  // 자연스러운 음성이 위로
    if (!voices.length) return;
    const current = pickVoice('en-US');
    sel.innerHTML = voices.map(v =>
      `<option value="${esc(v.name)}" ${current && v.name === current.name ? 'selected' : ''}>${QUALITY_VOICE_RE.test(v.name) ? '⭐' : '🔊'} ${esc(v.name)}</option>`
    ).join('');
  };
  populate();
  window.speechSynthesis.onvoiceschanged = populate;
  sel.onchange = () => {
    store('va_voice_en', sel.value);
    _dialogueVoicePair = null;   // A 음성을 바꿨으니 대화문 A/B 음성 쌍도 다시 계산
    tts("Hi! I'm your English coach. Nice to meet you!", 'en-US');
  };
}

/* 음성 목록이 준비될 때까지 기다렸다가 콜백 (한 번만, 안전망 타임아웃 포함) */
function whenVoicesReady(cb) {
  const synth = window.speechSynthesis;
  if (synth.getVoices().length) { cb(); return; }
  let done = false;
  const run = () => { if (done) return; done = true; cb(); };
  synth.addEventListener('voiceschanged', run, { once: true });
  synth.getVoices();             // 로딩 트리거
  setTimeout(run, 350);          // 이벤트가 안 와도 재생 시도
}

function tts(text, lang, opts = {}) {
  const synth = window.speechSynthesis;
  if (!synth) { toast('🔊 이 브라우저는 음성 합성을 지원하지 않습니다.'); return; }
  const clean = cleanForSpeech(text);
  if (!clean) return;
  const speakNow = () => {
    synth.cancel();
    // Chrome 버그: cancel 직후 즉시 speak하면 씹힌다 → 한 틱 뒤에 말한다.
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = lang;
      u.rate = opts.rate ?? 0.95;   // 또박또박 (따라 말하기 좋게) · 0.6 = 슬로우 재생
      u.pitch = 1.06;
      const v = pickVoice(lang);
      if (v) u.voice = v;
      try { synth.resume(); } catch (e) {}   // Chrome이 일시정지로 빠지는 것 방지
      synth.speak(u);
    }, 60);
  };
  whenVoicesReady(speakNow);
}

/* 🐢 슬로우 재생 (0.6배속) — 빠른 원어민 발음을 또박또박 분해해 듣는다 */
function ttsSlow(text, lang) { tts(text, lang || 'en-US', { rate: 0.6 }); }

/* 🔧 음성 진단 — 마이크/음성이 안 될 때 원인을 한눈에 보여준다 */
async function voiceDiagnostics() {
  const lines = [];
  const ok = (b) => b ? '✅' : '❌';
  // 1) 보안 컨텍스트
  lines.push(`${ok(window.isSecureContext)} 보안 연결(https/localhost): ${window.isSecureContext ? '정상' : '아님 → 마이크 차단됨. localhost나 https 주소로 접속하세요'}`);
  // 2) 음성 인식 지원
  const srOK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  lines.push(`${ok(srOK)} 음성 인식(STT) 지원: ${srOK ? '지원됨' : '미지원 → Chrome/Edge 사용'}`);
  // 3) 마이크 권한 상태
  try {
    if (navigator.permissions?.query) {
      const p = await navigator.permissions.query({ name: 'microphone' });
      lines.push(`${p.state === 'granted' ? '✅' : p.state === 'denied' ? '❌' : '⚠️'} 마이크 권한: ${p.state}${p.state === 'denied' ? ' → 자물쇠 아이콘에서 허용으로 변경 후 새로고침' : ''}`);
    }
  } catch (e) { /* permissions API 미지원 — 무시 */ }
  // 4) 실제 마이크 접근 테스트
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    micGranted = true;
    lines.push('✅ 마이크 접근: 성공 (장치 정상)');
  } catch (e) {
    lines.push(`❌ 마이크 접근 실패: ${e.name} — ${e.name === 'NotAllowedError' ? '권한 거부됨' : e.name === 'NotFoundError' ? '마이크 장치 없음' : e.message}`);
  }
  // 5) 음성 합성(TTS) + 음성 목록
  const synth = window.speechSynthesis;
  const nVoices = synth ? synth.getVoices().length : 0;
  lines.push(`${ok(!!synth)} 음성 재생(TTS) 지원: ${synth ? `정상 · 설치된 음성 ${nVoices}개` : '미지원'}`);
  if (synth && nVoices === 0) lines.push('⚠️ 설치된 음성이 0개 — 잠시 후 다시 시도하거나 OS 음성을 설치하세요');
  // 6) Whisper 폴백 상태
  lines.push(`${sttFallbackWhisper ? '🎙️' : 'ℹ️'} 오프라인 Whisper STT: ${sttFallbackWhisper ? '활성 (구글 서버 의존 없음)' : '대기 (Web Speech 실패 시 자동 전환)'}`);
  // 7) 테스트 음성 재생
  if (synth) { tts('Hello! This is a sound test. Can you hear me?', 'en-US'); lines.push('🔊 테스트 음성을 재생했어요 — 안 들리면 기기 볼륨/무음 모드를 확인하세요'); }

  const html = lines.map(l => `<div style="text-align:left">${l}</div>`).join('');
  addSystemMsg('🔧 <b>음성 진단 결과</b>');
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg system';
  wrap.innerHTML = `<div style="width:100%;font-size:0.82rem;line-height:1.7">${html}</div>
    <div style="width:100%;margin-top:10px">
      <button class="btn" onclick="forceWhisperMode()" style="font-size:0.78rem">🎙️ 음성 인식이 안 되면 — 오프라인 Whisper로 전환</button>
    </div>`;
  chat.appendChild(wrap); scrollBottom();
  toast('🔧 진단 완료 — 회화 화면의 결과를 확인하세요', 4000);
}

/* 사용자가 직접 Whisper로 전환 (Web Speech가 조용히 먹통일 때) */
function forceWhisperMode() {
  if (sttFallbackWhisper) { toast('이미 오프라인 Whisper 모드입니다. 🎙️ 버튼을 눌러 말해보세요.', 4000); return; }
  switchToWhisper('🎙️ 오프라인 음성인식으로 전환했습니다');
  loadWhisper();   // 미리 모델 다운로드 시작
}

/* ═══════════════════════════════════════════════════
   Word-tap 오디오 싱크 (Zero-latency 단어 하이라이팅 + 루프)
   · 재생 중 단어가 실시간 하이라이트 (SpeechSynthesis boundary 이벤트)
   · 단어 탭 시 그 지점부터 즉시 재생 · 🔁로 루프
═══════════════════════════════════════════════════ */
function syncWords(text) {
  // 각 단어를 char 오프셋과 함께 span으로 감싼다 (탭 → 그 지점부터 재생)
  let idx = 0;
  return text.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok) || tok === '') { const t = tok; idx += t.length; return t; }
    const span = `<span class="sync-word" data-char="${idx}" onclick="playSync(this.closest('.sync-line'), ${idx})">${esc(tok)}</span>`;
    idx += tok.length;
    return span;
  }).join('');
}

function playSync(lineEl, fromChar) {
  if (!lineEl || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  fromChar = fromChar || 0;
  const text = lineEl.dataset.text || '';
  const spans = [...lineEl.querySelectorAll('.sync-word')];
  spans.forEach(s => s.classList.remove('on'));
  const u = new SpeechSynthesisUtterance(text.slice(fromChar));
  u.lang = 'en-US';
  u.rate = 0.92;
  u.pitch = 1.05;
  const v = pickVoice('en-US');
  if (v) u.voice = v;
  u.onboundary = (e) => {
    if (e.name && e.name !== 'word') return;
    const abs = fromChar + e.charIndex;
    let best = null;
    spans.forEach(s => { if (+s.dataset.char <= abs) best = s; });
    spans.forEach(s => s.classList.remove('on'));
    if (best) best.classList.add('on');
  };
  u.onend = () => {
    spans.forEach(s => s.classList.remove('on'));
    if (lineEl.dataset.loop === '1') playSync(lineEl, fromChar);
  };
  window.speechSynthesis.speak(u);
}

function toggleSyncLoop(btn) {
  const line = btn.closest('.example-row').querySelector('.sync-line');
  const on = line.dataset.loop === '1';
  line.dataset.loop = on ? '0' : '1';
  btn.textContent = on ? '🔁' : '⏹';
  btn.title = on ? '루프 재생' : '루프 중지 (다시 누르면 끔)';
  if (!on) playSync(line, 0); else window.speechSynthesis.cancel();
}

/* B 역할에 배정할 음성을 고른다 — A와 또렷이 구분되도록 남성 음성을 최우선, 없으면 다음 품질의 영어 음성 */
function pickSecondVoice(voiceA) {
  const candidates = window.speechSynthesis.getVoices()
    .filter(v => v.lang.replace('_', '-').startsWith('en') && (!voiceA || v.name !== voiceA.name));
  if (!candidates.length) return { voice: voiceA, isMale: false };
  const male = candidates.filter(v => MALE_VOICE_RE.test(v.name)).sort((a, b) => voiceScore(b) - voiceScore(a))[0];
  if (male) return { voice: male, isMale: true };
  return { voice: candidates.sort((a, b) => voiceScore(b) - voiceScore(a))[0], isMale: false };
}

/* 현 레슨의 A/B 음성 쌍을 한 번만 계산해 재사용 — 전체 재생과 줄별 🔊 버튼이 같은 목소리를 쓰게 한다 */
let _dialogueVoicePair = null;
function getDialogueVoicePair() {
  if (_dialogueVoicePair) return _dialogueVoicePair;
  const voiceA = pickVoice('en-US');
  const { voice: voiceB, isMale } = pickSecondVoice(voiceA);
  // 남성 음성을 구했으면 자연스러운 피치로, 못 구했으면(둘 다 여성) 피치 차이를 크게 벌려 구분
  _dialogueVoicePair = {
    A: { voice: voiceA, pitch: 1.04, rate: 0.95 },
    B: { voice: voiceB, pitch: isMale ? 0.88 : 1.22, rate: isMale ? 0.92 : 0.97 },
  };
  return _dialogueVoicePair;
}

/* 대화문 한 줄을 화자(A/B)에 맞는 음성으로 읽는다 — study 카드의 🔊 버튼이 사용 */
function speakDialogueLine(text, speaker) {
  const synth = window.speechSynthesis;
  if (!synth) { toast('🔊 이 브라우저는 음성 합성을 지원하지 않습니다.'); return; }
  const clean = cleanForSpeech(text);
  if (!clean) return;
  whenVoicesReady(() => {
    synth.cancel();
    setTimeout(() => {
      const { A, B } = getDialogueVoicePair();
      const v = speaker === 'B' ? B : A;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'en-US';
      u.rate = v.rate;
      u.pitch = v.pitch;
      if (v.voice) u.voice = v.voice;
      try { synth.resume(); } catch (e) {}
      synth.speak(u);
    }, 60);
  });
}

/* 실전 대화문 전체 자동 재생 — A/B를 서로 다른 음성대역(가능하면 남/여)으로 구분해 들려준다 */
function playDialogue() {
  if (!window.speechSynthesis || !currentLesson.dialogue) return;
  window.speechSynthesis.cancel();
  _dialogueVoicePair = null;   // 레슨마다, 재생마다 최신 음성 목록으로 다시 계산
  const { A, B } = getDialogueVoicePair();
  const lines = currentLesson.dialogue.lines;
  let i = 0;
  const next = () => {
    if (i >= lines.length) return;
    const ln = lines[i++];
    const v = ln.sp === 'B' ? B : A;
    const u = new SpeechSynthesisUtterance(ln.en);
    u.lang = 'en-US';
    u.rate = v.rate;
    u.pitch = v.pitch;
    if (v.voice) u.voice = v.voice;
    u.onend = next;
    u.onerror = next;
    window.speechSynthesis.speak(u);
  };
  next();
}

/* ── 스트리밍 TTS: 응답 전체를 기다리지 않고, 문장이 완성되는 즉시 읽기 ──
   speakCursor: 이번 응답에서 이미 읽은 위치 / pendingUtter: 재생 대기·중인 발화 수 */
let speakCursor = 0;
let pendingUtter = 0;
let ttsIdleSince = 0;   // 합성기가 idle로 관측되기 시작한 시각 (멀티 세그먼트 공백 vs 진짜 멈춤 구분)
let lastTtsEndAt = 0;   // 마지막 TTS 발화가 끝난 시각 (에코 쿨다운용)

/* 멀티 세그먼트 발화 사이의 짧은 공백을 '끝남'으로 오인하지 않도록,
   합성기가 '지속적으로' idle일 때만 pendingUtter를 보정한다 (콜백 누락 복구). */
function reconcilePendingUtter() {
  if (pendingUtter <= 0) { ttsIdleSince = 0; return; }
  const synth = window.speechSynthesis;
  if (!synth) return;
  if (synth.speaking || synth.pending) { ttsIdleSince = 0; return; }  // 발화 중/대기 중 → 정상
  if (!ttsIdleSince) { ttsIdleSince = Date.now(); return; }           // idle 관측 시작
  if (Date.now() - ttsIdleSince > 1200) {                            // 1.2초 이상 지속 idle = 진짜 멈춤
    pendingUtter = 0;
    ttsIdleSince = 0;
    lastTtsEndAt = Date.now();
    document.getElementById('mic-btn')?.classList.remove('speaking');
  }
}

function streamSpeak(raw, flush) {
  if (!window.speechSynthesis) return;
  raw = stripForeignScripts(raw);
  let s = raw.slice(speakCursor);
  // 아직 닫히지 않은 [CORRECT:/[EXPLAIN: 태그는 다음 청크에서 처리
  const open = s.lastIndexOf('[');
  if (open !== -1 && s.indexOf(']', open) === -1) s = s.slice(0, open);
  let end = s.length;
  if (!flush) {
    end = 0;
    for (let i = s.length - 1; i >= 0; i--) {
      if ('.!?'.includes(s[i])) { end = i + 1; break; }
    }
  }
  if (!end) return;
  const chunk = s.slice(0, end);
  speakCursor += end;
  // EXPLAIN은 한국어 음성으로, 나머지는 영어로
  const explainRe = /\[EXPLAIN:\s*([^\]]+)\]/g;
  let last = 0, m;
  while ((m = explainRe.exec(chunk)) !== null) {
    enqueueSpeech(chunk.slice(last, m.index), 'en-US');
    enqueueSpeech(m[1], 'ko-KR');
    last = m.index + m[0].length;
  }
  enqueueSpeech(chunk.slice(last), 'en-US');
}

/* 한·영 혼합 문장을 스크립트 단위로 분리.
   "자, 따라 해봐: I went to the store." →
   [{ko:'자, 따라 해봐:'}, {en:'I went to the store.'}]
   각 구간을 알맞은 모국어 음성으로 읽어, 한국어는 자연스럽고 영어는 원어민처럼 들리게 한다. */
function segmentByScript(text, baseLang) {
  const isKo = c => /[가-힣ᄀ-ᇿ㄰-㆏]/.test(c);
  const isEn = c => /[A-Za-z]/.test(c);
  const enLang = (baseLang && baseLang.slice(0, 2) === 'en') ? baseLang : 'en-US';
  const segs = [];
  let cur = null, buf = '';
  const flush = () => {
    if (buf.trim()) segs.push({ text: buf.trim(), lang: cur === 'ko' ? 'ko-KR' : enLang });
    buf = '';
  };
  for (const ch of text) {
    const l = isKo(ch) ? 'ko' : (isEn(ch) ? 'en' : null);   // 숫자·기호·공백은 중립 → 직전 구간에 붙임
    if (l && cur && l !== cur) { flush(); cur = l; }
    else if (l && !cur) cur = l;
    buf += ch;
  }
  flush();
  // 한 글자짜리 파편(예: 's')은 앞 구간에 합쳐 끊김을 줄인다
  const merged = [];
  for (const s of segs) {
    const prev = merged[merged.length - 1];
    if (prev && s.text.replace(/[^A-Za-z가-힣]/g, '').length <= 1) prev.text += ' ' + s.text;
    else merged.push(s);
  }
  return merged.length ? merged : [{ text: text.trim(), lang: baseLang || 'en-US' }];
}

/* 단일 구간을 모국어 음성/톤으로 발화 (pendingUtter 큐 관리 포함) */
function _speakSegment(text, lang) {
  const u = new SpeechSynthesisUtterance(text);
  const isKo = lang.slice(0, 2) === 'ko';
  u.lang = isKo ? 'ko-KR' : lang;
  if (isKo) {
    // 한국어 원어민 톤: 살짝 느긋하고 따뜻하게 (또박또박, 기계적 흔들림 없음)
    u.rate = 0.97;
    u.pitch = 1.0;
  } else {
    // 영어 원어민 톤: 자연스러운 속도, 문장마다 미세한 변화로 단조로움 완화
    u.rate = 1.0 + (Math.random() * 0.05 - 0.02);
    u.pitch = 1.02 + (Math.random() * 0.05 - 0.025);
  }
  const v = pickVoice(u.lang);
  if (v) u.voice = v;
  pendingUtter++;
  document.getElementById('mic-btn').classList.add('speaking');
  u.onend = u.onerror = () => {
    // stopSpeaking()이 이미 pendingUtter를 0으로 정리한 뒤(바지인 등) 취소된
    // 발화의 onend가 늦게 도착하면 음수로 내려가며 가짜 재개를 부른다 — 방지.
    if (pendingUtter <= 0) return;
    ttsIdleSince = 0;
    if (--pendingUtter <= 0) {
      pendingUtter = 0;
      lastTtsEndAt = Date.now();   // 에코 쿨다운 기준 시각
      document.getElementById('mic-btn').classList.remove('speaking');
      maybeResumeHandsFree();   // AI 음성까지 끝났으니 다시 듣기 시작
    }
  };
  window.speechSynthesis.speak(u);
}

function enqueueSpeech(text, lang) {
  text = cleanForSpeech(String(text).replace(/\[CORRECT:[^\]]*\]/g, '').replace(/\[EXPLAIN:[^\]]*\]/g, '').replace(/\[HEARD:[^\]]*\]/g, ''));
  if (!text || !window.speechSynthesis) return;
  // 한·영 혼합이면 구간별로 모국어 음성으로 나눠 읽어 발음을 자연스럽게
  for (const seg of segmentByScript(text, lang)) _speakSegment(seg.text, seg.lang);
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  pendingUtter = 0;
  ttsIdleSince = 0;
  document.getElementById('mic-btn').classList.remove('speaking');
}

/* ═══════════════════════════════════════════════════
   DOM HELPERS
═══════════════════════════════════════════════════ */
function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${esc(text)}</div><div class="msg-meta">${timeStr()}</div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
}
function addAiMsg() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  div.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = timeStr();
  // 🇰🇷 필요할 때 한글 번역 보기
  const tbtn = document.createElement('button');
  tbtn.className = 'tr-btn';
  tbtn.textContent = '🇰🇷 번역';
  tbtn.onclick = () => toggleTranslate(div, bubble, tbtn);
  meta.appendChild(tbtn);
  // 📌 이 표현을 내 표현장에 저장
  const sbtn = document.createElement('button');
  sbtn.className = 'tr-btn';
  sbtn.textContent = '📌 저장';
  sbtn.onclick = () => savePhrase((bubble.innerText || '').trim(), '', '회화');
  meta.appendChild(sbtn);
  div.appendChild(meta);
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return { textEl: bubble };
}

/* AI 영어 메시지를 필요할 때만 한글로 번역해 아래에 보여준다 (토글) */
async function toggleTranslate(div, bubble, btn) {
  const existing = div.querySelector('.tr-box');
  if (existing) { existing.remove(); btn.textContent = '🇰🇷 번역'; return; }
  const text = (bubble.innerText || '').trim();
  if (!text) return;
  btn.disabled = true; btn.textContent = '⏳ 번역중';
  try {
    const ko = await aiTranslateToKo(text);
    const box = document.createElement('div');
    box.className = 'tr-box';
    box.textContent = '🇰🇷 ' + ko;
    div.insertBefore(box, div.querySelector('.msg-meta'));
    btn.textContent = '🇰🇷 숨기기';
    scrollBottom();
  } catch (err) {
    if (err.message === 'NO_GROQ_KEY') { openGroqKeyModal(); }
    else toast('번역에 실패했습니다. AI 모델 연결을 확인하세요.');
    btn.textContent = '🇰🇷 번역';
  } finally {
    btn.disabled = false;
  }
}

async function aiTranslateToKo(text) {
  const messages = [{ role: 'user', content: `다음 영어를 자연스러운 한국어로 번역만 해줘. 설명·따옴표·영어 원문 없이 한국어 번역문만 출력:\n\n${text}` }];
  return (await aiComplete(messages, { temperature: 0.2, maxTokens: 260 })).trim();
}

/* 선택된 모델(Groq/WebLLM/Ollama)로 단발성 완성 응답을 받는 공용 헬퍼 */
async function aiComplete(messages, opts = {}) {
  const model = document.getElementById('model-sel').value;
  if (isGroqModel(model)) {
    return groqComplete(messages, { temperature: opts.temperature ?? 0.7, maxTokens: opts.maxTokens ?? 220 });
  }
  if (isWebLLMModel(model)) {
    const engine = await getWebLLMEngine(model);
    const r = await engine.chat.completions.create({
      messages, stream: false,
      temperature: opts.temperature ?? 0.7, max_tokens: opts.maxTokens ?? 220,
    });
    return r.choices[0].message.content || '';
  }
  const resp = await fetch('/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model, messages, stream: false, keep_alive: '30m',
      options: { temperature: opts.temperature ?? 0.7, num_predict: opts.maxTokens ?? 220 },
    }),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  return data.message?.content || '';
}
function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${esc(text).replace(/\n/g, '<br>')}</div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
}

/* 회화 시작 소개 카드 — 모든 회차 + 🎲 새 주제 생성 시마다 동일하게 표시 */
function addTalkIntro(opts = {}) {
  const l = currentLesson;
  const sc = activeScenario || l.scenario;
  if (!sc) return;
  const tag = opts.generated ? '🎲 새 주제' : `${lessonLabel(l)} · ${esc(l.title)}`;
  // 이 상황의 핵심 표현 2~3개 (생성 주제면 그 주제용 예문, 아니면 회차 기본 예문)
  const ex = ((activeScenario && activeScenario.examples) || l.examples || []).slice(0, 3);
  const exHtml = ex.length
    ? `<div class="ti-sec">💬 이렇게 말해보세요</div><div class="ti-ex">${ex.map(e => `· ${esc(e.en)} <span class="k">— ${esc(e.kr)}</span>`).join('<br>')}</div>`
    : '';
  const goLine = opts.generated
    ? 'AI 튜터가 먼저 말을 건넵니다 — 편하게 영어로 답해보세요!'
    : '🎙️ 또는 입력창으로 영어 대화를 시작해 보세요!';
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML =
    `<div class="talk-intro">
      <div class="ti-head">🎬 ${esc(sc.title)}</div>
      <div class="ti-desc">${esc(sc.desc)}</div>
      <div class="ti-sec" style="color:var(--text-muted)">${tag}</div>
      ${exHtml}
      <div class="ti-go">${goLine}</div>
    </div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
}
function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg ai typing';
  div.innerHTML = `<div class="bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}
function timeStr() { return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
/* onclick 속성 안의 JS 문자열용: JS 이스케이프 후 HTML 엔티티 처리 (따옴표로 속성이 깨지지 않게) */
function jsAttr(s) { return esc(escJs(s)); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
