<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
  <title>PREPLY AI 스피킹 코치</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#0b0d14"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PREPLY"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d14;
      --surface: #171a26;
      --surface2: #1f2333;
      --surface3: #262b40;
      --border: #2c3148;
      --primary: #6d5ef0;
      --primary-light: #8b7bff;
      --primary-dk: #4f3fd1;
      --green: #2fd97f;
      --green-dk: #1ea862;
      --yellow: #ffb734;
      --red: #ff5470;
      --text: #f1f3f9;
      --text-muted: #8893ab;
      --radius: 20px;
      --radius-sm: 14px;
      --radius-lg: 26px;
      --nav-h: 64px;
      --shadow-card: 0 2px 0 rgba(0,0,0,0.18), 0 8px 20px -10px rgba(0,0,0,0.45);
      --shadow-press: 0 1px 0 rgba(0,0,0,0.25);
      font-family: 'Nunito', 'Baloo 2', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { overflow-x: hidden; max-width: 100vw; }
    body {
      font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      max-width: 100vw; overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    button, .lesson-chip, .mode-tab, .helper-chip, .mission, .unit-go, .speak-mini { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:active, .tappable:active { transform: scale(0.96); }
    /* ── 톤앤매너 통일: 제목·주요 버튼·강조 숫자는 둥근 디스플레이 폰트(Baloo 2)로,
       본문/설명 텍스트는 Nunito로 — 헤더 로고에만 적용되던 것을 화면 전체로 확장 */
    h1, h2, h3, .study-card h3, .start-drill-btn, .btn.primary, .drill-kr, .unit-title,
    .streak, .drill-done .score, .lesson-chip, .level-cefr, .drill-label, .home-hero-streak .n {
      font-family: 'Baloo 2', sans-serif;
    }

    /* ── Header (app bar) ── */
    header {
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .logo { font-size: 0.95rem; font-weight: 800; color: var(--text); white-space: nowrap; display: flex; align-items: center; gap: 8px; font-family: 'Baloo 2', sans-serif; }
    .logo-badge {
      width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), #8b7bff);
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
      box-shadow: 0 2px 6px rgba(109,94,240,0.5);
    }
    .logo span { color: var(--text-muted); font-weight: 600; font-size: 0.65rem; margin-left: 2px; }
    .header-controls { display: flex; gap: 6px; align-items: center; }
    select {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 6px 10px; font-size: 0.72rem; font-weight: 700; cursor: pointer; outline: none;
      max-width: 92px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.ok { background: var(--green); }
    .streak {
      font-size: 0.78rem; color: #ffb734; font-weight: 800; white-space: nowrap;
      background: rgba(255,183,52,0.14); border: 1px solid rgba(255,183,52,0.35);
      padding: 5px 10px; border-radius: 999px;
    }

    /* ── Bottom tab bar (app navigation) ── */
    .mode-tabs {
      display: flex; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
      overflow-x: auto; scrollbar-width: none; order: 99;
      padding: 4px 2px calc(env(safe-area-inset-bottom, 0px) + 4px);
      box-shadow: 0 -6px 18px -10px rgba(0,0,0,0.5);
    }
    .mode-tabs::-webkit-scrollbar { display: none; }
    .mode-tab {
      flex: 1 0 auto; min-width: 58px; padding: 7px 4px 5px; background: none; border: none;
      color: var(--text-muted); font-size: 0.62rem; font-weight: 800; cursor: pointer; transition: all 0.18s;
      white-space: nowrap; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .mode-tab .ic { font-size: 1.28rem; line-height: 1; filter: grayscale(0.6) opacity(0.75); transition: filter 0.18s, transform 0.18s; }
    .mode-tab.active { color: var(--primary-light); background: rgba(109,94,240,0.12); }
    .mode-tab.active .ic { filter: none; transform: translateY(-1px) scale(1.08); }

    /* ── Lesson chips (path pills) ── */
    .lesson-bar {
      padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
    }
    .lesson-bar::-webkit-scrollbar { display: none; }
    .lesson-chip {
      flex-shrink: 0; padding: 9px 16px; border-radius: 999px; font-size: 0.78rem; font-weight: 800;
      background: var(--surface2); border: 2px solid var(--border); color: var(--text-muted);
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .lesson-chip.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 3px 0 var(--primary-dk), 0 6px 14px -6px rgba(109,94,240,0.7); }
    .lesson-chip.preview { border-style: dashed; color: #c4b5fd; }
    .lesson-chip.preview.active { background: #7c3aed; border-color: #7c3aed; color: white; box-shadow: 0 3px 0 #5b21b6; }

    /* ── Main panels ── */
    .panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; -webkit-overflow-scrolling: touch; }
    .panel.active { display: flex; }
    .panel-inner { padding: 16px; padding-bottom: 28px; max-width: 760px; width: 100%; margin: 0 auto; }

    /* ── Lesson study ── */
    .study-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card);
    }
    .study-card h3 { font-size: 0.9rem; color: var(--primary-light); margin-bottom: 10px; }
    .point { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .point:last-child { border-bottom: none; }
    .point .en { font-size: 0.9rem; font-weight: 600; }
    .point .kr { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .point .note { font-size: 0.82rem; color: var(--text); line-height: 1.6; margin-top: 6px; padding: 8px 11px;
      background: rgba(99,102,241,0.07); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; }
    .point .note b { color: var(--primary-light); }
    .sec-intro { font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; margin: -2px 0 10px;
      padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .example-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .example-row:last-child { border-bottom: none; }
    .example-row .txt { flex: 1; }
    .speak-mini {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 9px; cursor: pointer; font-size: 0.85rem; flex-shrink: 0; color: var(--text);
    }
    .speak-mini:hover { border-color: var(--primary); }
    .hw-box {
      background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius);
      padding: 12px 14px; font-size: 0.82rem; color: #fcd34d; line-height: 1.6;
    }
    .start-drill-btn {
      width: 100%; padding: 14px; margin-top: 12px; background: var(--primary); border: none;
      border-radius: var(--radius); color: white; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-dk); transition: transform 0.1s, box-shadow 0.1s;
    }
    .start-drill-btn:hover { background: var(--primary-light); }
    .start-drill-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dk); }

    /* ── Drill ── */
    .drill-progress { display: flex; gap: 4px; margin-bottom: 14px; }
    .drill-progress .seg { flex: 1; height: 5px; border-radius: 3px; background: var(--surface2); }
    .drill-progress .seg.ok { background: var(--green); }
    .drill-progress .seg.bad { background: var(--red); }
    .drill-progress .seg.cur { background: var(--primary); }
    .drill-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 24px 20px; text-align: center; box-shadow: var(--shadow-card);
    }
    .drill-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
    .drill-kr { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 6px; }
    .drill-cat { display: inline-block; font-size: 0.7rem; color: var(--primary-light); background: rgba(99,102,241,0.15); padding: 3px 10px; border-radius: 10px; margin-bottom: 16px; }
    .drill-input-row { display: flex; gap: 8px; margin-top: 8px; }
    .drill-input {
      flex: 1; background: var(--surface2); border: 2px solid var(--border); color: var(--text);
      border-radius: var(--radius-sm); padding: 11px 14px; font-size: 0.95rem; outline: none;
    }
    .drill-input:focus { border-color: var(--primary); }
    .drill-feedback { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.6; text-align: left; display: none; }
    .drill-feedback.correct { display: block; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); color: #6ee7b7; }
    .drill-feedback.wrong { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .drill-feedback .target { font-size: 1.05rem; font-weight: 700; color: var(--text); margin: 6px 0; }
    /* 발음 단어별 채점 하이라이트 */
    .pron-words { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
    .pw { padding: 2px 8px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
    .pw.ok { background: rgba(16,185,129,0.18); color: #6ee7b7; }
    .pw.near { background: rgba(245,158,11,0.18); color: #fcd34d; }
    .pw.miss { background: rgba(239,68,68,0.18); color: #fca5a5; text-decoration: underline wavy rgba(239,68,68,0.6); }
    /* 회화 도우미 칩 */
    .helper-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 2px; }
    .helper-chip { padding: 7px 12px; border-radius: 16px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      white-space: nowrap; transition: all .15s; }
    .helper-chip:hover { border-color: var(--primary); background: rgba(99,102,241,0.12); }
    .helper-chip.hint { border-color: rgba(245,158,11,0.5); color: #fcd34d; }
    .drill-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 800; cursor: pointer;
      background: var(--surface2); color: var(--text); border: 2px solid var(--border);
      box-shadow: 0 3px 0 var(--border); transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn.primary { background: var(--primary); color: white; border: 2px solid var(--primary-dk); box-shadow: 0 3px 0 var(--primary-dk); }
    .btn.primary:hover { background: var(--primary-light); }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
    .btn.primary:active { box-shadow: 0 1px 0 var(--primary-dk); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .drill-done { text-align: center; padding: 30px 16px; }
    .drill-done .big { font-size: 2.4rem; margin-bottom: 10px; }
    .drill-done .score { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .drill-done .sub { font-size: 0.84rem; color: var(--text-muted); line-height: 1.6; }

    /* ── Conversation ── */
    #panel-talk { overflow: hidden; }
    .missions {
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .missions-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .mission-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .mission {
      font-size: 0.74rem; padding: 4px 10px; border-radius: 12px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); transition: all 0.3s;
    }
    .mission.done { background: rgba(16,185,129,0.15); border-color: var(--green); color: #6ee7b7; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 13px; scroll-behavior: smooth; }
    .msg { max-width: 84%; display: flex; flex-direction: column; gap: 3px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.ai { align-self: flex-start; align-items: flex-start; }
    .msg.system { align-self: center; max-width: 100%; align-items: center; }
    .bubble { padding: 11px 15px; border-radius: var(--radius); line-height: 1.65; font-size: 0.9rem; word-break: break-word; box-shadow: var(--shadow-press); }
    .msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system .bubble { background: transparent; color: var(--text-muted); font-size: 0.76rem; text-align: center; }
    /* 회화 시작 소개 카드 */
    .talk-intro {
      align-self: stretch; width: 100%; margin: 4px 0 10px;
      background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(124,58,237,0.10));
      border: 1px solid rgba(99,102,241,0.35); border-radius: 14px; padding: 14px 16px;
    }
    .talk-intro .ti-head { font-size: 0.95rem; font-weight: 800; color: #c4b5fd; margin-bottom: 4px; }
    .talk-intro .ti-desc { font-size: 0.84rem; color: var(--text); line-height: 1.55; margin-bottom: 8px; }
    .talk-intro .ti-sec { font-size: 0.78rem; font-weight: 700; color: var(--primary-light); margin: 8px 0 3px; }
    .talk-intro .ti-ex { font-size: 0.82rem; color: var(--text); line-height: 1.7; }
    .talk-intro .ti-ex .k { opacity: 0.55; font-size: 0.76rem; }
    .talk-intro .ti-go { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; }
    .correction-box {
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); border-left: 3px solid var(--yellow);
      border-radius: 0 10px 10px 0; padding: 9px 13px; font-size: 0.82rem; line-height: 1.6; color: #fcd34d; margin-top: 6px; width: 100%;
    }
    .correction-box .label, .explain-box .label { font-size: 0.7rem; font-weight: 700; opacity: 0.7; text-transform: uppercase; margin-bottom: 3px; }
    .wrong { text-decoration: line-through; opacity: 0.6; color: var(--red); }
    .right { color: #86efac; font-weight: 700; }
    .explain-box {
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-left: 3px solid var(--green);
      border-radius: 0 10px 10px 0; padding: 9px 13px; font-size: 0.82rem; line-height: 1.6; color: #6ee7b7; margin-top: 6px; width: 100%;
    }
    .msg-meta { font-size: 0.68rem; color: var(--text-muted); padding: 0 4px; }
    .tr-btn { background: none; border: none; color: var(--primary-light); font-size: 0.7rem; font-weight: 700; cursor: pointer; padding: 0; margin-left: 8px; }
    .tr-btn:hover { text-decoration: underline; }
    .tr-btn:disabled { opacity: 0.5; cursor: default; }
    .tr-box {
      margin-top: 6px; padding: 8px 11px; font-size: 0.83rem; line-height: 1.55; color: var(--text);
      background: rgba(99,102,241,0.10); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0;
    }
    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 13px 17px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    .input-area { padding: 12px 14px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .interim { min-height: 20px; font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 8px; font-style: italic; }
    /* 요약/CAF/새주제/음성진단 미니버튼은 입력줄과 분리된 가로 스크롤 줄에 배치 — 좁은 화면에서 입력줄이 밀리지 않게 함 */
    .mini-actions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
    .mini-actions::-webkit-scrollbar { display: none; }
    .mini-actions .mini-btn { flex-shrink: 0; }
    /* 키보드가 열려 있는 동안 플로팅 질문 버튼이 입력줄을 가리지 않도록 숨김 */
    body.kb-open #ask-fab { display: none; }
    .controls { display: flex; gap: 8px; align-items: center; max-width: 100%; }
    .text-input {
      flex: 1; background: var(--surface2); border: 2px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 11px 16px; font-size: 0.9rem; outline: none;
    }
    .text-input:focus { border-color: var(--primary); }
    .round-btn {
      width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--surface2); font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, box-shadow 0.1s; flex-shrink: 0; color: var(--text);
      box-shadow: 0 3px 0 var(--border);
    }
    .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
    .round-btn.listening { background: var(--primary); box-shadow: 0 3px 0 var(--primary-dk), 0 0 0 0 rgba(109,94,240,0.6); animation: pulse 1.2s infinite; color: white; }
    .round-btn.speaking { background: var(--green); box-shadow: 0 3px 0 var(--green-dk); color: white; }
    .round-btn.send { background: var(--primary); color: white; box-shadow: 0 3px 0 var(--primary-dk); }
    @keyframes pulse { 0%,100% { box-shadow: 0 3px 0 var(--primary-dk), 0 0 0 0 rgba(109,94,240,0.6); } 50% { box-shadow: 0 3px 0 var(--primary-dk), 0 0 0 10px rgba(109,94,240,0); } }
    .mini-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 999px; padding: 6px 12px; font-size: 0.74rem; font-weight: 700; cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary-light); }

    /* ── Review / Progress ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow-card); }
    .stat-card .num { font-size: 1.6rem; font-weight: 800; color: var(--primary-light); font-family: 'Baloo 2', sans-serif; }
    .stat-card .lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; font-weight: 700; }
    .lesson-progress-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 15px; margin-bottom: 8px; box-shadow: var(--shadow-card);
    }
    .lesson-progress-row .top { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 600; margin-bottom: 7px; }
    .lesson-progress-row .top .pct { color: var(--primary-light); }
    .bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 3px; transition: width 0.4s; }
    .mission-history { font-size: 0.74rem; color: var(--text-muted); margin-top: 7px; }
    .empty-note { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 40px 16px; line-height: 1.7; }

    .live-word-chip { display:inline-block; margin:4px 4px 0 0; padding:4px 9px; background:rgba(99,102,241,0.22); border:1px solid rgba(99,102,241,0.35); border-radius:6px; font-size:0.78rem; color:#c4b5fd; cursor:pointer; transition:background 0.12s; }
    .live-word-chip:hover { background:rgba(99,102,241,0.5); color:#fff; }
    /* Groq 연결 표시 dot */
    @keyframes groq-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.85)} }
    .groq-dot { width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;transition:background 0.3s; }
    .groq-dot.ok { background:var(--green); }
    .groq-dot.missing { animation:groq-pulse 1.8s ease-in-out infinite; }
    /* 복습 탭 배지 */
    .review-badge { font-size:0.63rem;background:var(--red);color:#fff;border-radius:9px;padding:1px 5px;margin-left:3px;font-weight:800;vertical-align:middle;line-height:1; }
    .vsent.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: rgba(99,102,241,0.07); }
    .vsent { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .vsent .v-en { font-size: 0.96rem; font-weight: 600; line-height: 1.5; }
    .vsent .v-ko { font-size: 0.84rem; color: var(--primary-light); margin-top: 4px; line-height: 1.5; }
    .vsent .v-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.6; background: var(--surface2); border-radius: 8px; padding: 7px 10px; }
    .vsent .v-actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
    .v-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .v-word { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 0.78rem; cursor: pointer; transition: background 0.12s; }
    .v-word:hover { background: var(--primary); color: #fff; }
    .v-word b { color: var(--text); font-weight: 700; }
    .v-word span { color: var(--text-muted); margin-left: 4px; }

    .sync-word { cursor: pointer; border-radius: 4px; padding: 0 1px; transition: background 0.12s, color 0.12s; }
    .sync-word:hover { background: var(--surface2); }
    .sync-word.on { background: var(--primary); color: #fff; }
  </style>
</head>

  {

      { title: "① 현재형 문장 만들기 (주어 + 동사)", intro: "영어 문장의 기본 뼈대는 '주어(누가) + 동사(무엇을 한다)'입니다. 평소·반복되는 일은 모두 현재형으로 말해요. 한국어 '나는 밥을 먹는다'처럼요.", points: [
        { en: "I / You / We / They + 동사원형", kr: "예: I eat, You study, They go",

      { title: '① 기본 인사', intro: '처음 만나거나 안부를 물을 때 쓰는 가장 기본적인 표현입니다. 시간대와 상황에 맞춰 골라 쓰면 됩니다.', points: [
        { en: 'Hello! / Hi! / Good morning!', kr: '기본 인사 — 아침엔 Good morning',
          note: '**Hi**는 친근하게 아무 때나, **Hello**는 조금 더 정중하게. 시간대 인사도 있어요.\n• Good **morning**(오전) / Good **afternoon**(오후) / Good **evening**(저녁)' },
        { en: 'Nice to meet you.', kr: '만나서 반가워요 (처음 만났을 때)',
          note: '**처음** 만난 사람에게만 씁니다. 헤어질 땐 과거형으로 **Nice to meet you.**가 아니라 **It was nice meeting you.**\n• 상대가 먼저 말하면: Nice to meet you, **too**.' },
        { en: "How are you? — I'm good, thanks. And you?", kr: '안부 묻고 답하기',
          note: '안부를 물으면 답하고 **되물어 주는** 게 자연스러워요.\n• I\'m **good** / **great** / **not bad**, thanks. **And you?**' },
      ]},
      { title: '② 자기소개', intro: '이름 → 출신 → 좋아하는 것 순서로 말하면 짧고 깔끔한 자기소개가 됩니다.', points: [
        { en: "My name is... / I'm...", kr: '이름 말하기',
          note: '둘 다 같은 뜻. **I\'m + 이름**이 더 캐주얼합니다.\n• **My name is** Taehyun. = **I\'m** Taehyun.' },
        { en: "I'm from Seoul, Korea.", kr: '출신 말하기',
          note: '출신지는 **I\'m from + 장소**.\n• I\'m **from** Busan. / Where are you **from**? (어디서 왔어요?)' },
        { en: 'I like / enjoy + 동사ing', kr: 'I like watching movies (좋아하는 것)',
          note: '좋아하는 활동은 동사에 **-ing**.\n• I like **watching** movies. / I enjoy **cooking**. (like 뒤엔 to부정사도 가능: like to watch)' },
      ]},
    ],
    examples: [
      { en: 'Hello! Nice to meet you.', kr: '안녕하세요! 만나서 반가워요.' },
      { en: "My name is Taehyun. I'm from Seoul.", kr: '제 이름은 태현이고, 서울에서 왔어요.' },
      { en: 'I like watching movies.', kr: '저는 영화 보는 것을 좋아해요.' },
    ],
    homework: '거울 보고 30초 자기소개 스피치 연습 + 녹음',
    scenario: { title: '첫 만남 자기소개', desc: 'AI가 처음 만난 외국인 친구가 됩니다. 인사하고 서로 소개해 보세요.' } },
  { id: 202, master: 'A1', title: '숫자 & 날짜',
    sections: [
      { title: '① 숫자 & 나이', intro: '숫자는 회화의 기본 재료입니다. 특히 13과 30처럼 헷갈리는 발음을 정확히 구분해 보세요.', points: [
        { en: 'thirteen(13) vs thirty(30) — 강세가 핵심', kr: '-teen은 뒤를, -ty는 앞을 강하게',
          note: '둘을 가르는 건 **강세 위치**입니다.\n• thir**TEEN**(13) — 뒤를 세게, 끝을 길게\n• **THIR**ty(30) — 앞을 세게, 끝은 약하게\n같은 패턴: fourteen↔forty, fifteen↔fifty' },
        { en: 'I am thirty years old.', kr: '나이 말하기',
          note: '나이는 **be동사 + 숫자 + years old**.\n• How old are you? — I\'m **thirty (years old)**. (years old는 생략 가능)' },
      ]},
      { title: '② 시간 & 날짜', intro: '약속을 잡으려면 시간·요일·날짜를 말할 수 있어야 해요. 전치사 짝꿍을 함께 외우세요.', points: [
        { en: "What time is it? — It's three thirty.", kr: '시간 묻고 답하기 (3:30)',
          note: '시간은 **시 + 분** 순서로 그냥 읽으면 됩니다.\n• 3:30 → **three thirty** / 7:15 → **seven fifteen**\n• 정각은 o\'clock: 5:00 → **five o\'clock**' },
        { en: "What day is it today? — It's Friday.", kr: '요일 묻기 / Monday~Sunday',
          note: '요일은 항상 **대문자**로 시작.\n• Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday\n• 요일 앞 전치사는 **on**: **on** Friday' },
        { en: 'My birthday is on May 5th.', kr: '날짜 앞엔 on / 서수(5th) 사용',
          note: '날짜는 **서수**(다섯 번째)로 읽습니다.\n• May **5th**(fifth), June **1st**(first), March **3rd**(third)\n• 특정 날짜 앞엔 **on**: **on** May 5th' },
      ]},
    ],
    examples: [
      { en: "What time is it? It's three thirty.", kr: '몇 시예요? 3시 30분이에요.' },
      { en: 'My birthday is on May 5th.', kr: '제 생일은 5월 5일이에요.' },
      { en: 'I am thirty years old.', kr: '저는 30살입니다.' },
    ],
    homework: '오늘 하루 일과를 시간과 함께 5문장으로 말해보기 (At 7, I wake up...)',
    scenario: { title: '약속 잡기', desc: 'AI와 만날 요일·시간을 정해 보세요. 숫자와 날짜를 영어로!' } },
  { id: 203, master: 'A1', title: '관사 & 명사',
    sections: [
      { title: '① 관사 a / an / the', intro: '한국어엔 없는 개념이라 어렵게 느껴지지만, "아무거나 하나"면 a/an, "바로 그것"이면 the로 기억하세요.', points: [
        { en: 'a + 자음 소리: a book / an + 모음 소리: an apple', kr: '막연한 하나',
          note: '여럿 중 **아무거나 하나**일 때. 뒤 단어가 모음 소리면 **an**.\n• **a** book, **a** car / **an** apple, **an** hour(h 묵음 → an)' },
        { en: 'the: 서로 아는 특정한 것', kr: 'Please close the door (그 문)',
          note: '말하는 사람과 듣는 사람이 **둘 다 아는** 그것.\n• Please close **the** door. (지금 여기 있는 그 문)\n• 세상에 하나뿐인 것: **the** sun, **the** sky' },
      ]},
      { title: '② 복수형 & 소유격', intro: '둘 이상이면 명사에 -s를 붙이고, "누구의 것"인지는 소유격으로 표현합니다.', points: [
        { en: '복수형: books, apples / -es: boxes, watches', kr: '둘 이상이면 -s/-es',
          note: '보통 **-s**, 끝이 s·x·ch·sh면 **-es**.\n• book→book**s**, box→box**es**, watch→watch**es**\n• 불규칙: child→**children**, man→**men**, foot→**feet**' },
        { en: 'my / your / his / her / our / their + 명사', kr: 'This is my bag (소유격)',
          note: '명사 앞에 붙여 **누구의 것**인지 표시.\n• **my** bag(내), **your** car(네), **his/her** name(그의/그녀의), **our/their** house(우리/그들의)' },
      ]},
    ],
    examples: [
      { en: 'I have a book and an apple.', kr: '나는 책 한 권과 사과 하나가 있다.' },
      { en: 'Please close the door.', kr: '그 문을 닫아주세요.' },
      { en: 'This is my bag. Her name is Suji.', kr: '이것은 내 가방이야. 그녀의 이름은 수지야.' },
    ],
    homework: '내 방에 있는 물건 10개를 a/an/the/my를 붙여 말해보기',
    scenario: { title: '내 물건 소개', desc: '가지고 있는 물건들을 관사·소유격을 써서 소개해 보세요.' } },
  { id: 204, master: 'A1', title: 'be 동사 기초',
    sections: [
      { title: '① be동사 — am / is / are', intro: 'be동사는 "~이다 / ~에 있다 / ~한 상태다"를 나타내는 가장 기본 동사입니다. 주어마다 짝이 정해져 있어요.', points: [
        { en: 'I am / You are / He·She·It is / We·They are', kr: '주어마다 짝이 정해져 있어요',
          note: '주어에 맞는 be동사를 외워두세요.\n• **I am**(I\'m) / **You are**(You\'re) / **He/She/It is**(He\'s) / **We/They are**(We\'re)' },
        { en: '뒤에 명사·형용사: I am a student / I am tired', kr: '직업·상태·기분 표현',
          note: 'be동사 뒤에 **직업**(명사)이나 **상태·기분**(형용사)을 붙입니다.\n• I am **a teacher**. (직업) / I am **happy**. (기분) / She is **kind**. (성격)' },
      ]},
      { title: '② 부정 & 의문', intro: '"아니다"는 not을 넣고, "~이니?"는 be동사를 맨 앞으로 보냅니다.', points: [
        { en: "부정: I'm not / isn't / aren't", kr: 'They are not busy',
          note: 'be동사 뒤에 **not**.\n• I\'m **not** tired. / She **isn\'t**(is not) here. / They **aren\'t**(are not) busy.' },
        { en: "의문: Are you...? Is she...? — Yes, I am / No, she isn't", kr: 'be동사를 앞으로',
          note: 'be동사를 **문장 맨 앞**으로 옮기면 질문이 됩니다.\n• **Are you** tired? — Yes, I **am**. / No, I\'m **not**.\n• **Is she** a doctor? — Yes, she **is**.' },
      ]},
    ],
    examples: [
      { en: 'I am a student. She is a doctor.', kr: '나는 학생이다. 그녀는 의사다.' },
      { en: 'They are not busy today.', kr: '그들은 오늘 바쁘지 않다.' },
      { en: 'Are you tired? — Yes, I am.', kr: '피곤하니? — 응, 맞아.' },
    ],
    homework: '나/가족/친구를 be동사로 소개하는 문장 10개 만들기',
    scenario: { title: '기분과 상태 말하기', desc: 'AI가 기분·직업·상태를 물어봅니다. be동사로 답하세요.' } },
  { id: 205, master: 'A1', title: '가족 & 묘사',
    sections: [
      { title: '① 가족 어휘', intro: '가족을 소개하려면 구성원 단어와 "몇 명인지" 말하는 법이 필요해요.', points: [
        { en: 'mother / father / sister / brother / parents', kr: '가족 구성원',
          note: '캐주얼하게는 **mom/dad**.\n• 손위/손아래 구분이 필요하면: **older** sister(누나·언니), **younger** brother(남동생)\n• parents(부모), grandparents(조부모)' },
        { en: 'There are four people in my family.', kr: '가족 수 말하기',
          note: '인원수는 **There are + 숫자 + people in my family**.\n• There **are** four people... / 한 명이면 There **is** one person...' },
      ]},
      { title: '② 사람 묘사 — be / has / look like', intro: '외모와 성격을 말하는 세 가지 틀: 성격·상태는 be, 가진 특징은 has, 닮음은 look like.', points: [
        { en: 'He is tall / short / funny / kind', kr: 'be + 형용사로 묘사',
          note: '키·성격·인상은 **be + 형용사**.\n• He **is** tall. / She **is** funny. / They **are** friendly.' },
        { en: 'She has brown eyes / long hair', kr: 'has로 특징 말하기',
          note: '눈·머리 등 **가진 특징**은 **have/has**.\n• She **has** long hair. / He **has** brown eyes. (3인칭 단수는 has)' },
        { en: 'He looks like his father.', kr: '~를 닮았다',
          note: '닮았다는 **look like + 사람**.\n• You **look like** your mom. (엄마 닮았네)\n• 참고: He **looks** tired.(피곤해 보여)는 like 없이 형용사' },
      ]},
    ],
    examples: [
      { en: 'There are four people in my family.', kr: '우리 가족은 4명이다.' },
      { en: 'My sister is funny. She has long hair.', kr: '내 여동생은 재밌고 머리가 길다.' },
      { en: 'He looks like his father.', kr: '그는 아버지를 닮았다.' },
    ],
    homework: '가족 1명을 골라 5문장으로 묘사하고 녹음하기',
    scenario: { title: '가족 소개', desc: 'AI에게 가족을 소개하세요. 외모와 성격도 묘사해 보세요.' } },

  /* ── B1 중급 ── */
  { id: 301, master: 'B1', title: '현재 완료',
    sections: [
      { title: '① have/has + 과거분사 (현재완료)', intro: '"지금까지 ~해 봤다 / 막 ~했다"처럼 과거의 일이 지금과 연결될 때 씁니다. 형태는 have/has + 과거분사(p.p.).', points: [
        { en: 'I have been to Japan. — 가 본 적 있다 (경험)', kr: 'have/has + p.p.',

        { en: 'Have you ever eaten kimchi?', kr: '~해 본 적 있어? (ever = 한 번이라도)',

        { en: "I haven't watched it yet.", kr: 'yet(아직) — 부정문·의문문 끝에',

      { title: '② 과거형 vs 현재완료', intro: '둘 다 지난 일이지만, "언제"가 중요하면 과거형, "경험·결과"가 중요하면 현재완료입니다.', points: [

    examples: [

      { en: 'Have you ever eaten Korean BBQ?', kr: '한국식 바비큐 먹어 본 적 있어?' },
      { en: "I haven't finished my homework yet.", kr: '아직 숙제를 못 끝냈어.' },

  { id: 302, master: 'B1', title: '비교급 & 최상급',
    sections: [
      { title: '비교급', intro: '두 가지를 서로 비교할 때 사용합니다. 형용사의 **길이(음절 수)**에 따라 형태가 달라집니다.', points: [
        { en: '짧은 단어 + er: bigger, faster + than', kr: 'Seoul is bigger than Busan',
          note: '음절이 **1~2개**인 짧은 형용사는 끝에 **-er**을 붙이고 than으로 비교합니다.\n**big→bigger, fast→faster, old→older**\ne로 끝나면 r만(nice→nicer), 단모음+자음이면 자음을 하나 더(big→bigger, hot→hotter).' },
        { en: '긴 단어: more + 형용사', kr: 'more interesting than',
          note: '음절이 **3개 이상**인 형용사 앞에 **more**를 붙입니다.\n**more interesting, more expensive, more comfortable**\n2음절 형용사는 두 방법 모두 가능: cleverer / more clever.' },
        { en: 'as + 형용사 + as: 만큼 ~하다', kr: 'He is as tall as me',
          note: '두 대상이 **같은 정도**임을 표현합니다.\n**as tall as me = 나만큼 키가 크다**\n부정형: **not as tall as = 나만큼 크지 않다**' },
      ]},
      { title: '최상급', intro: '셋 이상 중에서 가장 높은(낮은) 정도를 표현할 때 씁니다. 반드시 **the**를 붙입니다.', points: [
        { en: 'the + est / the most + 형용사', kr: 'the best, the most famous',
          note: '짧은 단어: **the + -est** → the tallest, the fastest\n긴 단어: **the most** → the most beautiful\n최상급 앞에는 **반드시 the**를 쓰세요!' },
        { en: '불규칙: good-better-best / bad-worse-worst', kr: '',
          note: '자주 쓰이는 **불규칙 비교급·최상급**:\ngood → better → **best**\nbad → worse → **worst**\nlittle → less → **least**\nfar → farther → farthest (거리) / further → furthest (정도)\n꼭 외워 두세요.' },
      ]},
    ],
    examples: [
      { en: 'Seoul is bigger than Busan.', kr: '서울은 부산보다 크다.' },
      { en: 'This is the best restaurant in town.', kr: '여기가 동네 최고의 식당이다.' },
      { en: 'English is more interesting than I thought.', kr: '영어는 생각보다 재미있다.' },
    ],
    homework: '내 주변 사물·사람을 비교하는 문장 10개 (비교급 5 + 최상급 5)',
    scenario: { title: '베스트 추천 토크', desc: '최고의 음식·영화·장소를 비교급·최상급으로 추천해 보세요.' } },
  { id: 303, master: 'B1', title: '조동사',
    sections: [
      { title: '능력 & 요청', intro: '조동사는 동사 앞에 붙어 **가능성·허락·요청·조언·의무·추측** 등의 의미를 더합니다. 조동사 다음에는 반드시 **동사 원형**을 씁니다.', points: [
        { en: 'can: 능력/허락 — I can swim.', kr: '~할 수 있다',
          note: '**can + 동사 원형**으로 능력(~할 수 있다) 또는 허락(~해도 돼)을 표현합니다.\n과거형: **could** — I could swim when I was young (어렸을 때 수영할 수 있었다).' },
        { en: 'Could you...?: 정중한 요청', kr: 'Could you open the window?',

      { title: '조언 & 의무 & 추측', intro: '상대에게 조언할 때, 의무를 강조할 때, 가능성을 추측할 때 각각 다른 조동사를 씁니다.', points: [
        { en: 'should: 조언 — You should get some rest.', kr: '~하는 게 좋겠다',
          note: '**should + 동사 원형**으로 조언 또는 권고를 표현합니다.\nmust보다 **부드러운 표현**입니다.\n부정형: **shouldn\'t** = ~하지 않는 게 좋겠어.' },
        { en: 'must: 의무 — I must go now.', kr: '반드시 ~해야 한다',
          note: '**must + 동사 원형**은 강한 의무(꼭 해야 한다)를 나타냅니다.\n구어에서는 **have to**로 대체되는 경우가 많습니다.\n**mustn\'t** = 절대 ~해서는 안 된다 (금지).' },
        { en: 'might: 추측 — It might rain tomorrow.', kr: '~일지도 모른다',

  { id: 304, master: 'B1', title: '여행 & 길 찾기',
    sections: [

        { en: 'Excuse me, where is the station?', kr: '실례합니다, 역이 어디인가요?',

  { id: 305, master: 'B1', title: '경험 & 의견 말하기',
    sections: [
      { title: '의견 표현', intro: '영어 대화에서 의견을 말할 때는 **"I think...", "In my opinion..."** 같은 표현으로 시작하면 자연스럽게 주장을 펼칠 수 있습니다. 이런 표현을 **opinion marker**라 합니다.', points: [
        { en: "I think it's a good idea.", kr: '내 생각엔 ~인 것 같아',
          note: '가장 많이 쓰이는 의견 표현. **I think + 주어 + 동사** 구조.\n비슷한 표현:\n**I feel that...** (감정적 의견)\n**I believe that...** (강한 확신)' },
        { en: 'In my opinion, English is important.', kr: '제 의견으로는',
          note: '의견 표현을 문장 앞에 붙이는 방식.\n**In my opinion,** / **From my perspective,** = 제 관점에서.\n논설이나 발표에서도 자주 씁니다.' },
        { en: 'As far as I know, ...', kr: '제가 알기로는',
          note: '자신이 아는 한도 내에서 말할 때 씁니다.\n확신이 100%가 아닐 때 **As far as I know** 로 시작하면 자연스럽게 책임 범위를 줄일 수 있습니다.' },
      ]},
      { title: '동의 & 반대', intro: '상대방 의견에 동의하거나 반대할 때 다양한 표현을 쓰면 대화가 풍성해집니다. **"That makes sense, but..."** 처럼 일부 인정 후 반론을 이어가는 방식이 자연스럽습니다.', points: [
        { en: 'I agree with you. / I totally agree.', kr: '동의해요',
          note: '동의를 표현하는 표현들.\n강조하려면 **totally / completely / absolutely** 를 추가합니다.\n영국식으로는 "**Absolutely!**" 만 쓰기도 합니다.' },
        { en: "I'm sorry, but I disagree.", kr: '미안하지만 생각이 달라요 (부드러운 반대)',
          note: '반대 의견을 부드럽게 말하는 방법.\n"I disagree" 앞에 **I\'m sorry, but** / **With all due respect,** 을 붙이면 훨씬 정중합니다.' },
        { en: 'That makes sense, but...', kr: '일리 있지만... (반론 연결)',
          note: '상대방 의견의 일부를 인정한 뒤 반론을 이어가는 표현.\n비슷한 패턴:\n"**That\'s a good point, however...**"\n"**I see what you mean, but...**"' },
      ]},
    ],
    examples: [
      { en: "I think it's a good idea.", kr: '좋은 아이디어인 것 같아요.' },
      { en: 'In my opinion, breakfast is the most important meal.', kr: '제 생각엔 아침이 가장 중요한 식사예요.' },
      { en: "I'm sorry, but I disagree.", kr: '미안하지만 동의하지 않아요.' },

    homework: '좋아하는 주제 1개에 대해 내 의견 + 이유 2개를 말하고 녹음하기',
    scenario: { title: '미니 토론', desc: 'AI가 가벼운 주제(아침형 vs 저녁형 등)를 던집니다. 의견을 말해 보세요.' } },

  { id: 401, master: 'B2', title: '가정법',
    sections: [
      { title: '1차 가정 (현실 가능)', intro: '가정법은 "만약 ~라면 ~할 텐데"처럼 **가상의 상황**을 표현합니다.\n**가능성이 높은 미래** → 1차 가정법\n**현재 사실과 반대** → 2차 가정법\n**과거 사실과 반대** → 3차 가정법', points: [
        { en: 'If + 현재, will: If it rains, I will stay home.', kr: '비가 오면 집에 있을 거야',
          note: '**조건절(if)에 현재 시제** + **주절에 will**.\n실제로 일어날 수 있는 가능한 상황입니다.\n패턴: **If + 현재, will + 동사 원형**\n⚠️ **if절에는 will을 쓰지 않습니다!**' },
      ]},
      { title: '2차 가정 (현재 반대)', intro: '현재 사실과 **반대**되는 상황을 상상할 때 씁니다. 실제로는 돈이 없지만 "만약 있다면"처럼 가상의 현재 상황을 표현합니다.', points: [
        { en: 'If + 과거, would: If I had more money, I would travel.', kr: '돈이 더 있다면 여행 갈 텐데',
          note: '**if절에 과거 시제, 주절에 would**.\n실제로는 돈이 없지만 가상으로 상상하는 것.\n패턴: **If + 과거, would + 동사 원형**\n줄여서 **I\'d** 라고도 합니다.' },
        { en: "If I were you, I wouldn't buy it.", kr: '내가 너라면 (were 사용!)',
          note: '**if절에서 be동사는 주어에 상관없이 were**를 씁니다(문법 규칙).\n✓ **If I were** (×If I was)\n조언할 때 자주 쓰이는 패턴:\n"**If I were you, I would...**"' },
      ]},
      { title: '3차 가정 (과거 반대)', intro: '이미 일어난 **과거 사실과 반대**되는 상황을 상상할 때 씁니다. 후회나 아쉬움을 표현할 때 가장 자주 씁니다.', points: [

      ]},
    ],
    examples: [

      { en: 'What would you do if you won the lottery?', kr: '복권에 당첨되면 뭘 할 거야?' },

  { id: 402, master: 'B2', title: '수동태',

  { id: 403, master: 'B2', title: '간접화법',
    sections: [
      { title: '말 전달하기', intro: '간접화법(reported speech)은 다른 사람이 한 말을 그대로 옮기지 않고 **자신의 말로 전달**하는 방법입니다. 핵심은 **시제를 한 단계 과거로** 바꾸는 것입니다.', points: [

        { en: 'break a leg = 행운을 빌어', kr: '공연·시험 앞둔 사람에게',

  { id: 405, master: 'B2', title: '토론 & 의견 표현',
    sections: [
      { title: '논리 전개', intro: '논리적으로 의견을 전달하려면 **연결어(discourse marker)**를 잘 써야 합니다. 이 표현들은 발표·토론·면접에서도 상대방에게 명료한 인상을 줍니다.', points: [
        { en: 'On the one hand... / On the other hand...', kr: '한편으로는 / 다른 한편으로는',
          note: '**한쪽 입장 → 반대 입장** 을 균형 있게 제시하는 구조.\n"**On the one hand**, it\'s expensive. **On the other hand**, the quality is excellent."' },
        { en: 'However / Nevertheless / Despite this', kr: '그러나 / 그럼에도 불구하고',
          note: '**역접 연결어**:\n**However** = 그러나 (가장 중립적)\n**Nevertheless** = 그럼에도 불구하고 (강한 역접)\n**Despite this** = 이럼에도 불구하고\n앞 문장과 반대되는 내용을 연결합니다.' },
        { en: 'I strongly believe that...', kr: '강하게 주장하기',
          note: '강도별 의견 표현:\n**I think** (가벼운 의견)\n**I believe** (확신)\n**I strongly believe** (강한 확신)\n**I am absolutely convinced that** (최강 확신)' },
        { en: 'To sum up, the pros outweigh the cons.', kr: '요약: 장점이 단점보다 많다',
          note: '결론 연결어: **To sum up / In conclusion / All in all**\n**pros** = 장점(찬성 이유), **cons** = 단점(반대 이유)\n"The pros **outweigh** the cons." = 장점이 단점보다 크다.' },
      ]},
    ],
    examples: [
      { en: 'On the one hand, it is expensive. On the other hand, the quality is great.', kr: '한편으론 비싸지만, 다른 한편으론 품질이 좋다.' },
      { en: 'I strongly believe that education is the key.', kr: '나는 교육이 핵심이라고 강하게 믿는다.' },
      { en: 'To sum up, the pros outweigh the cons.', kr: '요약하면 장점이 단점보다 많다.' },
    ],
    homework: '찬반이 갈리는 주제 1개를 골라 찬성 2 + 반대 2 + 결론 1문장 만들기',
    scenario: { title: '⚖️ 미니 디베이트', desc: 'AI가 반대 입장을 맡습니다. 논리 표현으로 설득해 보세요.' },
    roleplay: '당신은 토론 상대 역할입니다. 사용자가 의견을 말하면 정중하게 반대 논거를 1개씩 제시해 토론을 이어가세요. 사용자가 논리 연결어를 쓰도록 유도하세요.' },

  /* ── C1 고급 ── */
  { id: 501, master: 'C1', title: '동명사 & 부정사 뉘앙스',
    sections: [
      { title: '의미가 달라지는 동사', intro: '일부 동사는 뒤에 **동명사(-ing)**가 오느냐 **부정사(to + 동사)**가 오느냐에 따라 **뜻이 완전히 달라집니다.** C1 핵심 문법으로, 원어민은 직관적으로 구분하지만 학습자에게는 어렵습니다.', points: [
        { en: 'stop to buy (사려고 멈춤) vs stop smoking (끊음)', kr: 'to = 목적, -ing = 하던 행동',
          note: '**stop + to부정사** = ~하기 위해 하던 일을 멈추다 (목적)\n**stop + 동명사** = ~하는 것을 완전히 그만두다 (종료)\n예: "She **stopped to check** her phone." (폰 보려고 멈췄다)\nvs "She **stopped checking** her phone." (폰 보는 것을 끊었다)' },
        { en: 'remember to lock (할 것을 기억) vs remember meeting (했던 것을 기억)', kr: '미래 vs 과거',
          note: '**remember + to부정사** = 앞으로 해야 할 것을 기억하다 (미래)\n**remember + 동명사** = 과거에 했던 것을 기억하다 (과거)\n예: "**Remember to send** the email." (보내는 것 잊지 마)\nvs "I **remember sending** it." (보냈던 기억이 나)' },
        { en: 'regret telling (말한 것을 후회) vs regret to tell (유감이지만 전한다)', kr: '',
          note: '**regret + 동명사** = 과거에 한 것을 후회한다\n**regret + to부정사** = 유감스럽게도 ~를 알려드립니다 (공식 표현)\n예: "I **regret telling** him." (말한 걸 후회)\nvs "We **regret to inform** you that..." (유감스럽게도 알려드립니다)' },
        { en: 'try to open (애써 시도) vs try opening (시험삼아 해보다)', kr: '',
          note: '**try + to부정사** = ~하려고 애쓰다 (어려워서 노력 필요)\n**try + 동명사** = 혹시 되나 시험삼아 해보다\n예: "I **tried to open** the jar but it was stuck." (열려고 했지만 안 됐다)\nvs "**Try opening** the window — it might help." (창문 열어 봐)' },
      ]},
    ],
    examples: [
      { en: 'I stopped smoking last year.', kr: '나는 작년에 담배를 끊었다.' },
      { en: 'Remember to lock the door.', kr: '문 잠그는 거 기억해.' },
      { en: 'I regret telling him the secret.', kr: '그에게 비밀을 말한 걸 후회해.' },
    ],
    homework: 'stop/remember/regret/try 각각 두 가지 뜻으로 문장 8개 만들기',
    scenario: { title: '후회 & 다짐 토크', desc: '후회하는 일과 새 다짐을 동명사/부정사 뉘앙스를 살려 말해 보세요.' } },
  { id: 502, master: 'C1', title: '고급 어휘 & 연어',
    sections: [
      { title: '연어 (collocations)', intro: '연어(collocation)란 **원어민이 자연스럽게 함께 쓰는 단어 조합**입니다. 문법적으로 맞더라도 자연스럽지 않은 조합이 있습니다. (예: do a mistake ✗ → make a mistake ✓)', points: [
        { en: 'make a decision / make progress / make an effort', kr: 'do가 아니라 make!',
          note: '**make**와 짝을 이루는 표현들:\n✓ **make** a mistake / a decision / a suggestion / progress / a noise\n✗ do a mistake / do a decision\ndo와 헷갈리기 쉬우니 통째로 암기하세요.' },
        { en: 'take a risk / take responsibility', kr: '',
          note: '**take**와 어울리는 표현들:\n✓ **take** a risk / a chance / responsibility / advantage of / a break / a look\n"**Take a break**" = 쉬다\n"**Take a risk**" = 위험을 감수하다' },
        { en: 'pay attention to details', kr: '주의를 기울이다',
          note: '**pay**와 어울리는 표현들:\n✓ **pay** attention to / a compliment / a visit / a fine / tribute to\n"**Pay attention to details**" = 세부 사항에 주의를 기울이다\n업무·발표에서 자주 씁니다.' },
      ]},
      { title: '강한 형용사', intro: '**very**를 쓰는 대신 의미가 강화된 단어 하나로 바꾸면 더 영어다운 표현이 됩니다. 이를 **extreme adjective(극단 형용사)**라고 합니다.', points: [
        { en: 'very good → brilliant / very angry → furious', kr: 'very 없이 한 단어로',
          note: '**very + 보통 형용사 → 극단 형용사** 변환:\nvery good → **excellent / brilliant / outstanding**\nvery bad → **terrible / awful / dreadful**\nvery angry → **furious / livid**\nvery happy → **thrilled / ecstatic**' },
        { en: 'very tired → exhausted / very big → enormous', kr: '',
          note: '계속:\nvery tired → **exhausted**\nvery big → **enormous / huge / massive**\nvery small → **tiny / minute**\nvery cold → **freezing** | very hot → **boiling / scorching**\nvery funny → **hilarious**\n⚠️ 극단 형용사 앞에는 **very 대신 absolutely/completely**를 씁니다.' },
      ]},
    ],
    examples: [
      { en: 'We have to make a difficult decision.', kr: '우리는 어려운 결정을 내려야 한다.' },
      { en: 'He took a big risk and it paid off.', kr: '그는 큰 위험을 감수했고 성과를 거뒀다.' },
      { en: 'The movie was absolutely brilliant.', kr: '그 영화는 정말 훌륭했다.' },
    ],
    homework: 'very + 형용사 문장 5개를 강한 형용사 한 단어로 바꿔 말하기',
    scenario: { title: '리뷰어 되기', desc: '최근 본 영화·음식점을 강한 형용사와 연어로 리뷰해 보세요.' } },
  { id: 503, master: 'C1', title: '발표 & 프레젠테이션',
    sections: [
      { title: '발표 흐름 표현', intro: '발표는 **도입 → 본론 → 결론**의 3단계 구조를 따릅니다. 각 단계에서 쓰는 영어 표현을 알아 두면 더 전문적이고 자신감 있게 발표할 수 있습니다.', points: [
        { en: "Today I'd like to present...", kr: '발표 시작',
          note: '**발표 시작 표현**:\n"**Today I\'d like to present/talk about/discuss...**"\n또는 "Good morning, everyone. My name is ___ and today I\'d like to..."\n첫 문장이 청중의 집중을 잡습니다.' },
        { en: 'Firstly... / Secondly... / Finally...', kr: '순서 전개',
          note: '**순서 나열 표현**:\n**Firstly / First of all**\n→ **Secondly / Then / Next**\n→ **Finally / Lastly / To wrap up**\n항목이 세 개 이상일 때: "I have **three main points**..."로 먼저 예고하면 청중이 따라오기 쉽습니다.' },
        { en: 'As you can see, sales have increased.', kr: '자료 가리키기',
          note: '**자료·슬라이드 가리키기**:\n"**As you can see** in this graph..."\n"**This chart shows** that..."\n"**Looking at** these figures..."\n시각 자료를 설명할 때 쓰는 표현들입니다.' },
        { en: 'In conclusion... / Do you have any questions?', kr: '마무리 & 질의응답',
          note: '**발표 마무리**:\n"**In conclusion** / To sum up / To wrap up, ..." 으로 결론.\n"**Thank you for your attention.**"\n"Does anyone have any **questions**?" 로 마무리합니다.' },
      ]},
    ],
    examples: [
      { en: "Today I'd like to present our new project.", kr: '오늘 새 프로젝트를 발표하겠습니다.' },
      { en: 'As you can see, sales have increased by 20%.', kr: '보시다시피 매출이 20% 증가했습니다.' },

    roleplay: '당신은 발표를 듣는 청중 역할입니다. 사용자가 발표하면 경청하고, 발표가 끝나면 내용에 대한 질문을 1개씩 던지세요. 발표 표현(Firstly, In conclusion 등)을 쓰도록 유도하세요.' },
  { id: 504, master: 'C1', title: '뉘앙스 & 화용론',
    sections: [
      { title: '부드럽게 말하기 (hedging)', intro: '**Hedging**이란 단정적인 주장을 완화해 더 정중하거나 겸손하게 말하는 기법입니다. 영어 원어민, 특히 영국식 대화에서 의견을 직접적으로 표현하기보다 hedging 표현으로 부드럽게 전달합니다.', points: [
        { en: "I might be wrong, but I don't think that's true.", kr: '단정 대신 완곡하게',
          note: '자신의 의견이 틀릴 수 있음을 인정하며 부드럽게 반박하는 표현.\n비슷한 패턴:\n"**Correct me if I\'m wrong, but...**"\n"**With all due respect,...**"' },
        { en: "That's not ideal. (= 별로다)", kr: '영어식 절제 표현 (understatement)',
          note: '실제보다 덜 강하게 말하는 **understatement(절제 표현)**:\n**"That\'s not ideal."** = 별로다 (very bad)\n**"Not bad."** = 꽤 좋다\n**"A bit tricky."** = 매우 어렵다\n영국식 영어에서 특히 자주 씁니다.' },
        { en: 'Would you mind if I opened the window?', kr: '아주 정중한 부탁',
          note: '**"Would you mind if + 과거 시제?"** = 가장 정중한 부탁 방식.\n**Yes, I mind.** = 싫어요\n**No, go ahead.** = 괜찮아요 (열어도 됩니다)\n⚠️ Yes/No 응답 방향이 한국어와 반대이니 주의!' },
        { en: "To be honest, it wasn't great.", kr: '솔직히 말하면',
          note: '"**To be honest / Frankly speaking / To tell you the truth...**" = 솔직히 말하자면.\n부드러운 부정적 평가를 할 때 앞에 이 표현을 붙이면 충격이 완화됩니다.' },
      ]},

    examples: [

      { en: "Hmm, that's not ideal.", kr: '음, 그건 좀 별로네요. (완곡)' },
      { en: 'Would you mind if I opened the window?', kr: '창문을 열어도 될까요?' },
    ],
    homework: '직설적인 문장 5개를 완곡한 영어식 표현으로 바꿔 말하기',
    scenario: { title: '정중하게 거절하기', desc: 'AI의 제안을 부드럽게 거절하고 대안을 제시해 보세요.' } },
  { id: 505, master: 'C1', title: '복합 담화 & 응집성',
    sections: [
      { title: '담화 연결어', intro: '복잡한 생각을 전달할 때 **담화 연결어(discourse markers)**로 **논리 흐름**을 만들어 줍니다. 연결어 없이 짧은 문장만 나열하면 유아적인 느낌을 주지만, 연결어를 쓰면 C1 수준의 유창한 발화가 됩니다.', points: [
        { en: 'Furthermore / Moreover / In addition', kr: '게다가 (추가)',
          note: '**추가 정보 연결**:\n**Furthermore** = 게다가 (앞 내용 강화)\n**Moreover** = 더욱이 (더 중요한 정보 추가)\n**In addition** = 또한 (단순 추가)\n예: "She is talented. **Furthermore**, she works incredibly hard."' },
        { en: 'Nevertheless / However', kr: '그럼에도 / 그러나 (대조)',
          note: '**역접(대조) 연결**:\n**However** = 그러나 (중립적)\n**Nevertheless** = 그럼에도 (어려움에도 불구하고 계속)\n예: "It was raining. **Nevertheless**, we went for a walk."' },
        { en: 'As a result / Therefore', kr: '그 결과 (인과)',
          note: '**인과 연결**:\n**As a result** = 그 결과 (원인 다음 결과 제시)\n**Therefore** = 따라서 (논리적 결론)\n예: "Traffic was terrible. **As a result**, I was late."\nvs "The data is clear. **Therefore**, we must act."' },
        { en: 'In contrast / On the contrary', kr: '대조적으로',
          note: '**대조 연결**:\n**In contrast** = 대조적으로 (두 가지 비교)\n**On the contrary** = 오히려, 반대로 (앞 말을 부정 후 반대 내용)\n예: "I hate coffee. **On the contrary**, I love tea."' },
        { en: 'Let me elaborate on this point.', kr: '자세히 설명하자면',
          note: '한 가지를 더 자세히 설명하고 싶을 때:\n"**Let me elaborate on...**"\n"**To expand on that...**"\n"**What I mean is...**" = 제가 뜻하는 바는...' },
      ]},
    ],
    examples: [
      { en: 'Furthermore, it is cost-effective.', kr: '게다가 비용 효율적입니다.' },
      { en: 'As a result, sales doubled in one year.', kr: '그 결과 매출이 1년 만에 두 배가 됐다.' },
      { en: 'In contrast, we lost money last year.', kr: '대조적으로 작년에는 손해를 봤다.' },
    ],
    homework: '연결어 5개를 모두 사용해 한 가지 주제로 짧은 스피치 만들기',
    scenario: { title: '논리 스피치', desc: '하나의 주제를 연결어로 매끄럽게 이어 2분간 말해 보세요.' } },

  /* ── C2 원어민 수준 ── */

/* ── 오프라인 복습: IndexedDB 로 AI 드릴 세트 저장/조회 (vanilla, 무의존성) ── */
const IDB_NAME = 'preply-coach';
const IDB_STORE = 'drillsets';
let _idbPromise = null;
function idbOpen() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('no-idb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: 'lessonId' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
async function idbSaveDrillSet(lessonId, items) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ lessonId, items, savedAt: Date.now() });
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch {}
}
async function idbGetDrillSet(lessonId) {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(lessonId);
      r.onsuccess = () => res(r.result ? r.result.items : null);
      r.onerror = () => rej(r.error);
    });
  } catch { return null; }
}

/* ═══════════════════════════════════════════════════
   CEFR / GSE 이원화 진도 엔진 + 감쇠식 스캐폴딩
═══════════════════════════════════════════════════ */
const CEFR_GSE = {
  A1: { min: 10, max: 22 }, A2: { min: 22, max: 36 }, B1: { min: 36, max: 52 },
  B2: { min: 52, max: 64 }, C1: { min: 64, max: 76 }, C2: { min: 76, max: 90 },
};
const CEFR_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const CEFR_NEXT = { A1: 'A2', A2: 'B1', B1: 'B2', B2: 'C1', C1: 'C2', C2: 'C2' };
const SKILLS = [
  { key: 'speaking', label: '구어 상호작용' }, { key: 'listening', label: '청해' },
  { key: 'reading', label: '독해' }, { key: 'writing', label: '문어 생산' },
];

// 레슨의 CEFR 추정: 마스터 유닛은 master 레벨, PREPLY/선행은 A2
function cefrOf(lesson) { return (lesson && lesson.master) || 'A2'; }
// CEFR → GSE 중앙값 (세밀 위치)
function gseMid(cefr) { const g = CEFR_GSE[cefr] || CEFR_GSE.A2; return Math.round((g.min + g.max) / 2); }
function gseToCefr(gse) {
  for (const c of CEFR_ORDER) if (gse <= CEFR_GSE[c].max) return c;
  return 'C2';
}

// 감쇠식 스캐폴딩: 레벨이 올라갈수록 한글 힌트 노출 비중↓ (1.0 → 0.08)
const SCAFFOLD_BY_CEFR = { A1: 1.0, A2: 1.0, B1: 0.65, B2: 0.4, C1: 0.2, C2: 0.08 };
function scaffoldFor(cefr) { return SCAFFOLD_BY_CEFR[cefr] ?? 1.0; }
function applyScaffold(lesson) {
  const op = scaffoldFor(cefrOf(lesson));
  document.body.style.setProperty('--scaffold', op);
  return op;
}

function getProfile() {
  const p = load('va_profile', null);
  if (p && p.cefr) return p;
  const init = { cefr: 'A2', gse: gseMid('A2'), scaffolding: 1.0 };
  store('va_profile', init);
  return init;
}
function saveProfile(p) { store('va_profile', p); }

// 스킬별 GSE 누적 (4대 영역 대시보드 소스)
function getSkillStats() {
  const s = load('va_skill_stats', null);
  if (s) return s;
  const init = {};
  SKILLS.forEach(sk => { init[sk.key] = { gse: 10, sessions: 0 }; });
  store('va_skill_stats', init);
  return init;
}
// CAF 결과를 스킬 GSE에 반영 (EMA 평활 — 급변 방지)
function bumpSkill(skill, sessionGse) {
  const stats = getSkillStats();
  const cur = stats[skill] || { gse: 10, sessions: 0 };
  const alpha = 0.3;
  cur.gse = Math.round(cur.gse * (1 - alpha) + sessionGse * alpha);
  cur.sessions += 1;
  stats[skill] = cur;
  store('va_skill_stats', stats);
  // 전체 프로필 GSE = 4대 스킬 평균, CEFR 자동 재산정
  const prof = getProfile();
  const avg = Math.round(SKILLS.reduce((a, sk) => a + (stats[sk.key]?.gse || 10), 0) / SKILLS.length);
  if (avg > prof.gse) { prof.gse = avg; prof.cefr = gseToCefr(avg); prof.scaffolding = scaffoldFor(prof.cefr); saveProfile(prof); }
  return cur;
}

const DAILY_GOAL = 20;   // 하루 목표 연습 문장 수
function markPracticedToday() {
  const days = load('va_days', []);
  const today = new Date().toISOString().slice(0, 10);
  if (!days.includes(today)) { days.push(today); store('va_days', days); }
  // 일일 연습 문장 카운트 (목표 링·주간 리포트용)
  const counts = load('va_daycount', {});
  counts[today] = (counts[today] || 0) + 1;
  store('va_daycount', counts);
  renderStreak();
}
function todayCount() {
  const counts = load('va_daycount', {});
  return counts[new Date().toISOString().slice(0, 10)] || 0;
}
/* 최근 7일 연습량 [{label, count}] (오늘이 마지막) */
function weeklyCounts() {
  const counts = load('va_daycount', {});
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    out.push({ label: days[d.getDay()], count: counts[key] || 0, today: i === 0 });
  }
  return out;
}
/* 일일 목표 진행 링 (SVG) */
function dailyGoalRing() {
  const done = todayCount();
  const pct = Math.min(done / DAILY_GOAL, 1);
  const R = 26, C = 2 * Math.PI * R;
  const off = C * (1 - pct);
  const reached = done >= DAILY_GOAL;
  return `<div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px">
    <svg width="64" height="64" viewBox="0 0 64 64" style="flex:0 0 auto">
      <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${R}" fill="none" stroke="${reached ? 'var(--green)' : 'var(--primary)'}" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 32 32)" style="transition:stroke-dashoffset 0.5s"/>
      <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text)">${reached ? '✓' : done}</text>
    </svg>
    <div style="flex:1;min-width:0">
      <div style="font-size:0.86rem;font-weight:800">${reached ? '🎉 오늘 목표 달성!' : '🎯 오늘의 목표'}</div>
      <div style="font-size:0.76rem;color:var(--text-muted);margin-top:2px">오늘 <b style="color:var(--text)">${done}</b> / ${DAILY_GOAL}문장 연습 · 🔥 ${calcStreak()}일 연속</div>
    </div>
  </div>`;
}
function calcStreak() {
  const days = new Set(load('va_days', []));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (days.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function renderStreak() { document.getElementById('streak').textContent = `🔥 ${calcStreak()}일`; }

  document.getElementById('lesson-bar').style.display = (mode === 'review' || mode === 'progress' || mode === 'master' || mode === 'video' || mode === 'features') ? 'none' : 'flex';

  if (mode === 'master') renderMaster();
  if (mode === 'video') renderVideo();

  // 회화 탭: 대화가 비어있으면 AI 코치가 먼저 인사하며 수업을 시작

/* 모델 워밍업: Ollama 모델만 — WebLLM은 첫 sendMessage 때 lazy 로딩한다. */
function warmUpModel() {
  const model = document.getElementById('model-sel').value;
  if (isWebLLMModel(model)) return;
  const big = /(:2[0-9]b|:3[0-9]b|:[4-9][0-9]b)/.test(model);
  const dot = document.getElementById('status-dot');
  if (dot && big) dot.title = `🧠 ${model} 모델을 메모리에 올리는 중...`;
  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages: [], keep_alive: '30m' }),
  }).catch(() => {});
}

    <div style="color:var(--text-muted);font-size:0.7rem;line-height:1.4">${text||''}<br>${note || '첫 실행 시 모델(~1-2GB) 다운로드 — 이후 캐시됩니다.'}</div>`;
}
function _hideWllmProgress() {
  const el = document.getElementById('wllm-progress');
  if (el) el.remove();
}

async function getWebLLMEngine(model) {
  if (webllmEngine && webllmReady && webllmCurrentModel === model) return webllmEngine;
  if (webllmLoading) {
    await new Promise(res => {
      const iv = setInterval(() => { if (!webllmLoading) { clearInterval(iv); res(); } }, 300);
    });
    if (webllmEngine && webllmReady && webllmCurrentModel === model) return webllmEngine;
  }
  webllmLoading = true; webllmReady = false;
  _showWllmProgress(0, '라이브러리 로드 중...');
  try {
    const { CreateMLCEngine } = await _loadWebLLMLib();
    webllmEngine = await CreateMLCEngine(model, {
      initProgressCallback: p => _showWllmProgress(p.progress ?? 0, p.text ?? ''),
    });
    webllmCurrentModel = model;
    webllmReady = true;
  } finally {
    webllmLoading = false;
    _hideWllmProgress();
  }
  return webllmEngine;
}

/* 클라이언트-사이드 CAF 프롬프트 (caf_pipeline.py 포팅) */
function _buildCafPrompt(transcript, cefr, wpm) {

Learner CEFR level: ${cefr}
Paraphrase target level (one step up): ${next}
${wpmLine}

Learner transcript:

Return ONLY valid JSON (no markdown) with this exact shape:

/* ═══════════════════════════════════════════════════
   🎙️ Whisper 로컬 STT (오픈소스 · 구글 음성서버 의존 없음)
   transformers.js로 브라우저에서 직접 음성→텍스트. Web Speech가
   network 오류로 먹통일 때 자동 전환되는 푸시-투-토크 폴백.
═══════════════════════════════════════════════════ */
let sttFallbackWhisper = false;   // Web Speech 실패 → Whisper로 전환됨
let whisperPipe = null, whisperLoadingP = null;
let whisperRecording = false, whisperRecorder = null, whisperChunks = [], whisperStream = null, whisperDrill = false;

async function loadWhisper() {
  if (whisperPipe) return whisperPipe;
  if (whisperLoadingP) return whisperLoadingP;
  whisperLoadingP = (async () => {
    const noteFor = (sz) => `첫 1회만 모델(~${sz}) 다운로드 — 이후 캐시됩니다.`;
    _showWllmProgress(0, '라이브러리 로드 중...', '🎙️ 음성인식 모델 로딩 중...', noteFor('480MB'));
    try {
      const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
      // 정확도 우선: medium.en → 실패 시 small.en로 자동 폴백 (모델 없거나 메모리 부족 대비)
      const candidates = [
        { id: 'Xenova/whisper-medium.en', sz: '480MB' },
        { id: 'Xenova/whisper-small.en',  sz: '190MB' },
      ];
      let lastErr;
      for (const c of candidates) {
        try {
          whisperPipe = await pipeline('automatic-speech-recognition', c.id, {
            device: navigator.gpu ? 'webgpu' : 'wasm',
            progress_callback: p => {
              if (p && p.status === 'progress')
                _showWllmProgress((p.progress || 0) / 100, `${p.file || ''} 다운로드...`,
                  '🎙️ 음성인식 모델 로딩 중...', noteFor(c.sz));
            },
          });
          break;
        } catch (e) { lastErr = e; whisperPipe = null; }
      }
      if (!whisperPipe) throw lastErr || new Error('Whisper 로드 실패');
    } finally {
      _hideWllmProgress();
      whisperLoadingP = null;
    }
    return whisperPipe;
  })();
  return whisperLoadingP;
}

/* Whisper 푸시-투-토크: 한 번 누르면 녹음 시작, 다시 누르면 인식. */
async function startWhisperRecording(drillMode) {
  if (whisperRecording) { stopWhisperRecording(); return; }
  if (!window.isSecureContext) { toast('🔒 https(또는 localhost)에서만 마이크가 동작합니다.'); return; }
  whisperDrill = drillMode;
  try {
    // 정교한 인식을 위해 노이즈 억제·에코 제거·자동 게인을 켠 깨끗한 모노 오디오 요청
    whisperStream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true,
    } });
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    toast(denied ? '🎙️ 마이크 권한이 거부되었습니다. 자물쇠 아이콘 → 마이크 → 허용 후 새로고침하세요.'
                 : '🎙️ 마이크를 열 수 없습니다: ' + (e.message || e.name), 6000);
    return;
  }
  micGranted = true;
  whisperChunks = [];
  try {
    whisperRecorder = new MediaRecorder(whisperStream);
  } catch (e) {
    toast('🎙️ 이 브라우저는 녹음을 지원하지 않습니다.');
    whisperStream.getTracks().forEach(t => t.stop());
    return;
  }
  whisperRecorder.ondataavailable = ev => { if (ev.data && ev.data.size) whisperChunks.push(ev.data); };
  whisperRecorder.onstop = onWhisperStop;
  whisperRecorder.start();
  whisperRecording = true;
  const btnId = drillMode ? 'drill-mic' : 'mic-btn';
  document.getElementById(btnId)?.classList.add('listening');
  if (!drillMode) {
    const it = document.getElementById('interim-text');
    if (it) it.textContent = '● 녹음 중 — 다 말하면 🎙️ 버튼을 다시 누르세요';
  } else {
    toast('● 녹음 중 — 다 말하면 🎙️ 버튼을 다시 누르세요', 4000);
  }
}

function stopWhisperRecording() {
  if (!whisperRecording || !whisperRecorder) return;
  whisperRecording = false;
  try { whisperRecorder.stop(); } catch (e) {}
  whisperStream?.getTracks().forEach(t => t.stop());
}

async function onWhisperStop() {
  const btnId = whisperDrill ? 'drill-mic' : 'mic-btn';
  document.getElementById(btnId)?.classList.remove('listening');
  if (!whisperChunks.length) return;
  const blob = new Blob(whisperChunks, { type: whisperRecorder?.mimeType || 'audio/webm' });
  whisperChunks = [];
  if (!whisperDrill) {
    const it = document.getElementById('interim-text');
    if (it) it.textContent = '🧠 음성 인식 중...';
  } else {
    toast('🧠 음성 인식 중...', 2000);
  }
  try {
    const pipe = await loadWhisper();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx({ sampleRate: 16000 });   // 16kHz로 리샘플 (Whisper 입력 규격)
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    const audio = decoded.getChannelData(0);
    await ctx.close();
    const out = await pipe(audio, { chunk_length_s: 30, stride_length_s: 5, temperature: 0 });
    const text = (out && out.text || '').trim();
    if (!text) { toast('🎙️ 음성을 인식하지 못했어요. 조금 더 또렷하게 다시 말해 주세요.', 4000); return; }
    if (whisperDrill) {
      const di = document.getElementById('drill-input');
      if (di) { di.value = text; di.focus(); }
    } else {
      document.getElementById('text-input').value = text;
      sendMessage(text);
    }
  } catch (e) {
    toast('🎙️ 음성 인식 실패: ' + (e.message || e), 5000);
  }
}

/* Web Speech가 막힌 환경에서 Whisper로 영구 전환 */

}

/* ═══════════════════════════════════════════════════
   ⚡ Groq 고속 API — Llama 3.3 70B (ChatGPT/Gemini급 실시간 대화)
   브라우저에서 Groq로 직접 호출(키는 이 브라우저에만 저장, 서버 경유 없음).
═══════════════════════════════════════════════════ */
function isGroqModel(m) { return m && m.startsWith('groq:'); }
function groqKey() { return (load('va_groq_key', '') || '').trim(); }

/* 헤더의 Groq 연결 표시 dot 업데이트 */

function groqModelId() { return document.getElementById('model-sel').value.replace(/^groq:/, ''); }

async function _groqFetch(messages, { temperature = 0.7, maxTokens = 400, json = false, stream = false }) {
  const key = groqKey();
  if (!key) throw new Error('NO_GROQ_KEY');
  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: groqModelId(), messages, stream, temperature, max_tokens: maxTokens,
      ...(json ? { response_format: { type: 'json_object' } } : {}),
    }),
  }).catch(err => { throw new Error('NETWORK: ' + (err.message || err)); });
  if (!resp.ok) {
    let detail = `HTTP ${resp.status}`;
    try { const e = await resp.json(); detail = e.error?.message || detail; } catch (e) {}
    if (resp.status === 401) detail = 'API 키가 올바르지 않습니다. ⚙️에서 다시 확인하세요.';
    throw new Error(detail);
  }
  return resp;
}

/* 스트리밍 (회화·질문) */
async function* groqStream(messages, opts = {}) {
  const resp = await _groqFetch(messages, { ...opts, stream: true });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const data = t.slice(5).trim();
      if (data === '[DONE]') return;
      try { const o = JSON.parse(data); const d = o.choices?.[0]?.delta?.content; if (d) yield d; } catch (e) {}
    }
  }
}

/* 비스트리밍 (드릴·CAF JSON) */
async function groqComplete(messages, opts = {}) {
  const resp = await _groqFetch(messages, { ...opts, stream: false });
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || '';
}

/* 모든 학습 데이터(va_*)를 압축 코드로 내보낸다 — 다른 기기에 그대로 옮길 수 있다. */
function exportSyncCode() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('va_')) data[k] = localStorage.getItem(k);
  }
  const code = 'PREPLY1:' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const box = document.getElementById('sync-code-box');
  box.value = code;
  box.focus(); box.select();
  const st = document.getElementById('sync-status');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code)
      .then(() => { st.textContent = `✅ 코드를 복사했어요 (${Object.keys(data).length}개 항목). 다른 기기 같은 화면에 붙여넣고 "가져오기"를 누르세요.`; })
      .catch(() => { st.textContent = '✅ 코드를 만들었어요. 위 칸을 길게 눌러 복사하세요.'; });
  } else {
    st.textContent = '✅ 코드를 만들었어요. 위 칸을 길게 눌러 복사하세요.';
  }
}

/* 다른 기기에서 만든 코드를 받아 학습 데이터를 복원한다. */
function importSyncCode() {
  const st = document.getElementById('sync-status');
  const code = (document.getElementById('sync-code-box').value || '').trim();
  if (!code) { st.textContent = '⚠️ 먼저 다른 기기에서 복사한 코드를 붙여넣으세요.'; return; }
  if (!code.startsWith('PREPLY1:')) { st.textContent = '⚠️ 올바른 동기화 코드가 아닙니다. (PREPLY1:로 시작해야 함)'; return; }
  let data;
  try { data = JSON.parse(decodeURIComponent(escape(atob(code.slice(8))))); }
  catch { st.textContent = '⚠️ 코드를 읽지 못했어요. 코드 전체를 빠짐없이 붙여넣었는지 확인하세요.'; return; }
  if (!data || typeof data !== 'object') { st.textContent = '⚠️ 코드 내용이 비어 있습니다.'; return; }
  if (!confirm('이 기기의 기존 학습 기록을 가져온 코드로 덮어씁니다. 계속할까요?')) return;
  let n = 0;
  for (const [k, v] of Object.entries(data)) {
    if (k.startsWith('va_') && typeof v === 'string') { localStorage.setItem(k, v); n++; }
  }
  st.textContent = `✅ ${n}개 항목을 가져왔어요. 잠시 후 새로고침됩니다…`;
  toast('🔄 동기화 완료! 화면을 새로고침합니다.', 2500);
  setTimeout(() => location.reload(), 1400);
}

/* 다양한 유튜브 URL 형식에서 11자리 영상 ID 추출 */
function parseYouTubeId(url) {
  if (!url) return '';
  url = url.trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url;   // 이미 ID만 붙여넣은 경우
  const patterns = [
    /[?&]v=([A-Za-z0-9_-]{11})/,        // watch?v=
    /youtu\.be\/([A-Za-z0-9_-]{11})/,   // youtu.be/
    /embed\/([A-Za-z0-9_-]{11})/,       // /embed/
    /shorts\/([A-Za-z0-9_-]{11})/,      // /shorts/
    /live\/([A-Za-z0-9_-]{11})/,        // /live/
  ];
  for (const re of patterns) { const m = url.match(re); if (m) return m[1]; }
  return '';
}

/* 🤖 서버리스 프록시(/api/transcript)로 유튜브 자막을 자동 수집해 스크립트 칸을 채운다 */
async function fetchYouTubeCaption(vid) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 55000);   // 클라이언트 타임아웃 55초
  let resp;
  try {
    resp = await fetch(`/api/transcript?v=${encodeURIComponent(vid)}`, { signal: ctrl.signal });
  } finally { clearTimeout(timer); }
  const ct = resp.headers.get('content-type') || '';
  if (!ct.includes('application/json')) throw new Error('NO_PROXY');   // 함수 미배포(정적) → HTML이 옴
  const data = await resp.json();
  if (!resp.ok || !data.text) {
    const e = new Error(data.error || 'no_captions');
    e.why = data.why || data.message || '';
    e.vid = vid;
    throw e;
  }
  _capSegs = Array.isArray(data.segments) ? data.segments : null;
  _capSegsVid = vid;
  return data;
}

async function autoFetchCaption() {
  const url = (document.getElementById('vid-url')?.value || '').trim();
  const vid = parseYouTubeId(url);
  const btn = document.getElementById('vid-fetch');
  if (!vid) { toast('⚠️ 유튜브 주소를 먼저 넣어주세요.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '🤖 자막 가져오는 중...'; }
  try {
    const data = await fetchYouTubeCaption(vid);
    const ta = document.getElementById('vid-script');
    if (ta) ta.value = data.text;
    toast(`✅ 자막 ${data.segments?.length || 0}개 세그먼트 수집됨${data.lang ? ` (${data.lang})` : ''}`, 3000);
    // 자막 수집 성공 → 라이브 번역 버튼 활성화
    const liveBtn = document.getElementById('vid-live-btn');
    if (liveBtn) {
      liveBtn.disabled = false;
      liveBtn.style.cssText = 'width:100%;margin-top:10px;padding:12px;border-radius:10px;font-size:0.88rem;font-weight:800;cursor:pointer;border:2px solid var(--primary);background:var(--primary);color:#fff;opacity:1';
      liveBtn.title = '';
      liveBtn.textContent = `▶️ 즉시 번역으로 바로 보기 (${data.segments?.length || 0}개 자막 준비됨)`;
    }
  } catch (err) {
    if (err.name === 'AbortError') toast('⏱ 자막 수집 시간 초과. 잠시 후 다시 시도하거나 스크립트를 직접 붙여넣어 주세요.', 5000);
    else if (err.message === 'NO_PROXY') toast('ℹ️ 자동수집은 배포 환경에서만 동작해요. 스크립트를 직접 붙여넣어 주세요.', 4500);
    else if (err.why) toast(`😢 자막 수집 실패: ${err.why}`, 5500);
    else if (err.message === 'no_captions') toast('😢 이 영상엔 가져올 자막이 없어요. 직접 붙여넣어 주세요.', 4500);
    else toast('🤖 자막 자동수집에 실패했어요. 스크립트를 직접 붙여넣어 주세요.', 4500);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🤖 자막 자동 가져오기 (주소만 넣고 누르세요)'; }
  }
}

  // 스크립트가 비어 있으면 서버리스 프록시로 자막 자동수집을 먼저 시도
  if (script.length < 15) {
    const btn = document.getElementById('vid-go');
    if (btn) { btn.disabled = true; btn.textContent = '🤖 자막 자동수집 중...'; }
    try {
      const data = await fetchYouTubeCaption(vid);
      script = data.text;
      const ta = document.getElementById('vid-script');
      if (ta) ta.value = script;
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = '✨ 문장·단어별로 분석하기'; }
      const whyMsg = err.why ? `<br><small style="opacity:.7">${err.why}</small>` : '';
      const msg = err.message === 'NO_PROXY'
        ? 'ℹ️ 자동수집은 배포 환경에서만 동작해요. 영상의 <b>더보기 → 스크립트 표시</b>에서 자막을 복사해 붙여넣어 주세요.'
        : err.name === 'AbortError'
          ? '⏱ 자막 수집 시간 초과. 잠시 후 다시 시도하거나 스크립트를 직접 붙여넣어 주세요.'
          : `😢 자막을 자동으로 가져오지 못했어요.${whyMsg}<br>유튜브 영상 아래 <b>더보기 → 스크립트 표시</b>에서 자막을 복사해 붙여넣어 주세요.`;
      renderVideoInput(document.getElementById('video-content'), msg);
      if (url) { const u = document.getElementById('vid-url'); if (u) u.value = url; }
      return;
    }
  }

  videoBusy = true;
  const btn = document.getElementById('vid-go');
  if (btn) { btn.disabled = true; btn.textContent = '✨ 분석 중... (몇 초 걸려요)'; }
  try {
    const sentences = await aiAnalyzeTranscript(script);
    if (!sentences.length) throw new Error('empty');
    // 이 영상의 타임스탬프 세그먼트가 있으면 문장별 시작 시각을 정렬 → 실시간 싱크 가능
    const segments = (_capSegsVid === vid && _capSegs) ? _capSegs : [];
    if (segments.length) alignSentenceTimes(sentences, segments);
    videoData = { vid, sentences, segments, ts: Date.now() };
    store('va_video_last', videoData);
    renderVideoStudy(document.getElementById('video-content'));
  } catch (err) {
    videoBusy = false;
    if (err.message === 'NO_GROQ_KEY') { openGroqKeyModal(); renderVideoInput(document.getElementById('video-content'), '⚡ ⚙️에서 무료 Groq 키를 등록하면 AI 분석이 가능합니다.'); }
    else renderVideoInput(document.getElementById('video-content'), '🤖 분석에 실패했어요. AI 모델 연결을 확인하고 다시 시도해 주세요.');
    return;
  }
  videoBusy = false;
}

/* 스크립트를 문장 단위로 쪼개 각 문장의 한국어 번역·단어별 뜻·해석을 JSON으로 받는다 */
async function aiAnalyzeTranscript(text) {
  const clip = text.slice(0, 2200);   // 너무 길면 앞부분만 (토큰 보호)
  const prompt = `You are an English-Korean language tutor for a Korean learner.
Break the following English transcript into natural sentences. For EACH sentence, provide:
- "en": the sentence in English (clean up filler/typos lightly)
- "ko": a natural Korean translation of the whole sentence
- "words": an array of the KEY words/phrases (5~10 important ones) each as {"en": word/phrase, "ko": Korean meaning}
- "note": a short Korean explanation (해석 포인트: 핵심 문법/뉘앙스/표현) in 1-2 sentences

Transcript:
"""${clip}"""

Respond ONLY in this JSON format (no other text):
{"sentences":[{"en":"...","ko":"...","words":[{"en":"...","ko":"..."}],"note":"..."}]}`;
  const model = document.getElementById('model-sel').value;
  let content;
  if (isGroqModel(model)) {
    content = await groqComplete([{ role: 'user', content: prompt }], { temperature: 0.3, maxTokens: 2600, json: true });
  } else if (typeof isWebLLMModel === 'function' && isWebLLMModel(model)) {
    const engine = await getWebLLMEngine(model);
    const reply = await engine.chat.completions.create({
      messages: [{ role: 'user', content: prompt }], stream: false, temperature: 0.3, max_tokens: 2200,
      response_format: { type: 'json_object' },
    });
    content = reply.choices[0].message.content;
  } else {
    const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], stream: false, format: 'json', keep_alive: '30m', options: { temperature: 0.3, num_predict: 2200 } }) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    content = (await resp.json()).message?.content || '{}';
  }
  const parsed = JSON.parse(content || '{}');
  return (parsed.sentences || [])
    .filter(s => s && typeof s.en === 'string' && s.en.trim())
    .map(s => ({
      en: s.en.trim(),
      ko: (s.ko || '').trim(),
      words: (s.words || []).filter(w => w && w.en).map(w => ({ en: String(w.en).trim(), ko: String(w.ko || '').trim() })).slice(0, 12),
      note: (s.note || '').trim(),
    }));
}

/* 자막 타임스탬프 세그먼트에 맞춰 각 AI 문장의 시작 시각(start)을 추정한다.
   세그먼트 텍스트를 정규화해 이어 붙이고, 각 문장 앞부분이 등장하는 위치의
   세그먼트 시간을 가져온다. 매칭 실패한 문장은 앞 문장 시간을 이어받는다. */
function alignSentenceTimes(sentences, segments) {
  const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  let concat = '';
  const idx = [];   // { ch: 문자위치, time: 세그먼트 시작초 }
  segments.forEach(seg => {
    const n = norm(seg.text);
    if (!n) return;
    idx.push({ ch: concat.length, time: seg.start });
    concat += n + ' ';
  });
  let prev = segments.length ? segments[0].start : 0;
  sentences.forEach(s => {
    const key = norm(s.en).slice(0, 14);
    let pos = key.length >= 6 ? concat.indexOf(key) : -1;
    if (pos < 0 && key.length >= 6) pos = concat.indexOf(key.slice(0, 8));   // 살짝 느슨하게 재시도
    if (pos < 0) { s.start = prev; return; }
    let t = prev;
    for (const e of idx) { if (e.ch <= pos) t = e.time; else break; }
    s.start = t; prev = t;
  });
}

/* ── 실시간 싱크 엔진 (YouTube IFrame Player API) ── */
let ytPlayer = null, ytSyncTimer = null, ytActiveIdx = -1, _ytApiPromise = null;

function loadYTApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (_ytApiPromise) return _ytApiPromise;
  _ytApiPromise = new Promise(resolve => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch (e) {} resolve(); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return _ytApiPromise;
}

async function initYTPlayer(vid) {
  try { await loadYTApi(); } catch (e) { return; }
  if (!document.getElementById('yt-player')) return;   // 화면이 이미 바뀜
  if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
  ytActiveIdx = -1;
  ytPlayer = new YT.Player('yt-player', {
    videoId: vid,
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
    events: {
      onReady: () => startYtSync(),
      onStateChange: (e) => {
        // 재생 중일 때만 폴링 (1=재생) — 일시정지/종료 시 절약
        if (e.data === 1) startYtSync(); else stopYtSync();
      },
    },
  });
}

function startYtSync() { stopYtSync(); ytSyncTimer = setInterval(updateYtSync, 250); }
function stopYtSync() { if (ytSyncTimer) { clearInterval(ytSyncTimer); ytSyncTimer = null; } }

function updateYtSync() {
  // 라이브 번역 모드
  if (_liveMode) { updateYtSyncLive(); return; }
  if (!ytPlayer || !ytPlayer.getCurrentTime || !videoData || !videoData.sentences) return;
  let t;
  try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
  const sents = videoData.sentences;
  let idx = -1;
  for (let i = 0; i < sents.length; i++) {
    if (sents[i].start != null && sents[i].start <= t + 0.2) idx = i; else if (sents[i].start != null) break;
  }
  if (idx === ytActiveIdx) return;
  ytActiveIdx = idx;
  const bar = document.getElementById('vid-subbar');
  if (bar) {
    if (idx >= 0) { const s = sents[idx]; bar.innerHTML = `<div class="sub-en">${esc(s.en)}</div><div class="sub-ko">🇰🇷 ${esc(s.ko)}</div>`; }
    else bar.innerHTML = `<span class="sub-idle">▶️ 재생하면 지금 나오는 문장이 여기에 표시됩니다.</span>`;
  }
  document.querySelectorAll('.vsent.active').forEach(e => e.classList.remove('active'));
  if (idx >= 0) {
    const card = document.getElementById('vsent-' + idx);
    if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
}

   자막 세그먼트를 영상 재생과 동시에 Groq로 즉시 번역해 자막바에 표시.

/* 라이브 모드 진입: 자막 자동수집 성공 후 "즉시 번역으로 보기" 버튼 */
function startLiveMode() {

}

function renderLiveMode(el, vid) {

let _liveNoteOn = false;
function toggleLiveNote() {
  _liveNoteOn = !_liveNoteOn;
  const btn = document.getElementById('live-note-toggle');
  if (btn) btn.textContent = _liveNoteOn ? '💡 해석 끄기' : '💡 해석 켜기';

}

function renderLiveSegList() {
  const el = document.getElementById('live-seg-list');

      <span style="font-size:0.7rem;color:var(--text-muted);flex:0 0 36px">${mm}:${ss}</span>
      <span class="lseg-en" style="font-size:0.84rem;flex:1">${esc(seg.text)}</span>
