/* 라이브 싱크: 세그먼트 기반 (videoData.sentences 대신 _capSegs 사용) */
function updateYtSyncLive() {
  if (!ytPlayer || !ytPlayer.getCurrentTime || !_capSegs) return;
  let t;
  try { t = ytPlayer.getCurrentTime(); } catch (e) { return; }
  let idx = -1;
  for (let i = 0; i < _capSegs.length; i++) {
    if (_capSegs[i].start <= t + 0.3) idx = i; else break;
  }
  if (idx === _liveSegIdx) return;
  _liveSegIdx = idx;
  updateLiveSubbar(idx);
  // 타임라인 하이라이트
  document.querySelectorAll('[id^="lseg-"].lseg-on').forEach(e => {
    e.classList.remove('lseg-on');
    e.style.background = ''; e.style.borderColor = 'transparent';
  });
  if (idx >= 0) {
    const row = document.getElementById('lseg-' + idx);
    if (row) { row.classList.add('lseg-on'); row.style.background = 'var(--surface)'; row.style.borderColor = 'var(--primary)'; row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }
}

function updateLiveSubbar(idx) {
  const enEl = document.getElementById('live-en');
  const koEl = document.getElementById('live-ko');
  const noteEl = document.getElementById('live-note');
  const chipsEl = document.getElementById('live-chips');
  if (!enEl) return;

  if (idx < 0) {
    enEl.textContent = '▶️ 재생하면 실시간 자막이 표시됩니다';
    enEl.style.color = 'rgba(255,255,255,0.55)';
    koEl.innerHTML = ''; if (noteEl) noteEl.innerHTML = ''; if (chipsEl) chipsEl.innerHTML = '';
    return;
  }

  const seg = _capSegs[idx];
  enEl.textContent = seg.text;
  enEl.style.color = '#fff';

  const cacheKey = `${_capSegsVid}:${idx}`;
  if (_segCache[cacheKey]) {
    const c = _segCache[cacheKey];
    koEl.innerHTML = c.ko ? `🇰🇷 ${esc(c.ko)}` : '';
    if (noteEl) noteEl.innerHTML = c.note ? `💡 ${esc(c.note)}` : '';
    if (chipsEl) chipsEl.innerHTML = renderLiveWordChips(c.words || []);
    return;
  }

  // 번역 대기 표시
  koEl.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:0.82rem">번역 중...</span>';
  if (noteEl) noteEl.innerHTML = ''; if (chipsEl) chipsEl.innerHTML = '';

  if (!groqKey()) { koEl.innerHTML = ''; return; }

  // 이전 요청 취소(같은 인덱스가 아닌 새 세그먼트)
  if (_livePendingIdx === idx) return;
  _livePendingIdx = idx;

  translateSegLive(seg, idx, cacheKey).then(result => {
    if (_liveSegIdx !== idx) return;   // 이미 다음 세그먼트로 넘어갔으면 무시
    const koEl2 = document.getElementById('live-ko');
    const noteEl2 = document.getElementById('live-note');
    const chipsEl2 = document.getElementById('live-chips');
    if (koEl2) koEl2.innerHTML = result.ko ? `🇰🇷 ${esc(result.ko)}` : '';
    if (noteEl2) noteEl2.innerHTML = result.note ? `💡 ${esc(result.note)}` : '';
    if (chipsEl2) chipsEl2.innerHTML = renderLiveWordChips(result.words || []);
    _livePendingIdx = -1;
  });
}

function renderLiveWordChips(words) {
  return (words || []).slice(0, 6).map(w =>
    `<span class="live-word-chip" onclick="tts('${escAttr(w.en)}','en-US')" title="${escAttr(w.ko)}">${esc(w.en)} <span style="opacity:0.7">· ${esc(w.ko)}</span></span>`
  ).join('');
}

/* 세그먼트 하나를 즉시 번역 + 핵심 단어 추출 (Groq, JSON) */
async function translateSegLive(seg, idx, cacheKey) {
  const empty = { ko: '', note: '', words: [] };
  try {
    const raw = await groqComplete([
      { role: 'system', content: 'You are an English tutor for Korean learners. Output ONLY compact JSON.' },
      { role: 'user', content: `Translate this English subtitle to Korean and extract key words.
Subtitle: "${seg.text}"
JSON: {"ko":"자연스러운 한국어 번역","note":"핵심 문법·표현을 1문장 한국어로","words":[{"en":"key word/phrase","ko":"한국어 뜻"},{"en":"...","ko":"..."}]}
words는 최대 4개, note는 30자 이내.` }
    ], { json: true, maxTokens: 200, temperature: 0.2 });
    const d = JSON.parse(raw || '{}');
    const result = { ko: d.ko || '', note: d.note || '', words: Array.isArray(d.words) ? d.words : [] };
    _segCache[cacheKey] = result;
    return result;
  } catch (e) { return empty; }
}

async function submitAsk() {
  if (askBusy) return;
  const q = (document.getElementById('ask-input').value || '').trim();
  if (!q) { document.getElementById('ask-input').focus(); return; }
  const ctxWrap = document.getElementById('ask-context-wrap');
  const ctx = (ctxWrap && ctxWrap.style.display !== 'none')
    ? (document.getElementById('ask-context').textContent || '') : '';
  askBusy = true;
  const sendBtn = document.getElementById('ask-send');
  sendBtn.disabled = true; sendBtn.textContent = '🤔 생각 중...';
  const ans = document.getElementById('ask-answer');
  ans.innerHTML = '<span style="color:var(--text-muted)">🤔 답변 생성 중...</span>';

  const model = document.getElementById('model-sel').value;
  const cefr = cefrOf(currentLesson);
  const sys = `You are a warm, encouraging Korean-speaking English tutor for a CEFR ${cefr} learner. `
    + `Answer the learner's question in KOREAN (반드시 한국어로 설명). Be clear and simple. `
    + `Always give 1-2 concrete English example sentences. Keep it concise (about 120 words). `
    + `If they ask about a specific sentence, explain the grammar or nuance plainly and kindly.`;
  const userMsg = ctx ? `[지금 연습 중인 문장] ${ctx}\n\n[질문] ${q}` : q;
  const messages = [{ role: 'system', content: sys }, { role: 'user', content: userMsg }];

  try {
    let full = '';
    if (isGroqModel(model)) {
      ans.innerHTML = '';
      for await (const d of groqStream(messages, { temperature: 0.5, maxTokens: 500 })) {
        full += d; ans.innerHTML = renderAiText(full);
      }
    } else if (isWebLLMModel(model)) {
      const engine = await getWebLLMEngine(model);
      ans.innerHTML = '';
      const stream = await engine.chat.completions.create({ messages, stream: true, temperature: 0.5, max_tokens: 420 });
      for await (const chunk of stream) {
        const d = chunk.choices[0]?.delta?.content || '';
        if (d) { full += d; ans.innerHTML = renderAiText(full); }
      }
    } else {
      const resp = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages, stream: true, keep_alive: '30m',
          options: { temperature: 0.5, num_predict: 420 } }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      ans.innerHTML = '';
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        for (const line of dec.decode(value).split('\n').filter(Boolean)) {
          try { const o = JSON.parse(line); if (o.message?.content) { full += o.message.content; ans.innerHTML = renderAiText(full); } } catch {}
        }
      }
    }
    if (!full.trim()) ans.innerHTML = '<span style="color:#fca5a5">답변을 받지 못했어요. 잠시 후 다시 시도해 주세요.</span>';
    else scrollBottom();
  } catch (e) {
    if (e.message === 'NO_GROQ_KEY') {
      ans.innerHTML = '<span style="color:#fcd34d">⚡ AI 강사 연결이 필요해요. ⚙️ 버튼에서 무료 Groq 키를 등록하세요.</span>';
      openGroqKeyModal();
    } else {
      ans.innerHTML = `<span style="color:#fca5a5">❌ ${e.message}</span>`;
    }
  } finally {
    askBusy = false; sendBtn.disabled = false; sendBtn.textContent = '질문하기 (Ctrl+Enter)';
  }
}

/* ── 질문 음성 입력: 한국어·영어 모두 인식하는 다국어 Whisper(base) ── */
let _whisperML = null, _whisperMLP = null;
async function loadWhisperML() {
  if (_whisperML) return _whisperML;
  if (_whisperMLP) return _whisperMLP;
  _whisperMLP = (async () => {
    const note = '첫 1회만 모델(~80MB) 다운로드 — 이후 캐시됩니다.';
    _showWllmProgress(0, '라이브러리 로드 중...', '🎙️ 음성인식(한/영) 모델 로딩 중...', note);
    try {
      const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
      _whisperML = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
        device: navigator.gpu ? 'webgpu' : 'wasm',
        progress_callback: p => {
          if (p && p.status === 'progress')
            _showWllmProgress((p.progress || 0) / 100, `${p.file || ''} 다운로드...`, '🎙️ 음성인식(한/영) 모델 로딩 중...', note);
        },
      });
    } finally { _hideWllmProgress(); _whisperMLP = null; }
    return _whisperML;
  })();
  return _whisperMLP;
}

let askRec = null, askRecording = false, askChunks = [], askStream = null;
async function toggleAskMic() {
  if (askRecording) { stopAskMic(); return; }
  if (!window.isSecureContext) { toast('🔒 https(또는 localhost)에서만 마이크가 동작합니다.'); return; }
  try {
    askStream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true,
    } });
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    toast(denied ? '🎙️ 마이크 권한이 거부되었습니다. 자물쇠 → 마이크 → 허용 후 새로고침하세요.'
                 : '🎙️ 마이크를 열 수 없습니다: ' + (e.message || e.name), 6000);
    return;
  }
  micGranted = true;
  askChunks = [];
  try { askRec = new MediaRecorder(askStream); }
  catch (e) { toast('🎙️ 이 브라우저는 녹음을 지원하지 않습니다.'); askStream.getTracks().forEach(t => t.stop()); return; }
  askRec.ondataavailable = ev => { if (ev.data && ev.data.size) askChunks.push(ev.data); };
  askRec.onstop = onAskMicStop;
  askRec.start();
  askRecording = true;
  const b = document.getElementById('ask-mic');
  if (b) b.classList.add('listening');
  const st = document.getElementById('ask-mic-status');
  if (st) st.textContent = '● 녹음 중 — 다 말하면 🎙️를 다시 누르세요';
}

function stopAskMic() {
  if (!askRecording || !askRec) return;
  askRecording = false;
  try { askRec.stop(); } catch (e) {}
  askStream?.getTracks().forEach(t => t.stop());
}

async function onAskMicStop() {
  const b = document.getElementById('ask-mic');
  if (b) b.classList.remove('listening');
  if (!askChunks.length) return;
  const blob = new Blob(askChunks, { type: askRec?.mimeType || 'audio/webm' });
  askChunks = [];
  const st = document.getElementById('ask-mic-status');
  if (st) st.textContent = '🧠 음성 인식 중...';
  try {
    const pipe = await loadWhisperML();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx({ sampleRate: 16000 });
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    const audio = decoded.getChannelData(0);
    await ctx.close();
    const out = await pipe(audio, { chunk_length_s: 30, stride_length_s: 5 });
    const text = (out && out.text || '').trim();
    if (st) st.textContent = '🎙️ 눌러서 음성으로 질문할 수 있어요';
    if (!text) { toast('🎙️ 음성을 인식하지 못했어요. 다시 시도해 주세요.', 4000); return; }
    const inp = document.getElementById('ask-input');
    if (inp) { inp.value = (inp.value ? inp.value.trim() + ' ' : '') + text; inp.focus(); }
  } catch (e) {
    if (st) st.textContent = '';
    toast('🎙️ 음성 인식 실패: ' + (e.message || e), 5000);
  }
}

async function checkOllama() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch('/health');
    const data = await r.json();
    const ok = data.status === 'ok';
    dot.classList.toggle('ok', ok);
    dot.title = ok ? 'Ollama 연결됨: ' + (data.models || []).join(', ') : 'Ollama 오류: ' + data.message;
    // gemma3:27b가 실제로 떠 있는지 확인 — 없으면 안내
    if (ok) {
      const wanted = document.getElementById('model-sel').value;
      const has = (data.models || []).some(m => m === wanted || m.startsWith(wanted.split(':')[0]));
      setDemoBanner(has ? '' : `⚠️ 선택한 모델(${wanted})이 Ollama에 없습니다 → 터미널에서 <code>ollama pull ${wanted}</code> 실행하세요.`);
    } else {
      setDemoBanner('');
    }
  } catch {
    dot.classList.remove('ok');
    dot.title = 'Ollama 미연결';
    const sel = document.getElementById('model-sel');
    const curModel = sel?.value || '';
    if (groqKey()) {
      // Groq 키 보유 → 고속 API 모드 (가장 빠르고 품질 높음)
      if (!isGroqModel(curModel)) {
        const g = [...(sel?.options || [])].find(o => isGroqModel(o.value));
        if (g && sel) { sel.value = g.value; store('va_model', g.value); }
      }
      setDemoBanner('');
    } else if (!isWebLLMModel(curModel) && !isGroqModel(curModel) && navigator.gpu) {
      // 키 없음 + WebGPU 가능 → 브라우저 내장으로 폴백, 단 Groq 권장 배너 노출
      const first = [...(sel?.options || [])].find(o => isWebLLMModel(o.value));
      if (first && sel) { sel.value = first.value; store('va_model', first.value); }
      setDemoBanner('⚡ <b>더 빠른 AI 강사</b>를 원하면 우측 상단 ⚙️에서 <b>무료 Groq 키</b>를 등록하세요 (ChatGPT/Gemini급). 지금은 브라우저 내장 모델로 동작합니다.');
    } else if (isGroqModel(curModel) && !groqKey()) {
      setDemoBanner('⚡ ⚙️ 버튼에서 <b>무료 Groq 키</b>를 등록하면 AI 강사와 실시간 대화가 시작됩니다.');
    } else if (!navigator.gpu && !groqKey()) {
      setDemoBanner('🎭 <b>데모 모드</b> — AI 회화는 ⚙️에서 무료 Groq 키를 등록하거나, Chrome/Edge 데스크톱(WebGPU) 또는 로컬 Ollama가 필요합니다.');
    } else {
      setDemoBanner('');
    }
  }
}

let _toastTimer = null;
function toast(msg, ms = 3200) {
  let el = document.getElementById('mic-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mic-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:120;'
      + 'max-width:88%;padding:10px 16px;border-radius:12px;font-size:0.82rem;line-height:1.45;'

      + 'box-shadow:0 8px 28px rgba(0,0,0,0.4);text-align:center';
    document.body.appendChild(el);
  }
  el.innerHTML = msg;
  el.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, ms);
}

const MINIMAL_PAIRS = [
  { contrast: 'R vs L', tip: '**R**: 혀끝을 어디에도 닿지 않게 안쪽으로 말아요. **L**: 혀끝을 윗니 뒤에 붙여요.',
    a: { w: 'rice', ipa: '/raɪs/' }, b: { w: 'lice', ipa: '/laɪs/' } },
  { contrast: 'R vs L', tip: '**R**: 입술을 살짝 둥글게. **L**: 혀끝이 윗잇몸에 닿아요.',
    a: { w: 'right', ipa: '/raɪt/' }, b: { w: 'light', ipa: '/laɪt/' } },
  { contrast: 'B vs V', tip: '**B**: 두 입술을 붙였다 떼요. **V**: 윗니로 아랫입술을 살짝 물고 떨어요.',
    a: { w: 'berry', ipa: '/ˈbɛri/' }, b: { w: 'very', ipa: '/ˈvɛri/' } },
  { contrast: 'P vs F', tip: '**P**: 두 입술로 터뜨려요. **F**: 윗니로 아랫입술을 대고 바람을 내보내요.',
    a: { w: 'pull', ipa: '/pʊl/' }, b: { w: 'full', ipa: '/fʊl/' } },
  { contrast: 'iː vs ɪ', tip: '**ea(iː)**: 길고 또렷한 "이~". **i(ɪ)**: 짧고 힘 빼고 "이".',
    a: { w: 'sheet', ipa: '/ʃiːt/' }, b: { w: 'shit', ipa: '/ʃɪt/' } },
  { contrast: 'iː vs ɪ', tip: '**ea(iː)**: 입을 옆으로 길게. **i(ɪ)**: 살짝 편하게.',
    a: { w: 'seat', ipa: '/siːt/' }, b: { w: 'sit', ipa: '/sɪt/' } },
  { contrast: 'TH vs S', tip: '**TH(θ)**: 혀끝을 윗니 사이에 살짝 내밀어요. **S**: 혀를 안에 두고 바람만.',

function startMinimalPairs() {
  drillIsReview = false; drillShadow = false;

/* 🤖 AI 무한 드릴: 현재 유닛의 문법으로 Gemma가 새 문제를 생성 */
let aiDrillBusy = false;
async function generateAiDrills() {
  if (aiDrillBusy) return;
  aiDrillBusy = true;
  const btn = document.getElementById('ai-drill-btn');
  if (btn) { btn.disabled = true; btn.textContent = '🤖 생성 중... (몇 초)'; }
  const l = currentLesson;
  const model = document.getElementById('model-sel').value;
  const points = l.sections.flatMap(s => s.points.map(p => p.en)).slice(0, 6).join(' / ');
  const prompt = `영어 학습용 번역 드릴 문제를 만들어 주세요.
주제: ${l.title}
연습할 문법/표현: ${points}
난이도: CEFR ${l.master || 'A2'}

한국어 문장과 그에 대응하는 자연스러운 영어 문장 5쌍을 만드세요.
- 위 문법/표현을 반드시 사용할 것
- 일상에서 실제로 쓸 법한 새로운 문장일 것
- 난이도에 맞는 어휘만 쓸 것

반드시 이 JSON 형식으로만 답하세요 (다른 텍스트 금지):
{"items":[{"kr":"한국어 문장","en":"English sentence"}]}`;
  try {
    let content;
    if (isGroqModel(model)) {
      content = await groqComplete([{ role: 'user', content: prompt }], { temperature: 0.9, maxTokens: 800, json: true });
    } else if (isWebLLMModel(model)) {
      const engine = await getWebLLMEngine(model);
      const reply = await engine.chat.completions.create({
        messages: [{ role: 'user', content: prompt }],
        stream: false, temperature: 0.9, max_tokens: 700,
        response_format: { type: 'json_object' },
      });
      content = reply.choices[0].message.content;
    } else {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model, messages: [{ role: 'user', content: prompt }],
          stream: false, format: 'json', keep_alive: '30m',
          options: { temperature: 0.9, num_predict: 700 },
        }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      content = data.message?.content || '{}';
    }
    const parsed = JSON.parse(content || '{}');
    const items = (parsed.items || [])
      .filter(x => x && typeof x.kr === 'string' && typeof x.en === 'string' && x.kr.trim() && x.en.trim())
      .map(x => ({ kr: x.kr.trim(), en: x.en.trim(), lesson: l.id, cat: '🤖 AI 생성' }));
    if (items.length < 3) throw new Error('short');
    idbSaveDrillSet(l.id, items);   // 오프라인 복습용으로 캐싱
    drillIsReview = false;
    drillShadow = false;
    drillQueue = items;
    drillIdx = 0;
    drillResults = [];
    renderDrillCard();
  } catch (err) {
    // 오프라인이거나 생성 실패 → 이전에 캐싱한 AI 드릴 세트로 복습
    const cached = await idbGetDrillSet(l.id);
    if (cached && cached.length >= 3) {
      drillIsReview = true; drillShadow = false;
      drillQueue = cached; drillIdx = 0; drillResults = [];
      renderDrillCard();
      addSystemMsg('📡 오프라인 상태라 이전에 생성한 AI 문제로 복습합니다.');
    } else if (err.message === 'NO_GROQ_KEY') {
      renderDrillIntro('⚡ ⚙️에서 무료 Groq 키를 등록하면 AI가 새 문제를 만들어줍니다.'); openGroqKeyModal();
    } else {
      renderDrillIntro('🤖 문제 생성에 실패했습니다. AI 모델 연결을 확인하고 다시 시도해 주세요.');
    }
  } finally {
    aiDrillBusy = false;
  }
}

function normalize(s) {
  return s.toLowerCase()
    .replace(/'m\b/g, ' am').replace(/n't\b/g, ' not').replace(/'re\b/g, ' are')
    .replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
    .replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function similarity(a, b) {
  a = normalize(a); b = normalize(b);
  if (!a || !b) return 0;
  return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
}

/* 발음/정확도 단어별 채점 — 들은 말(spoken)을 정답(target) 각 단어와 정렬해
   맞은 단어/놓친 단어를 표시하고 0~100 점수를 돌려준다. (ELSA·Preply 식 피드백) */
function wordScore(spoken, target) {
  const tgt = normalize(target).split(' ').filter(Boolean);
  const said = normalize(spoken).split(' ').filter(Boolean);
  if (!tgt.length) return { score: 0, marks: [] };
  const used = new Array(said.length).fill(false);
  const marks = tgt.map(w => {
    let bestI = -1, bestSim = 0;
    said.forEach((s, i) => {
      if (used[i]) return;
      const sim = s === w ? 1 : 1 - levenshtein(s, w) / Math.max(s.length, w.length);
      if (sim > bestSim) { bestSim = sim; bestI = i; }
    });
    const ok = bestSim >= 0.7;          // 70% 이상 유사하면 발음 성공으로 인정
    if (ok && bestI >= 0) used[bestI] = true;
    return { word: w, ok, near: !ok && bestSim >= 0.45 };
  });
  const hit = marks.filter(m => m.ok).length;
  return { score: Math.round(hit / tgt.length * 100), marks };
}

function wordScoreHtml(marks) {
  return `<div class="pron-words">` + marks.map(m =>
    `<span class="pw ${m.ok ? 'ok' : m.near ? 'near' : 'miss'}">${esc(m.word)}</span>`
  ).join(' ') + `</div>`;
}

/* Groq로 '의미상 정답'을 판정 — 모범답안과 단어가 달라도 뜻이 통하는 자연스러운 영어면 정답 인정.
   (모음 일치도만으로는 잡지 못하는 유효한 패러프레이즈를 구제) */
async function judgeAnswerMeaning(kr, target, answer) {
  const messages = [{
    role: 'user',
    content: `한국어 뜻: "${kr}"\n모범답안: "${target}"\n학생답안: "${answer}"\n\n학생답안이 한국어 뜻을 정확히 전달하는, 문법적으로 자연스러운 영어이면 정답입니다(모범답안과 단어·표현이 달라도 인정). 뜻이 다르거나 문법 오류가 있으면 오답입니다.\nJSON만 출력: {"ok": true/false, "note": "한국어 한 줄 코칭 — 맞으면 왜 좋은 표현인지, 틀리면 무엇을 고쳐야 하는지"}`
  }];
  const raw = await groqComplete(messages, { temperature: 0, maxTokens: 120, json: true });
  const parsed = JSON.parse(raw);
  return { ok: !!parsed.ok, note: String(parsed.note || '') };
}

let drillChecking = false;
async function checkDrill() {
  if (drillChecking) return;
  const input = document.getElementById('drill-input');
  const answer = input.value.trim();
  if (!answer) return;
  drillChecking = true;
  const item = drillQueue[drillIdx];
  const sim = similarity(answer, item.en);
  let correct = sim >= 0.82;
  let semanticNote = '';
  const nextBtn = document.getElementById('drill-check-btn');

  // 유사도로는 오답이지만 의미가 같은 패러프레이즈일 수 있음 → Groq 키가 있으면 의미 판정으로 구제
  if (!correct && !drillShadow && groqKey() && answer.split(/\s+/).filter(Boolean).length >= 2) {
    if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = '✓ 의미 확인 중...'; }
    try {
      const verdict = await judgeAnswerMeaning(item.kr, item.en, answer);
      if (verdict.ok) { correct = true; semanticNote = verdict.note || '모범답안과 다르지만 뜻이 통하는 자연스러운 표현이에요.'; }
      else if (verdict.note) semanticNote = verdict.note;
    } catch (e) { /* 판정 실패 시 유사도 결과 유지 */ }
    if (nextBtn) nextBtn.disabled = false;
  }

  drillResults.push(correct);
  recordDrillStat(item.lesson, correct);
  updateWeakList(item, correct);
  markPracticedToday();

  const ws = wordScore(answer, item.en);
  const speakBtns = `<button class="speak-mini" onclick="tts('${jsAttr(item.en)}','en-US')">🔊</button> <button class="speak-mini" onclick="ttsSlow('${jsAttr(item.en)}','en-US')" title="0.6배속">🐢</button> <button class="speak-mini" onclick="savePhrase('${jsAttr(item.en)}','${jsAttr(item.kr)}','드릴')" title="내 표현장에 저장">📌</button>`;
  // '음성 인식 일치도' — STT가 받아쓴 텍스트와 정답의 단어 일치율(실제 음향 발음 점수가 아님). 정직하게 표기.
  const matchLabel = `음성 인식 일치도 <b>${ws.score}%</b>`;
  const fb = document.getElementById('drill-feedback');
  fb.className = 'drill-feedback ' + (correct ? 'correct' : 'wrong');
  const semHtml = semanticNote ? `<div style="font-size:0.78rem;color:${correct ? '#86efac' : '#fca5a5'};margin-top:5px;line-height:1.5">💬 ${esc(semanticNote)}</div>` : '';
  fb.innerHTML = correct
    ? `✅ 정답입니다!${semanticNote ? ' (의미 인정)' : ''} · ${matchLabel}
       <div class="target">${esc(item.en)} ${speakBtns}</div>
       ${wordScoreHtml(ws.marks)}${semHtml}
       <span style="opacity:0.65;font-size:0.72rem">ⓘ 일치도는 음성 인식 텍스트 기준이라 실제 발음과 다를 수 있어요. 🐢로 원음을 듣고 따라 말해보세요.</span>`
    : `❌ 아쉬워요 · ${matchLabel}. 정답:
       <div class="target">${esc(item.en)} ${speakBtns}</div>
       ${wordScoreHtml(ws.marks)}${semHtml}
       <span style="opacity:0.8;font-size:0.8rem">내 답: ${esc(answer)} · 🔁 복습 목록에 추가됨 — 빨간 단어를 또렷이 발음하며 3번 따라 말해보세요.</span>`;
  tts(item.en, 'en-US');
  input.disabled = true;
  if (nextBtn) { nextBtn.textContent = '다음 →'; nextBtn.onclick = nextDrill; nextBtn.focus(); }
  drillChecking = false;
}

function renderDrillDone(target) {
  if (!drillResults.length) {   // 빈 큐(복습할 문장 없음) → 안내만
    document.getElementById(target).innerHTML = `<div class="empty-note">🎉 지금 복습할 문장이 없습니다!<br>드릴에서 더 연습하면 틀린 문장이 여기에 쌓입니다.</div>`;
    drillQueue = [];
    return;
  }
  const correct = drillResults.filter(Boolean).length;
  const pct = Math.round(correct / drillResults.length * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪';
  const note = pct >= 90 ? '완벽해요! 이제 회화 탭에서 실전으로 사용해 보세요.'
    : pct >= 70 ? '좋아요! 틀린 문장은 복습 탭에서 다시 연습하세요.'
    : '복습 탭에서 틀린 문장을 다시 연습한 뒤 재도전하세요.';
  document.getElementById(target).innerHTML = `
    <div class="drill-card drill-done">
      <div class="big">${emoji}</div>
      <div class="score">${correct} / ${drillResults.length} (${pct}%)</div>
      <div class="sub">${note}</div>
      <div class="drill-actions" style="margin-top:20px">
        <button class="btn" onclick="${drillIsReview ? 'renderReview()' : 'renderDrillIntro()'}">처음으로</button>
        <button class="btn" onclick="startDrill(${drillIsReview})">다시 도전</button>
        <button class="btn primary" onclick="document.querySelector('[data-mode=talk]').click()">③ 회화로 →</button>
      </div>
    </div>`;
  drillQueue = [];
}

function recordDrillStat(lessonId, correct) {
  const stats = load('va_stats', {});
  const s = stats[lessonId] || { attempts: 0, correct: 0 };
  s.attempts++; if (correct) s.correct++;
  stats[lessonId] = s;
  store('va_stats', stats);
}

/* 간격 반복(SM-2 근사): 박스가 오를수록 다음 복습일이 기하급수적으로 멀어진다.
   box0=오늘, 1=+1, 2=+3, 3=+7, 4=+16, 5=+35일. box5는 '숙달'로 보관하되 삭제하지 않고
   35일 뒤 유지복습(maintenance)으로 다시 등장 → 망각곡선에 맞춘 장기기억 정착.
   lapses: 한 번 익힌 뒤 다시 틀린 횟수(4회↑ = leech '골칫거리'로 표시). */
const SRS_INTERVAL_DAYS = { 0: 0, 1: 1, 2: 3, 3: 7, 4: 16, 5: 35 };
const SRS_MAX_BOX = 5;
const SRS_LEECH_THRESHOLD = 4;
function srsDue(box) { return Date.now() + (SRS_INTERVAL_DAYS[Math.min(box, SRS_MAX_BOX)] || 0) * 86400000; }
function isLeech(w) { return (w.lapses || 0) >= SRS_LEECH_THRESHOLD; }
function isMastered(w) { return (w.box || 0) >= SRS_MAX_BOX; }
function updateWeakList(item, correct) {
  let weak = load('va_weak', []);
  const idx = weak.findIndex(w => w.en === item.en);
  if (correct) {
    if (idx >= 0) {
      const w = weak[idx];
      w.box = Math.min((w.box || 0) + 1, SRS_MAX_BOX);   // 졸업해도 삭제하지 않고 장기 보관
      w.due = srsDue(w.box);                             // 다음 복습일을 기하급수적으로 미룸
    }
  } else {
    if (idx >= 0) {
      const w = weak[idx];
      if ((w.box || 0) > 0) w.lapses = (w.lapses || 0) + 1;   // 익힌 뒤 재실패 = lapse 누적
      w.box = 0; w.due = srsDue(0);
    } else {
      weak.push({ kr: item.kr, en: item.en, lesson: item.lesson, cat: item.cat, box: 0, lapses: 0, due: srsDue(0) });
    }
  }
  store('va_weak', weak);
  updateReviewBadge();
}

/* 오늘 복습할 때가 된 문장만(due ≤ now). due 필드가 없는 옛 데이터는 항상 대상. */
function dueWeak() {
  const now = Date.now();
  return load('va_weak', []).filter(w => (w.due == null) || w.due <= now);
}
/* 아직 복습일이 안 된(대기 중) 문장 수 */
function pendingWeakCount() {
  const now = Date.now();
  return load('va_weak', []).filter(w => w.due != null && w.due > now).length;
}

function drillMic() {
  if (sttFallbackWhisper || !recognition) { startWhisperRecording(true); return; }
  if (sttActive) stopMic();

function buildSystemPrompt() {

이전에 배운 아래 표현들을 대화 흐름에서 학생이 써볼 기회가 생기면 자연스럽게 유도하세요. 무리하게 끼워넣지 말고, 대화 맥락이 맞을 때만 슬쩍 활용하세요.
${prevLessons.map(pl => `- ${pl.title}: ${pl.sections.flatMap(s => s.points).slice(0, 2).map(p => p.en).join(' / ')}`).join('\n')}`

  // 🗣 프리토킹 개인화: 이 회차에 학생이 진옥쌤과 실제로 나눈 일상 주제를 알려, 대화 중 학생의 진짜 삶을 자연스럽게 물어보게 한다.

  const scenario = activeScenario || l.scenario;

🌐 언어 규칙 (가장 엄격 — 반드시 지킬 것):
- 오직 **영어(라틴 문자)** 와 **한국어(한글)** 만 사용하세요.
- 일본어(ひらがな·カタカナ·漢字), 중국어 한자(漢字), 태국어, 베트남어, 기타 어떤 외국 문자도 절대 쓰지 마세요.

- 영어 단어는 알파벳으로, 한국어 설명은 한글로. 그 외 문자가 섞이면 안 됩니다.

🟢 가장 중요 — 회화는 '대화'가 우선, 교정은 자연스러운 '리캐스트'로:
- 당신의 1순위는 상황(시나리오)에 맞는 자연스러운 대화를 이어가는 것입니다. 실제 원어민 친구/선생님처럼 학생이 말한 '내용'에 반응하세요.

- 단, 분명한 오류가 있을 때는 '리캐스트(recast)'로 슬쩍 고쳐 들려주세요: 지적·설명 없이, 네 대답 안에서 올바른 표현을 자연스럽게 되받아 말하면 됩니다. (예: 학생 "I go there yesterday" → 너 "Oh, you went there yesterday? How was it?") 3턴에 1번 이하로, 가장 중요한 오류 하나만, 대화처럼 부드럽게.
- 사소한 실수는 그냥 넘어가세요. (복잡도·정확도·유창성 정밀 분석은 학생이 🎯 CAF 또는 📋 평가 버튼을 누를 때 따로 제공됩니다.)

⚠️ 발음/음성 인식 처리:
- 학생 입력은 한국어 모국어 화자의 음성 인식(STT) 결과라, 발음 영향으로 단어가 잘못 받아쓰기될 수 있습니다.
- 들리는 소리(철자)에 엄격하지 말고, 문맥과 수업 주제로 '의도'를 유추해 자연스럽게 대답하세요.
- 단, 무슨 말인지 도저히 이해할 수 없어 대화를 이어갈 수 없을 때만(거의 드물게) 이 형식으로 한 번 확인하세요: [HEARD: "들은 그대로" → "추측한 의도" | 올바른 단어/발음 힌트 한국어 한 줄]. 의미가 통하면 절대 쓰지 마세요.

오늘 수업 내용 (${lessonLabel(l)}: ${l.title}):
${points}${teachNote}${spiralNote}${recycleNote}${freeTalkNote}

대화 시나리오: ${scenario.title} — ${scenario.desc}${roleplay}

사용자가 연습해야 할 목표 표현:
${targets}

진행 규칙:
1. ${levelNote}
2. 응답은 2~3문장, 40단어 이내로 짧게. 목록·번호·헤더 없이 자연스러운 대화체로만 말하세요.
3. 상황에 몰입해서 대화하세요. 위 목표 표현을 학생이 자연스럽게 쓰도록 질문으로 유도하되, 강요하지 마세요.
4. [CORRECT:] 같은 명시적 교정 태그나 "틀렸어요" 식 지적은 쓰지 마세요. 교정이 필요하면 위 리캐스트 방식으로 대화 안에서 자연스럽게 고쳐 들려주는 것만 허용됩니다.
5. 학생이 "한국어로", "설명해줘", "무슨 뜻이야"라고 명시적으로 물을 때만: [EXPLAIN: 한국어 설명]
6. 초보자가 위축되지 않게 따뜻하게 반응하고, 잘하면 가볍게 칭찬한 뒤 대화를 이어가세요.
7. 같은 인사를 반복하지 말고, 학생의 마지막 말에 먼저 반응한 뒤 대화를 이어가세요.
8. 매 응답 끝에 대화를 이어갈 쉬운 질문을 정확히 1개 포함하세요.`;
}

/* ─────────────────────────────────────────────────
   🎲 AI 즉흥 주제 생성기
   같은 회차 문법을 유지하면서, 매번 전혀 다른 상황/맥락의
   대화 주제를 Groq로 즉석 생성한다. 중복 방지를 위해 최근 3개 주제를 넘긴다.
───────────────────────────────────────────────── */
const _recentTopics = [];   // 중복 방지용 최근 주제 버퍼

async function generateNewTopic() {
  const btn = document.getElementById('topic-btn');
  if (!btn || btn.disabled) return;
  const model = document.getElementById('model-sel').value;
  if (!isGroqModel(model) && !isWebLLMModel(model)) {
    addSystemMsg('🎲 새 주제 생성은 Groq 또는 WebLLM 모델이 필요합니다. ⚙️ 설정에서 모델을 바꿔주세요.');
    return;
  }
  if (isGroqModel(model) && !groqKey()) { openGroqKeyModal(); return; }

  btn.disabled = true; btn.textContent = '⏳ 생성중';
  const l = currentLesson;
  const grammar = l.sections.flatMap(s => s.points.slice(0, 3).map(p => p.en)).join(' / ');
  const cefr = cefrOf(l);
  const avoidList = _recentTopics.length ? `\n이미 쓴 주제(반복 금지): ${_recentTopics.join(', ')}` : '';

  const prompt = `영어 초보자(${cefr})를 위한 영어 회화 연습 시나리오를 새로 만들어 주세요.
지금 배우는 문법: ${grammar}${avoidList}

조건:
- 위 문법을 자연스럽게 쓸 수 있는 일상 상황이어야 함
- 카페·일상대화 이외의 신선한 상황 (예: 공항, 동네 마트, 친구집, 직장동료, 온라인쇼핑, 의사 방문 등 다양하게)
- 학생이 실제로 경험할 법하고 감정적으로 의미 있는 상황
- 너무 길거나 어렵지 않게, 초보자가 3~5턴 안에 소화 가능한 분량

반드시 이 JSON 형식으로만 답하세요 (다른 텍스트 없이):
{"title":"상황 제목 (이모지 포함, 15자 이내)","desc":"AI 튜터가 어떤 역할을 하는지 + 학생이 무엇을 연습하는지 (한국어, 50자 이내)","opener":"튜터의 첫 영어 대화 문장 (학생이 자연스럽게 답할 수 있도록 열린 질문)","examples":[{"en":"이 상황에서 학생이 말할 법한 영어 문장","kr":"한국어 번역"},{"en":"...","kr":"..."},{"en":"...","kr":"..."}]}

examples는 이 상황에 딱 맞는, 위 문법을 쓴 학생용 예시 문장 3개입니다 (각각 한국어 번역 포함).`;

  try {
    let raw;
    if (isGroqModel(model)) {
      raw = await groqComplete([{ role: 'user', content: prompt }], { temperature: 1.1, maxTokens: 300, json: true });
    } else {
      const engine = await getWebLLMEngine(model);
      const r = await engine.chat.completions.create({
        messages: [{ role: 'user', content: prompt }],
        stream: false, temperature: 1.1, max_tokens: 300,
        response_format: { type: 'json_object' },
      });
      raw = r.choices[0].message.content;
    }
    const obj = JSON.parse(raw || '{}');
    if (!obj.title || !obj.desc) throw new Error('bad-json');

    // 주제 채택 (예문도 이 상황에 맞게 함께 채택)
    const exs = Array.isArray(obj.examples)
      ? obj.examples.filter(e => e && typeof e.en === 'string' && e.en.trim())
                    .map(e => ({ en: e.en.trim(), kr: (e.kr || '').trim() })).slice(0, 3)
      : [];
    activeScenario = { title: obj.title, desc: obj.desc, examples: exs.length ? exs : null };
    _recentTopics.unshift(obj.title);
    if (_recentTopics.length > 3) _recentTopics.pop();

    // 대화 초기화 후 생성된 오프너로 시작
    history = [];
    missionState = {};
    renderMissions();
    document.getElementById('chat').innerHTML = '';
    addTalkIntro({ generated: true });   // 새 주제 소개 카드

    // 생성된 오프너를 AI 첫 발화로 바로 출력
    if (obj.opener) {
      history.push({ role: 'assistant', content: obj.opener });
      const { textEl } = addAiMsg();
      textEl.innerHTML = renderAiText(obj.opener);
      enqueueSpeech(obj.opener, 'en-US');
    } else {
      // 오프너가 없으면 AI가 시작하도록 숨김 킥
      await sendMessage('(대화를 시작해줘)', true);
    }
  } catch (err) {
    addSystemMsg('🎲 주제 생성에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = '🎲 새 주제';
  }
}

function renderMissions() {
  const list = document.getElementById('mission-list');
  const missions = MISSIONS[currentLesson.id] || [];
  list.innerHTML = missions.map(m =>
    `<span class="mission ${missionState[m.id] ? 'done' : ''}" id="m-${m.id}">${missionState[m.id] ? '✅' : '⬜'} ${m.label}</span>`
  ).join('');
}

function checkMissions(text) {
  const missions = MISSIONS[currentLesson.id] || [];
  let newly = [];
  missions.forEach(m => {
    if (!missionState[m.id] && m.re.test(text)) {
      missionState[m.id] = true;
      newly.push(m.label);
      const hist = load('va_missions', {});
      hist[m.id] = true;
      store('va_missions', hist);
    }
  });
  if (newly.length) {
    renderMissions();
    addSystemMsg(`🎯 미션 달성: ${newly.join(', ')}`);
  }
}

function sendText() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || isProcessing) return;
  input.value = '';
  sendMessage(text);
}

async function sendMessage(text, hidden) {
  if (!text || isProcessing) return;
  stopSpeaking();
  if (!hidden) {
    addUserMsg(text);
    checkMissions(text);
    markPracticedToday();
    talkStamps.push(Date.now());  // 유창성 WPM 추정용 발화 시각
  }
  const model = document.getElementById('model-sel').value;
  history.push({ role: 'user', content: text });
  const typingEl = addTypingIndicator();
  isProcessing = true;
  updateTalkBtns();

  // 작은 모델이 흐름을 잃지 않도록 최근 대화만 전달 (짧을수록 첫 응답이 빠름)
  const messages = [{ role: 'system', content: buildSystemPrompt() }, ...history.slice(-8)];
  try {
    let fullText = '';
    speakCursor = 0;
    if (isGroqModel(model)) {
      // ── Groq 고속 스트리밍 경로 (ChatGPT/Gemini급) ─────────
      typingEl.remove();
      const { textEl } = addAiMsg();
      for await (const delta of groqStream(messages, { temperature: 0.7, maxTokens: 220 })) {
        fullText += delta;
        textEl.innerHTML = renderAiText(fullText);
        streamSpeak(fullText, false);
      }
    } else if (isWebLLMModel(model)) {
      // ── WebLLM 스트리밍 경로 ──────────────────────────────
      const engine = await getWebLLMEngine(model);
      typingEl.remove();
      const { textEl } = addAiMsg();
      const stream = await engine.chat.completions.create({
        messages, stream: true, temperature: 0.7, max_tokens: 180,
      });
      for await (const chunk of stream) {
        const delta = chunk.choices[0]?.delta?.content || '';
        if (delta) {
          fullText += delta;
          textEl.innerHTML = renderAiText(fullText);
          streamSpeak(fullText, false);
        }
      }
    } else {
      // ── Ollama NDJSON 스트리밍 경로 ──────────────────────
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model, messages, stream: true, keep_alive: '30m',
          options: { temperature: 0.7, num_predict: 150, repeat_penalty: 1.1 },
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
        throw new Error(err.error || `HTTP ${resp.status}`);
      }
      typingEl.remove();
      const { textEl } = addAiMsg();
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        for (const line of decoder.decode(value).split('\n').filter(Boolean)) {
          try {
            const obj = JSON.parse(line);
            if (obj.message?.content) {
              fullText += obj.message.content;
              textEl.innerHTML = renderAiText(fullText);
              streamSpeak(fullText, false);
            }
            if (obj.done) break;
          } catch {}
        }
      }
    }
    history.push({ role: 'assistant', content: fullText });
    scrollBottom();
    streamSpeak(fullText, true);
  } catch (err) {
    typingEl?.remove?.();
    if (err.message === 'NO_GROQ_KEY') {
      addSystemMsg('⚡ AI 강사 연결이 필요해요. 우측 상단 ⚙️ 버튼에서 무료 Groq 키를 등록하면 바로 대화가 됩니다.');
      openGroqKeyModal();
    } else if (isGroqModel(model)) {
      addSystemMsg(`❌ Groq 오류: ${err.message}`);
    } else if (isWebLLMModel(model)) {
      addSystemMsg(`❌ WebLLM 오류: ${err.message}`);
    } else {
      addSystemMsg(`❌ 오류: ${err.message}\nOllama 실행 여부와 모델(${model}) 설치를 확인하세요. → ollama pull ${model}`);
    }
  } finally {
    isProcessing = false;
    updateTalkBtns();
    maybeResumeHandsFree();
  }
}

function requestSummary() {
  if (history.length < 2) { addSystemMsg('아직 대화가 충분하지 않습니다. 먼저 영어로 대화해 보세요!'); return; }
  sendMessage('지금까지의 대화를 평가해주세요. 한국어로: 1) 잘한 점 2) 자주 틀린 패턴 3) 복습할 표현 3개를 [EXPLAIN: ] 형식으로 정리해주세요.', true);
  addSystemMsg('📋 AI 코치가 오늘 연습을 평가 중...');
}

/* ═══════════════════════════════════════════════════
   💡 회화 도우미 — 막혔을 때 바로 쓸 수 있는 문장 칩 + AI 답변 제안
   (Preply/Cambly의 "대화가 끊기지 않게" 돕는 패턴)
═══════════════════════════════════════════════════ */
const TALK_STARTERS = [
  "Could you repeat that?", "What do you mean?", "Let me think for a second.",
  "That's a good question.", "How about you?", "I'm not sure how to say it.",
];

function renderHelperChips() {
  const box = document.getElementById('helper-chips');
  if (!box) return;
  // 현재 레슨 예문 2개 + 범용 스타터 → 막히면 탭해서 바로 말한 셈 치고 전송
  const ex = (currentLesson.examples || []).slice(0, 2).map(e => e.en);
  const chips = [...new Set([...ex, ...TALK_STARTERS])].slice(0, 6);
  box.innerHTML =
    `<button class="helper-chip hint" onclick="askForSuggestions()" title="AI가 지금 상황에 맞는 영어 답변 예시를 제안해줍니다">💡 뭐라고 답하지?</button>` +
    chips.map(c => `<button class="helper-chip" onclick="sendChip('${jsAttr(c)}')" title="탭하면 이 문장으로 답합니다">${esc(c)}</button>`).join('');
}

function sendChip(text) {
  if (isProcessing) return;
  document.getElementById('text-input').value = '';
  sendMessage(text);
}

function askForSuggestions() {
  if (isProcessing) return;
  const cefr = cefrOf(currentLesson);
  addSystemMsg('💡 코치가 답변 예시를 준비 중...');
  sendMessage(`(도움 요청) 방금 네 질문/말에 내가 어떻게 답하면 좋을지 ${cefr} 수준의 짧고 자연스러운 영어 문장 3개를 제안해줘. 각 줄을 "- "로 시작하고, 각 문장 끝에 [EXPLAIN: 한국어 뜻]을 붙여줘.`, true);
}

/* ═══════════════════════════════════════════════════
   🎯 CAF 분석 — 내 발화의 복잡도/정확도/유창성 + 파라프레이즈
═══════════════════════════════════════════════════ */
let talkStamps = [];   // 사용자 발화 타임스탬프 (유창성 WPM 추정용)

async function analyzeCaf() {
  const utterances = history.filter(h => h.role === 'user').map(h => h.content);
  const transcript = utterances.join(' ');
  if (transcript.split(/\s+/).filter(Boolean).length < 3) {
    addSystemMsg('CAF 분석은 먼저 영어로 몇 문장 말한 뒤에 가능합니다.');
    return;
  }
  const btn = document.getElementById('caf-btn');
  btn.disabled = true; btn.textContent = '⏳ 분석중';
  const cefr = cefrOf(currentLesson);
  const duration = talkStamps.length >= 2 ? (talkStamps[talkStamps.length - 1] - talkStamps[0]) / 1000 : null;
  const model = document.getElementById('model-sel').value;
  try {
    let r;
    const words = transcript.match(/[A-Za-z']+/g) || [];
    const wpm = (duration && duration > 0) ? words.length / (duration / 60) : null;
    if (isGroqModel(model)) {
      // ── Groq 클라이언트-사이드 CAF ───────────────────────
      const raw = JSON.parse(await groqComplete(
        [{ role: 'user', content: _buildCafPrompt(transcript, cefr, wpm) }],
        { temperature: 0.3, maxTokens: 800, json: true }) || '{}');
      r = _buildCafResult(raw, transcript, words, wpm);
    } else if (isWebLLMModel(model)) {
      // ── WebLLM 클라이언트-사이드 CAF ─────────────────────
      const engine = await getWebLLMEngine(model);
      const reply = await engine.chat.completions.create({
        messages: [{ role: 'user', content: _buildCafPrompt(transcript, cefr, wpm) }],
        stream: false, temperature: 0.3, max_tokens: 700,
        response_format: { type: 'json_object' },
      });
      r = _buildCafResult(JSON.parse(reply.choices[0].message.content || '{}'), transcript, words, wpm);
    } else {
      // ── 서버-사이드 CAF (Ollama) ─────────────────────────
      const resp = await fetch('/api/caf', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript, cefr, duration_sec: duration, model }),
      });
      r = await resp.json();
      if (r.error) throw new Error(r.error);
    }
    renderCafResult(r, cefr);
    persistCaf(r, cefr);
  } catch (err) {
    if (err.message === 'NO_GROQ_KEY') { addSystemMsg('⚡ CAF 분석을 위해 ⚙️에서 무료 Groq 키를 등록하세요.'); openGroqKeyModal(); }
    else addSystemMsg(`❌ CAF 분석 실패: ${err.message}`);
  } finally {
    btn.disabled = false; btn.textContent = '🎯 CAF';
  }
}

/* 모델 raw JSON → 정규화된 CAF 결과 (WebLLM·Groq 공용) */
function _buildCafResult(raw, transcript, words, wpm) {
  const clamp = (v, lo = 0, hi = 10) => { try { return Math.max(lo, Math.min(hi, parseFloat(v) || 0)); } catch (e) { return 0; } };
  const fillers = (transcript.match(/\b(um+|uh+|er+|like|you know|i mean|kind of|sort of|well)\b/gi) || []).length;
  const fillerRatio = words.length ? fillers / words.length : 0;
  return {
    complexity: Math.round(clamp(raw.complexity) * 10) / 10,
    accuracy:   Math.round(clamp(raw.accuracy)   * 10) / 10,
    fluency:    Math.round(Math.max(0, clamp(raw.fluency) - (fillerRatio > 0.1 ? fillerRatio * 10 : 0)) * 10) / 10,
    error_density: clamp(raw.error_density, 0, 100),
    errors:      (raw.errors      || []).slice(0, 3),
    paraphrases: (raw.paraphrases || []).slice(0, 3),
    summary_ko:  String(raw.summary_ko || '').trim(),
    metrics: { word_count: words.length, filler_ratio: Math.round(fillerRatio * 1000) / 1000, wpm: wpm ? Math.round(wpm * 10) / 10 : null },
  };
}

function cafBar(name, val, color) {
  return `<div class="caf-bar-row"><span class="name">${name}</span>
    <span class="track"><span class="fl" style="width:${val * 10}%;background:${color}"></span></span>
    <span class="val">${val.toFixed(1)}</span></div>`;
}

function renderCafResult(r, cefr) {
  const next = CEFR_NEXT[cefr];
  const m = r.metrics || {};
  let html = `<div class="caf-wrap" style="text-align:left;max-width:100%">
    <h3>🎯 CAF 분석 · 현재 ${cefr}</h3>
    <div class="caf-sub">${esc(r.summary_ko || '')}</div>
    <div class="caf-bars">
      ${cafBar('복잡도', r.complexity, 'var(--primary)')}
      ${cafBar('정확도', r.accuracy, 'var(--green)')}
      ${cafBar('유창성', r.fluency, 'var(--yellow)')}
    </div>
    <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:6px">
      ${m.wpm ? `🗣 ${m.wpm} WPM · ` : ''}🔤 ${m.word_count || 0}단어 · 💬 군말 ${Math.round((m.filler_ratio || 0) * 100)}%</div>`;

  if (r.errors && r.errors.length) {
    html += `<div style="font-size:0.78rem;font-weight:700;margin:10px 0 4px">📝 핵심 교정</div>`;
    r.errors.forEach(e => {
      html += `<div class="para-card" style="background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.3)">
        <span class="or">${esc(e.wrong || '')}</span> → <span style="color:#fcd34d;font-weight:700">${esc(e.right || '')}</span>
        <span style="font-size:0.7rem;color:var(--text-muted)"> (${esc(e.type || '')})</span><br>
        <span style="font-size:0.74rem;color:var(--text-muted)">${esc(e.why_ko || '')}</span></div>`;
    });
  }
  if (r.paraphrases && r.paraphrases.length) {

// CAF 결과를 스킬 GSE + 세션 기록에 영속화 (로컬 우선, 서버 있으면 동기화)
function persistCaf(r, cefr) {
  const band = CEFR_GSE[cefr] || CEFR_GSE.A2;
  const avg = (r.complexity + r.accuracy + r.fluency) / 3;
  const sessionGse = Math.round(band.min + (avg / 10) * (band.max - band.min));
  bumpSkill('speaking', sessionGse);
  const sessions = load('va_sessions', []);
  sessions.push({ date: new Date().toISOString(), lessonId: currentLesson.id, cefr,
    caf: { complexity: r.complexity, accuracy: r.accuracy, fluency: r.fluency },
    wpm: r.metrics?.wpm || null, gse: sessionGse });
  store('va_sessions', sessions.slice(-50));
  // 서버 영속화는 best-effort (FastAPI 백엔드가 있을 때만 동작)
  fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: 1, lesson_id: currentLesson.id, caf: r, transcript: '' }) }).catch(() => {});
}

/* ── 응답 파서: [CORRECT:] [EXPLAIN:] [HEARD:] ── */
/* 🌐 모델이 간혹 섞어 내보내는 외국 문자(일본어 かな·한자, 중국어 한자, 태국/키릴/아랍 등)를
   제거해 영어+한국어만 남긴다. 음성 합성이 엉뚱한 외국어를 읽거나 화면에 깨진 글자가 보이는 것을 막는 안전장치. */
const FOREIGN_SCRIPT_RE = /[぀-ヿㇰ-ㇿｦ-ﾟ㐀-䶿一-鿿豈-﫿฀-๿Ѐ-ӿ؀-ۿऀ-ॿ֐-׿]/g;
function stripForeignScripts(s) {
  if (!s) return s;
  return s.replace(FOREIGN_SCRIPT_RE, '')
    .replace(/[ \t]{2,}/g, ' ')      // 제거 후 생긴 이중 공백 정리
    .replace(/\s+([,.!?])/g, '$1')   // 부호 앞 공백 정리
    .trim();
}

function renderAiText(raw) {
  raw = stripForeignScripts(raw);
  const correctionRe = /\[CORRECT:\s*"([^"]+)"\s*→\s*"([^"]+)"\s*\|([^\]]+)\]/g;
  const explainRe = /\[EXPLAIN:\s*([^\]]+)\]/g;
  // [HEARD: "들린 말" → "의도한 말" | 올바른 발음/단어 안내]
  const heardRe = /\[HEARD:\s*"([^"]+)"\s*→\s*"([^"]+)"\s*\|([^\]]+)\]/g;
  let plain = raw.replace(correctionRe, '').replace(explainRe, '').replace(heardRe, '').trim();
  let html = esc(plain).replace(/\n/g, '<br>');
  let m;
  heardRe.lastIndex = 0;
  while ((m = heardRe.exec(raw)) !== null) {
    html += `<div class="correction-box" style="background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.35)">
      <div class="label">🎧 발음 피드백</div>
      내가 들은 말: <span class="wrong">${esc(m[1])}</span> → 네 의도: <span class="right">${esc(m[2])}</span><br>
      <span style="opacity:0.85;font-size:0.78rem">${esc(m[3].trim())}</span></div>`;
  }
  correctionRe.lastIndex = 0;
  while ((m = correctionRe.exec(raw)) !== null) {
    html += `<div class="correction-box"><div class="label">📝 문법 교정</div>
      <span class="wrong">${esc(m[1])}</span> → <span class="right">${esc(m[2])}</span><br>
      <span style="opacity:0.8;font-size:0.78rem">${esc(m[3].trim())}</span></div>`;
  }
  explainRe.lastIndex = 0;
  while ((m = explainRe.exec(raw)) !== null) {
    html += `<div class="explain-box"><div class="label">💡 코치 설명</div>${esc(m[1].trim()).replace(/\n/g, '<br>')}</div>`;
  }
  return html;
}

  let html = '';
  if (due.length) {
    html += `<button class="start-drill-btn" onclick="startDrill(true)" style="margin-bottom:12px">▶ 오늘 복습 ${due.length}개 바로 시작 →</button>`;
  }
  html += `<div class="study-card"><h3>📝 간격 반복 복습 (SM-2)</h3>
    <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;line-height:1.6">
      오늘 복습 <b style="color:var(--primary-light)">${due.length}개</b>${pending ? ` · ⏳ 대기 ${pending}개` : ''}${masteredCount ? ` · ✅ 숙달 ${masteredCount}개` : ''}<br>
      <span style="font-size:0.72rem">맞힐수록 복습 간격이 멀어집니다 (오늘 → +1 → +3 → +7 → +16 → +35일). 숙달해도 35일 뒤 유지복습으로 한 번 더 확인합니다.</span>
    </div>`;
  if (leeches.length) {
    html += `<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.4);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:0.76rem;color:#fca5a5;line-height:1.5">
      🔥 <b>골칫거리 표현 ${leeches.length}개</b> — 4번 이상 다시 틀린 문장입니다. 통째로 외우지 말고 🙋 질문으로 원리를 이해하거나, 더 쉬운 표현으로 바꿔 보세요.</div>`;
  }
  // 정렬: due(오늘) 먼저, 그다음 대기, 숙달은 맨 뒤
  const sorted = [...weak].sort((a, b) => {
    const ad = (a.due == null) || a.due <= now, bd = (b.due == null) || b.due <= now;
    if (ad !== bd) return ad ? -1 : 1;
    return (a.box || 0) - (b.box || 0);
  });
  sorted.forEach(w => {
    const box = Math.min(w.box || 0, SRS_MAX_BOX);
    const boxes = '●'.repeat(box) + '○'.repeat(SRS_MAX_BOX - box);
    const isDue = (w.due == null) || w.due <= now;
    const dueTag = isDue
      ? `<span style="color:var(--yellow);font-size:0.7rem;margin-left:6px">● 오늘</span>`
      : isMastered(w)
        ? `<span style="color:var(--green);font-size:0.7rem;margin-left:6px">✅ 숙달 · ${new Date(w.due).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</span>`
        : `<span style="color:var(--text-muted);font-size:0.7rem;margin-left:6px">⏳ ${new Date(w.due).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</span>`;
    const leechTag = isLeech(w) ? `<span style="color:#fca5a5;font-size:0.7rem;margin-left:6px">🔥 ${w.lapses}회 재실패</span>` : '';
    html += `<div class="point" style="${isDue ? '' : 'opacity:0.5'}"><div class="en">${esc(w.kr)}${dueTag}${leechTag}</div>
      <div class="kr">${esc(w.en)} <button class="speak-mini" onclick="tts('${jsAttr(w.en)}','en-US')">🔊</button> <span style="color:var(--green);letter-spacing:2px;margin-left:4px">${boxes}</span></div></div>`;
  });
  html += `</div>`;
  if (!due.length) {
    html += `<div class="empty-note" style="margin-top:12px">✅ 오늘 복습할 문장을 모두 끝냈어요!<br>대기 중인 ${pending}개는 복습일이 되면 다시 나타납니다.</div>`;
  }
  html += `<div style="text-align:center">${phraseBtn}</div>`;
  el.innerHTML = html;
}

/* 📅 주간 리포트 — 최근 7일 연습량 막대그래프 + 합계 */
function weeklyReportHtml() {
  const week = weeklyCounts();
  const total = week.reduce((s, d) => s + d.count, 0);
  const max = Math.max(DAILY_GOAL, ...week.map(d => d.count));
  const activeDays = week.filter(d => d.count > 0).length;
  const bars = week.map(d => {
    const h = Math.round((d.count / max) * 70) + 2;
    const reached = d.count >= DAILY_GOAL;
    const color = reached ? 'var(--green)' : d.today ? 'var(--primary-light)' : 'var(--primary)';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:0.62rem;color:var(--text-muted);height:12px">${d.count || ''}</div>
      <div style="width:60%;height:${h}px;background:${color};border-radius:4px 4px 0 0;opacity:${d.count ? 1 : 0.25}"></div>
      <div style="font-size:0.66rem;color:${d.today ? 'var(--primary-light)' : 'var(--text-muted)'};font-weight:${d.today ? 700 : 400}">${d.label}</div>
    </div>`;
  }).join('');
  return `<div class="caf-wrap">
    <h3>📅 주간 리포트</h3>
    <div class="caf-sub">최근 7일 동안 <b style="color:var(--text)">${total}문장</b> 연습 · ${activeDays}일 활동 · 목표선 ${DAILY_GOAL}/일</div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px;border-bottom:1px solid var(--border);padding-bottom:2px">${bars}</div>
  </div>`;
}

/* 기능 허브에서 레슨 컨텍스트가 필요한 드릴류를 드릴 탭으로 전환 후 실행 */
function featLaunch(kind) {
  setMode('drill', document.querySelector('[data-mode="drill"]'));
  if (kind === 'shadow') startShadowDrill();
  else if (kind === 'minpairs') startMinimalPairs();
  else if (kind === 'aidrill') generateAiDrills();

let learnView = null;
function aiReady() { return !!groqKey(); }

/* 키가 있으면 Groq 모델을 강제 선택 (다른 백엔드로 잘못 선택돼 있어도 AI 호출 보장) */
function ensureGroqSelected() {
  if (!groqKey()) return false;
  const sel = document.getElementById('model-sel');
  if (sel && !isGroqModel(sel.value)) {
    const opt = [...sel.options].find(o => isGroqModel(o.value));
    if (opt) { sel.value = opt.value; store('va_model', opt.value); }
  }
  return !!(sel && isGroqModel(sel.value));
}

/* 기능 허브에서 학습 모듈로 진입 (탭 없이 전용 패널 사용) */
function gotoLearn(view) {
  if (currentMode === 'talk') { handsFree = false; try { stopHandsFreeWatchdog(); } catch {} if (sttActive) stopMic(); try { stopSpeaking(); } catch {} }
  if (currentMode === 'video') { try { stopYtSync(); } catch {} }
  currentMode = 'learn';
  learnView = view;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  const fb = document.querySelector('[data-mode=features]'); if (fb) fb.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-learn').classList.add('active');
  document.getElementById('lesson-bar').style.display = 'none';
  window.scrollTo(0, 0);
  renderLearn();
}
function backToFeatures() { document.querySelector('[data-mode=features]').click(); }
function learnHeader(emoji, title, sub) {
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">

}

    CEFR_ORDER.map(c => `<button onclick="${onclick}('${c}')" style="flex:1 0 auto;min-width:48px;padding:7px 4px;border-radius:8px;font-size:0.78rem;font-weight:800;cursor:pointer;border:1px solid ${c === active ? 'var(--primary)' : 'var(--border)'};background:${c === active ? 'var(--primary)' : 'var(--surface)'};color:${c === active ? '#fff' : 'var(--text-muted)'}">${c}</button>`).join('') +
    `</div>`;
}
function myCefr() { return getProfile().cefr || 'A2'; }

function renderLearn() {
  const el = document.getElementById('learn-content');
  if (!el) return;
  switch (learnView) {
    case 'placement': return renderPlacement(el);

}

/* ───────────────────────────────────────────────────────────────────────

const PLACEMENT_Q = [

  { lv:'A2', q:'This bag is ___ than that one.', o:['cheap','cheaper','cheapest','more cheap'], a:1 },
  { lv:'A2', q:'We ___ watch a movie tonight.', o:['are going to','goes to','is going','go to'], a:0 },
  { lv:'B1', q:'I have lived here ___ 2019.', o:['for','since','from','during'], a:1 },
  { lv:'B1', q:'If it rains, we ___ stay home.', o:['will','would','are','have'], a:0 },
  { lv:'B1', q:'You ___ smoke here — it is not allowed.', o:["mustn't","don't have to","might not","needn't"], a:0 },
  { lv:'B2', q:'By next year, she ___ here for a decade.', o:['will work','will have worked','works','worked'], a:1 },
  { lv:'B2', q:'The report, ___ was due Monday, is still missing.', o:['who','which','that','what'], a:1 },
  { lv:'B2', q:'I wish I ___ more time to prepare.', o:['have','had','will have','am having'], a:1 },
  { lv:'C1', q:'___ had I arrived when the meeting started.', o:['No sooner','Hardly','Scarcely','Rarely'], a:1 },
  { lv:'C1', q:'Choose the best fit: "Her argument was ___ and hard to refute."', o:['cogent','cozy','candid','curt'], a:0 },
  { lv:'C1', q:'He spoke as though he ___ the whole story.', o:['knows','knew','had known','has known'], a:2 },
  { lv:'C2', q:'The proposal was, to put it ___, dead on arrival.', o:['mildly','bluntly','vaguely','fondly'], a:1 },
  { lv:'C2', q:'Pick the idiom: "They decided to ___ the issue rather than confront it."', o:['skirt','skim','ski','skip'], a:0 },
  { lv:'C2', q:'"Notwithstanding the setbacks, the team ___ undeterred."', o:['remain','remains','remained','is remaining'], a:2 },
];
let placeAns = [];
function renderPlacement(el) {
  placeAns = [];
  let html = learnHeader('🧭', 'CEFR 배치고사', '18문항 · 내 레벨(A1~C2)을 진단해 학습 경로를 맞춥니다');
  html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;font-size:0.8rem;color:var(--text-muted);line-height:1.6">문법·어휘 객관식입니다. 모르면 찍지 말고 비워두세요(정확한 진단을 위해). 끝까지 풀고 <b>채점</b>을 누르면 CEFR 레벨과 4대 영역 시작점이 설정됩니다.</div>`;
  html += `<div id="place-qs">`;
  PLACEMENT_Q.forEach((item, i) => {
    html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px">
      <div style="font-size:0.86rem;font-weight:700;margin-bottom:9px"><span style="color:var(--primary-light)">Q${i+1}.</span> ${esc(item.q)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">` +
      item.o.map((opt, j) => `<button id="pq-${i}-${j}" onclick="pickPlace(${i},${j})" style="text-align:left;padding:9px 11px;border-radius:8px;font-size:0.82rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text)">${esc(opt)}</button>`).join('') +
      `</div></div>`;
  });
  html += `</div><button class="start-drill-btn" onclick="gradePlacement()" style="margin-top:6px">📊 채점하고 내 레벨 보기</button>`;
  el.innerHTML = html;
}
function pickPlace(i, j) {
  placeAns[i] = j;
  PLACEMENT_Q[i].o.forEach((_, k) => {
    const b = document.getElementById(`pq-${i}-${k}`);
    if (!b) return;
    const on = k === j;
    b.style.borderColor = on ? 'var(--primary)' : 'var(--border)';
    b.style.background = on ? 'var(--primary)' : 'var(--surface2)';
    b.style.color = on ? '#fff' : 'var(--text)';
  });
}
function gradePlacement() {
  const byLv = {};
  CEFR_ORDER.forEach(c => byLv[c] = { correct: 0, total: 0 });
  PLACEMENT_Q.forEach((item, i) => {
    byLv[item.lv].total++;
    if (placeAns[i] === item.a) byLv[item.lv].correct++;
  });
  // 최고 통과 레벨: 해당 레벨에서 과반 정답이면 통과로 간주, 가장 높은 통과 레벨 채택
  let passed = 'A1';
  for (const c of CEFR_ORDER) {
    if (byLv[c].total && byLv[c].correct / byLv[c].total >= 0.6) passed = c;
  }
  // 부분 점수로 GSE 미세조정
  const totalCorrect = Object.values(byLv).reduce((a, b) => a + b.correct, 0);
  const band = CEFR_GSE[passed];
  const gse = Math.min(90, band.min + Math.round((band.max - band.min) * Math.min(1, (totalCorrect / PLACEMENT_Q.length) + 0.2)));
  // 프로필 + 4대 스킬 시작점 반영
  const prof = getProfile();
  prof.cefr = passed; prof.gse = gse; prof.scaffolding = scaffoldFor(passed);
  saveProfile(prof);
  const stats = getSkillStats();
  SKILLS.forEach(sk => { stats[sk.key] = { gse, sessions: (stats[sk.key]?.sessions || 0) }; });
  store('va_skill_stats', stats);
  store('va_placed', { cefr: passed, gse, ts: Date.now() });

  const el = document.getElementById('learn-content');
  let html = learnHeader('🧭', '배치 결과', '진단이 완료되어 학습 경로가 설정됐어요');
  html += `<div style="text-align:center;background:var(--surface);border:1px solid var(--primary);border-radius:16px;padding:22px;margin-bottom:14px">
    <div style="font-size:0.8rem;color:var(--text-muted)">당신의 추정 레벨</div>
    <div style="font-size:2.6rem;font-weight:900;color:var(--primary-light);margin:4px 0">${passed}</div>
    <div style="font-size:0.82rem;color:var(--text-muted)">GSE ${gse} · ${CEFR_LABEL[passed] || ''}</div>
    <div style="font-size:0.78rem;margin-top:8px">정답 ${totalCorrect} / ${PLACEMENT_Q.length}</div>
  </div>`;
  html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:0.82rem;line-height:1.7">
    <b>다음 단계 추천</b><br>
    📖 레슨 로드맵에서 <b style="color:var(--primary-light)">${passed}</b> 유닛부터 시작<br>
    🎧 청해 · 📖 독해 · ✍️ 작문도 ${passed} 레벨로 자동 설정됨</div>`;
  html += `<button class="start-drill-btn" onclick="document.querySelector('[data-mode=master]').click()">📖 내 레벨 로드맵 보기 →</button>`;
  html += `<button class="btn" style="width:100%;margin-top:8px" onclick="renderPlacement(document.getElementById('learn-content'))">↻ 다시 풀기</button>`;
  el.innerHTML = html;
  toast(`🧭 배치 완료 — ${passed} 레벨로 설정했어요!`, 3600);
}
const CEFR_LABEL = { A1:'입문 (Beginner)', A2:'기초 (Elementary)', B1:'중급 (Intermediate)', B2:'중상급 (Upper-Int.)', C1:'고급 (Advanced)', C2:'원어민급 (Mastery)' };

  let html = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;margin-bottom:12px">
    <div style="font-weight:800;margin-bottom:8px;font-size:0.92rem">${esc(readItem.title)}
      <button class="btn" onclick="tts(readItem.text,'en-US')" style="padding:3px 9px;float:right;font-size:0.74rem">🔊 듣기</button></div>
    <div style="font-size:0.9rem;line-height:1.85;color:var(--text)">${esc(readItem.text)}</div></div>`;
  html += `<div style="font-size:0.82rem;font-weight:800;color:var(--primary-light);margin:6px 0 8px">📝 이해 문제</div>`;
  readItem.qs.forEach((qq, i) => {
    html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px">
      <div style="font-size:0.84rem;font-weight:700;margin-bottom:8px">${i+1}. ${esc(qq.q)}</div>` +
      qq.o.map((opt, j) => `<button id="rq-${i}-${j}" onclick="pickRead(${i},${j})" style="display:block;width:100%;text-align:left;padding:8px 11px;border-radius:8px;font-size:0.82rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);margin-bottom:5px">${esc(opt)}</button>`).join('') +
      `</div>`;
  });
  html += `<button class="start-drill-btn" onclick="gradeReading()">채점하기</button>`;
  html += `<div style="font-size:0.82rem;font-weight:800;color:var(--primary-light);margin:16px 0 8px">🔑 핵심 어휘 <span style="font-size:0.7rem;font-weight:400;color:var(--text-muted)">· 탭하면 표현장 저장</span></div>`;
  html += readItem.vocab.map(v => `<button onclick="savePhrase('${escAttr(v.w)}','${escAttr(v.kr)}','독해 어휘')" style="display:inline-block;margin:0 6px 6px 0;padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.8rem;cursor:pointer"><b>${esc(v.w)}</b> · ${esc(v.kr)} ＋</button>`).join('');
  body.innerHTML = html;
  body.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function pickRead(i, j) {
  readAns[i] = j;
  readItem.qs[i].o.forEach((_, k) => {
    const b = document.getElementById(`rq-${i}-${k}`); if (!b) return;
    const on = k === j;
    b.style.borderColor = on ? 'var(--primary)' : 'var(--border)';
    b.style.background = on ? 'var(--primary)' : 'var(--surface2)';
    b.style.color = on ? '#fff' : 'var(--text)';
  });
}
function gradeReading() {
  let correct = 0;
  readItem.qs.forEach((qq, i) => {
    const b = document.getElementById(`rq-${i}-${qq.a}`);
    if (b) { b.style.borderColor = 'var(--green)'; b.style.boxShadow = '0 0 0 1px var(--green)'; }
    if (readAns[i] === qq.a) correct++;
    else if (readAns[i] != null) { const w = document.getElementById(`rq-${i}-${readAns[i]}`); if (w) { w.style.borderColor = 'var(--red)'; w.style.background = 'rgba(239,68,68,0.12)'; } }
  });
  const ratio = correct / readItem.qs.length;
  const band = CEFR_GSE[readLevel];
  const gse = Math.round(band.min + (band.max - band.min) * ratio);
  bumpSkill('reading', gse); markPracticedToday();
  toast(`📖 독해 ${correct}/${readItem.qs.length} 정답 · 청해 GSE ${gse} 반영`, 3800);
}
async function aiGenReading() {
  if (!ensureGroqSelected()) { toast('🤖 AI 지문 생성은 Groq 키가 필요해요.'); openGroqKeyModal(); return; }
  toast('🤖 ' + readLevel + ' 지문 생성 중...');
  try {
    const sys = `You are an English reading-material author. Output ONLY JSON.`;
    const user = `Create a CEFR ${readLevel} reading passage for a Korean learner.
JSON shape: {"title":"...","text":"5-7 sentences at ${readLevel} difficulty","qs":[{"q":"...","o":["a","b","c"],"a":0},{...3 questions...}],"vocab":[{"w":"word/phrase","kr":"Korean meaning"},{...3 items...}]}
Keep vocabulary and grammar appropriate for ${readLevel}. "a" is the index (0-based) of the correct option.`;
    const raw = await groqComplete([{ role:'system', content:sys }, { role:'user', content:user }], { json:true, maxTokens:900, temperature:0.7 });
    const data = JSON.parse(raw);
    if (!data.text || !Array.isArray(data.qs)) throw new Error('bad');
    startReading(data);
  } catch (e) { toast('🤖 지문 생성 실패 — 기본 지문으로 진행하세요.'); }
}

/* ───────────────────────────────────────────────────────────────────────
   ③ 청해 — 딕테이션 (들리는 문장 받아쓰기, Duolingo 스타일) + 단어 단위 채점
─────────────────────────────────────────────────────────────────────── */
const LISTEN_BANK = {
  A1: ['I have two brothers.', 'She is reading a book.', 'We go to school by bus.', "It's very cold today.", 'My favorite color is blue.', 'They are playing soccer.'],
  A2: ['I went to the beach last weekend.', 'He is taller than his brother.', 'We are going to visit Seoul next month.', 'She has lived here for three years.', 'Can you help me with my homework?', 'I usually wake up at seven.'],
  B1: ['I have already finished my report.', 'If I were you, I would take the job.', "She's been studying English since 2020.", 'The train was delayed because of the snow.', 'You should have called me earlier.', 'We need to cut down on plastic waste.'],
  B2: ['Had I known earlier, I would have acted differently.', 'The committee postponed the decision until further notice.', 'Despite the rain, the event went ahead as planned.', 'He tends to underestimate how long tasks take.', 'The proposal was met with considerable skepticism.', 'They managed to resolve the issue without escalating it.'],
  C1: ['Her unwavering commitment ultimately paid off.', 'The findings call into question our basic assumptions.', 'He has a tendency to overcomplicate simple matters.', 'Such measures, though controversial, proved effective.', 'The negotiations reached an impasse late last night.', 'We must weigh the benefits against the potential risks.'],
  C2: ['The verdict set an unprecedented legal precedent.', 'His prose is at once elegant and remarkably economical.', 'They were inclined to dismiss the anomaly as negligible.', 'The reform was, in hindsight, woefully inadequate.', 'Her argument hinges on a rather tenuous assumption.', 'The phenomenon defies any straightforward explanation.'],
};
let listLevel = null, listQueue = [], listIdx = 0;
function renderListening(el) {
  listLevel = listLevel || myCefr();
  let html = learnHeader('🎧', '청해 (Listening)', '들리는 문장을 받아쓰는 딕테이션 — 듣기·철자·문법을 한번에');
  html += levelChips(listLevel, 'pickListLevel');
  html += `<button class="start-drill-btn" onclick="startListening()">🎧 ${listLevel} 받아쓰기 시작 (6문항)</button>`;
  html += `<div id="list-body" style="margin-top:14px"></div>`;
  el.innerHTML = html;
}
function pickListLevel(c) { listLevel = c; renderListening(document.getElementById('learn-content')); }
function startListening() {
  const bank = (LISTEN_BANK[listLevel] || []).slice();
  for (let i = bank.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bank[i], bank[j]] = [bank[j], bank[i]]; }
  listQueue = bank.slice(0, 6); listIdx = 0;
  renderListenCard();
}
function renderListenCard() {
  const body = document.getElementById('list-body');
  if (listIdx >= listQueue.length) { return finishListening(); }
  const sent = listQueue[listIdx];
  body.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px">
    <div style="font-size:0.76rem;color:var(--text-muted);margin-bottom:10px">문항 ${listIdx+1} / ${listQueue.length} · 들리는 문장을 그대로 적으세요</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn primary" style="flex:1" onclick="tts(listQueue[listIdx],'en-US')">🔊 다시 듣기</button>
      <button class="btn" style="flex:0 0 auto" onclick="ttsSlow(listQueue[listIdx],'en-US')">🐢 느리게</button></div>
    <textarea id="list-input" rows="2" placeholder="여기에 받아쓰기..." style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:0.92rem;resize:vertical"></textarea>
    <button class="start-drill-btn" style="margin-top:10px" onclick="checkListen()">확인</button>
    <div id="list-result" style="margin-top:12px"></div></div>`;
  setTimeout(() => { tts(sent, 'en-US'); document.getElementById('list-input')?.focus(); }, 200);
}
function normWords(s) { return (s || '').toLowerCase().replace(/[^a-z0-9'\s]/g, '').split(/\s+/).filter(Boolean); }
function checkListen() {
  const sent = listQueue[listIdx];
  const guess = document.getElementById('list-input').value;
  const target = normWords(sent), got = normWords(guess);
  // 단어 단위 정합 (LCS 기반 정확도)
  const m = target.length, n = got.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = target[i-1] === got[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const hit = dp[m][n];
  const acc = m ? Math.round((hit / m) * 100) : 0;
  // 단어별 색칠 (정답 기준)
  const gotSet = new Set(got);
  const colored = target.map(w => gotSet.has(w) ? `<span style="color:var(--green)">${w}</span>` : `<span style="color:var(--red);text-decoration:underline">${w}</span>`).join(' ');
  const res = document.getElementById('list-result');
  res.innerHTML = `<div style="font-size:0.82rem;margin-bottom:6px">정확도 <b style="color:${acc>=80?'var(--green)':acc>=50?'var(--yellow)':'var(--red)'}">${acc}%</b></div>
    <div style="font-size:0.9rem;line-height:1.7;background:var(--surface2);border-radius:8px;padding:10px">${colored}</div>
    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:6px">정답: ${esc(sent)}</div>
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="nextListen(${acc})">${listIdx+1 < listQueue.length ? '다음 문항 →' : '결과 보기'}</button>`;
  if (acc < 70) updateWeakList({ en: sent, kr: '(받아쓰기 문장)', lesson: 'listening', cat: 'listening' }, false);
  listScore = (listScore || 0) + acc;
}
let listScore = 0;
function nextListen(acc) { listIdx++; renderListenCard(); }
function finishListening() {
  const avg = Math.round((listScore || 0) / Math.max(1, listQueue.length));
  listScore = 0;
  const band = CEFR_GSE[listLevel];
  const gse = Math.round(band.min + (band.max - band.min) * (avg / 100));
  bumpSkill('listening', gse); markPracticedToday();
  document.getElementById('list-body').innerHTML = `<div style="text-align:center;background:var(--surface);border:1px solid var(--primary);border-radius:14px;padding:20px">
    <div style="font-size:0.8rem;color:var(--text-muted)">받아쓰기 평균 정확도</div>
    <div style="font-size:2.2rem;font-weight:900;color:var(--primary-light);margin:4px 0">${avg}%</div>
    <div style="font-size:0.8rem;color:var(--text-muted)">청해 GSE ${gse} 반영됨</div>
    <button class="start-drill-btn" style="margin-top:14px" onclick="startListening()">↻ 다시 (새 문항)</button></div>`;
}

/* ───────────────────────────────────────────────────────────────────────
   ④ 작문 — 레벨별 과제 + AI 피드백 (IELTS 라이팅 밴드 / Cambridge Write&Improve)
─────────────────────────────────────────────────────────────────────── */
const WRITE_PROMPTS = {
  A1: [{ p:'Introduce yourself in 3–4 sentences (name, age, job/school, hobby).', min:25 }, { p:'Describe your family in a few simple sentences.', min:25 }],
  A2: [{ p:'Write about what you did last weekend (4–6 sentences, past tense).', min:40 }, { p:'Describe your daily routine.', min:40 }],
  B1: [{ p:'Do you prefer living in a city or the countryside? Give reasons.', min:70 }, { p:'Write an email to a friend inviting them to your birthday party.', min:70 }],
  B2: [{ p:'Some people think social media does more harm than good. Discuss both views and give your opinion.', min:120 }, { p:'Describe a challenge you overcame and what you learned.', min:120 }],
  C1: [{ p:'"Remote work will eventually replace the traditional office." To what extent do you agree?', min:160 }, { p:'Analyse the impact of artificial intelligence on creative professions.', min:160 }],
  C2: [{ p:'"Economic growth and environmental protection are fundamentally incompatible." Critically evaluate this claim.', min:200 }, { p:'Discuss whether objective truth is attainable in journalism.', min:200 }],
};
let writeLevel = null, writePrompt = null;
function renderWriting(el) {
  writeLevel = writeLevel || myCefr();
  const list = WRITE_PROMPTS[writeLevel] || WRITE_PROMPTS.A2;
  writePrompt = writePrompt && list.includes(writePrompt) ? writePrompt : list[0];
  let html = learnHeader('✍️', '작문 (Writing)', 'AI가 IELTS 스타일로 채점 — 문법·어휘·구성·교정문 제공');
  html += levelChips(writeLevel, 'pickWriteLevel');
  html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px">
    <div style="font-size:0.74rem;color:var(--text-muted);margin-bottom:4px">✏️ 과제 (${writeLevel}) · 최소 ${writePrompt.min}단어</div>
    <div style="font-size:0.9rem;font-weight:700;line-height:1.5">${esc(writePrompt.p)}</div>
    <button class="btn" onclick="rollWritePrompt()" style="margin-top:8px;padding:5px 10px;font-size:0.74rem">🎲 다른 과제</button></div>`;
  html += `<textarea id="write-input" rows="9" placeholder="여기에 영어로 작성하세요..." oninput="updateWriteCount()" style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:0.92rem;line-height:1.6;resize:vertical"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">
      <span id="write-count" style="font-size:0.76rem;color:var(--text-muted)">0 단어</span></div>
    <button class="start-drill-btn" onclick="gradeWriting()">🤖 AI 첨삭 받기</button>
    <div id="write-result" style="margin-top:14px"></div>`;
  el.innerHTML = html;
}
function pickWriteLevel(c) { writeLevel = c; writePrompt = null; renderWriting(document.getElementById('learn-content')); }
function rollWritePrompt() {
  const list = WRITE_PROMPTS[writeLevel] || WRITE_PROMPTS.A2;
  let next = writePrompt;
  while (list.length > 1 && next === writePrompt) next = list[Math.floor(Math.random() * list.length)];
  writePrompt = next; renderWriting(document.getElementById('learn-content'));
}
function updateWriteCount() {
  const v = document.getElementById('write-input').value.trim();
  const n = v ? v.split(/\s+/).length : 0;
  const el = document.getElementById('write-count');
  el.textContent = `${n} 단어` + (n < writePrompt.min ? ` (목표 ${writePrompt.min})` : ' ✓');
  el.style.color = n >= writePrompt.min ? 'var(--green)' : 'var(--text-muted)';
}
async function gradeWriting() {
  const text = document.getElementById('write-input').value.trim();
  if (text.split(/\s+/).length < 8) { toast('조금 더 작성해 주세요 (최소 8단어).'); return; }
  const res = document.getElementById('write-result');
  if (!ensureGroqSelected()) {
    res.innerHTML = `<div style="background:var(--surface);border:1px solid var(--yellow);border-radius:12px;padding:14px;font-size:0.82rem;line-height:1.6">
      🤖 상세 AI 첨삭은 무료 Groq 키 연결 후 가능해요.<br><button class="btn primary" style="margin-top:8px" onclick="openGroqKeyModal()">AI 강사 연결하기</button></div>`;
    return;
  }
  res.innerHTML = `<div style="color:var(--text-muted);font-size:0.84rem">🤖 ${writeLevel} 기준으로 채점 중...</div>`;
  try {
    const sys = `You are an IELTS/CEFR writing examiner for Korean learners. Output ONLY JSON.`;
    const user = `Task prompt: "${writePrompt.p}"
Target level: CEFR ${writeLevel}.
Student's writing: """${text}"""
Return JSON: {"cefr":"estimated CEFR like B1","score":0-100,"summary":"1-2 sentence overall in Korean","strengths":["Korean point",...],"issues":[{"wrong":"exact phrase from text","fix":"corrected phrase","why":"short Korean reason"},... up to 5],"corrected":"the full text rewritten correctly in natural English","modelAnswer":"a model answer at ${writeLevel}+ level"}`;
    const raw = await groqComplete([{ role:'system', content:sys }, { role:'user', content:user }], { json:true, maxTokens:1400, temperature:0.4 });
    const d = JSON.parse(raw);
    renderWriteFeedback(d);
    const band = CEFR_GSE[writeLevel];
    const gse = Math.round(band.min + (band.max - band.min) * Math.min(1, (d.score || 60) / 100));
    bumpSkill('writing', gse); markPracticedToday();
  } catch (e) { res.innerHTML = `<div style="color:var(--red);font-size:0.84rem">🤖 첨삭 실패: ${esc(String(e.message||e))}</div>`; }
}
function renderWriteFeedback(d) {
  const res = document.getElementById('write-result');
  let html = `<div style="background:var(--surface);border:1px solid var(--primary);border-radius:14px;padding:16px">
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
      <span style="font-size:1.6rem;font-weight:900;color:var(--primary-light)">${esc(d.cefr||'')}</span>
      <span style="font-size:0.9rem;color:var(--text-muted)">${d.score!=null?d.score+'/100':''}</span></div>
    <div style="font-size:0.84rem;line-height:1.6;margin-bottom:10px">${esc(d.summary||'')}</div>`;
  if (Array.isArray(d.strengths) && d.strengths.length)
    html += `<div style="font-size:0.78rem;font-weight:800;color:var(--green);margin:6px 0 4px">잘한 점</div><ul style="margin:0 0 8px 18px;font-size:0.8rem;line-height:1.6;color:var(--text-muted)">${d.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  if (Array.isArray(d.issues) && d.issues.length) {
    html += `<div style="font-size:0.78rem;font-weight:800;color:var(--yellow);margin:8px 0 4px">고칠 점</div>`;
    d.issues.forEach(it => {
      html += `<div style="background:var(--surface2);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:0.8rem;line-height:1.5">
        <span style="color:var(--red);text-decoration:line-through">${esc(it.wrong||'')}</span> → <span style="color:var(--green);font-weight:700">${esc(it.fix||'')}</span>
        <div style="color:var(--text-muted);font-size:0.74rem;margin-top:2px">${esc(it.why||'')}</div></div>`;
    });
  }
  if (d.corrected) html += `<div style="font-size:0.78rem;font-weight:800;color:var(--primary-light);margin:10px 0 4px">✅ 교정문</div><div style="font-size:0.84rem;line-height:1.7;background:var(--surface2);border-radius:8px;padding:11px">${esc(d.corrected)}</div>`;
  if (d.modelAnswer) html += `<div style="font-size:0.78rem;font-weight:800;color:var(--primary-light);margin:10px 0 4px">🌟 모범답안</div><div style="font-size:0.84rem;line-height:1.7;background:var(--surface2);border-radius:8px;padding:11px">${esc(d.modelAnswer)}</div>`;
  html += `</div>`;
  res.innerHTML = html;
}

/* ───────────────────────────────────────────────────────────────────────
   ⑤ 어휘 — 빈도 기반 레벨별 단어팩 (NGSL/Oxford 3000–5000) → SRS 연동
─────────────────────────────────────────────────────────────────────── */
const VOCAB_BANK = {
  A1: [['family','가족'],['water','물'],['house','집'],['friend','친구'],['happy','행복한'],['eat','먹다'],['big','큰'],['school','학교'],['day','날, 하루'],['like','좋아하다']],
  A2: [['weather','날씨'],['travel','여행하다'],['decide','결정하다'],['remember','기억하다'],['important','중요한'],['expensive','비싼'],['arrive','도착하다'],['favorite','가장 좋아하는'],['busy','바쁜'],['borrow','빌리다']],
  B1: [['advantage','장점'],['environment','환경'],['suggest','제안하다'],['available','이용 가능한'],['experience','경험'],['improve','개선하다'],['recommend','추천하다'],['responsible','책임이 있는'],['describe','묘사하다'],['opportunity','기회']],
  B2: [['assume','가정하다'],['consequence','결과'],['significant','상당한'],['acknowledge','인정하다'],['reluctant','꺼리는'],['flexible','유연한'],['estimate','추정하다'],['demonstrate','입증하다'],['inevitable','불가피한'],['perspective','관점']],
  C1: [['advocate','옹호하다'],['ambiguous','모호한'],['compelling','설득력 있는'],['undermine','약화시키다'],['prevalent','만연한'],['scrutiny','면밀한 조사'],['nuance','미묘한 차이'],['coherent','일관성 있는'],['mitigate','완화하다'],['plausible','그럴듯한']],
  C2: [['ubiquitous','어디에나 있는'],['esoteric','난해한'],['ostensibly','표면상'],['juxtapose','병치하다'],['tenuous','빈약한'],['paradigm','패러다임'],['quintessential','전형적인'],['cogent','설득력 있는'],['precarious','불안정한'],['ostentatious','과시적인']],
};
let vocabLevel = null;
function renderVocab(el) {
  vocabLevel = vocabLevel || myCefr();
  const pack = VOCAB_BANK[vocabLevel] || [];
  let html = learnHeader('🔡', '어휘 (Vocabulary)', '빈도순 핵심 단어팩 — 탭하면 표현장+간격반복(SRS)에 등록');
  html += levelChips(vocabLevel, 'pickVocabLevel');
