<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PREPLY AI 스피킹 코치</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    button { font-family: inherit; }

    /* ── Header ── */
    header {
      padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .logo { font-size: 0.95rem; font-weight: 800; color: var(--primary-light); white-space: nowrap; }
    .logo span { color: var(--text-muted); font-weight: 400; font-size: 0.75rem; margin-left: 6px; }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    select {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 5px 8px; font-size: 0.78rem; cursor: pointer; outline: none;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.ok { background: var(--green); }
    .streak { font-size: 0.78rem; color: var(--yellow); font-weight: 700; white-space: nowrap; }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .mode-tab {
      flex: 1; padding: 10px 2px; background: none; border: none; border-bottom: 2.5px solid transparent;
      color: var(--text-muted); font-size: 0.74rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .mode-tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }

    /* ── Lesson chips ── */
    .lesson-bar {
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
    }
    .lesson-bar::-webkit-scrollbar { display: none; }
    .lesson-chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 18px; font-size: 0.76rem; font-weight: 600;
      background: var(--surface2); border: 1.5px solid var(--border); color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .lesson-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
    .lesson-chip.preview { border-style: dashed; color: #c4b5fd; }
    .lesson-chip.preview.active { background: #7c3aed; border-color: #7c3aed; color: white; }

    /* ── Main panels ── */
    .panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
    .panel.active { display: flex; }
    .panel-inner { padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }

    /* ── Lesson study ── */
    .study-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px;
    }
    .study-card h3 { font-size: 0.9rem; color: var(--primary-light); margin-bottom: 10px; }
    .point { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .point:last-child { border-bottom: none; }
    .point .en { font-size: 0.9rem; font-weight: 600; }
    .point .kr { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .example-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .example-row:last-child { border-bottom: none; }
    .example-row .txt { flex: 1; }
    .speak-mini {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 9px; cursor: pointer; font-size: 0.85rem; flex-shrink: 0; color: var(--text);
    }
    .speak-mini:hover { border-color: var(--primary); }
    .hw-box {
      background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius);
      padding: 12px 14px; font-size: 0.82rem; color: #fcd34d; line-height: 1.6;
    }
    .start-drill-btn {
      width: 100%; padding: 13px; margin-top: 12px; background: var(--primary); border: none;
      border-radius: var(--radius); color: white; font-size: 0.92rem; font-weight: 700; cursor: pointer;
    }
    .start-drill-btn:hover { background: var(--primary-light); }

    /* ── Drill ── */
    .drill-progress { display: flex; gap: 4px; margin-bottom: 14px; }
    .drill-progress .seg { flex: 1; height: 5px; border-radius: 3px; background: var(--surface2); }
    .drill-progress .seg.ok { background: var(--green); }
    .drill-progress .seg.bad { background: var(--red); }
    .drill-progress .seg.cur { background: var(--primary); }
    .drill-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px 20px; text-align: center;
    }
    .drill-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
    .drill-kr { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 6px; }
    .drill-cat { display: inline-block; font-size: 0.7rem; color: var(--primary-light); background: rgba(99,102,241,0.15); padding: 3px 10px; border-radius: 10px; margin-bottom: 16px; }
    .drill-input-row { display: flex; gap: 8px; margin-top: 8px; }
    .drill-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 11px 14px; font-size: 0.95rem; outline: none;
    }
    .drill-input:focus { border-color: var(--primary); }
    .drill-feedback { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.6; text-align: left; display: none; }
    .drill-feedback.correct { display: block; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); color: #6ee7b7; }
    .drill-feedback.wrong { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .drill-feedback .target { font-size: 1.05rem; font-weight: 700; color: var(--text); margin: 6px 0; }
    .drill-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 11px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    }
    .btn.primary { background: var(--primary); color: white; border: none; }
    .btn.primary:hover { background: var(--primary-light); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .drill-done { text-align: center; padding: 30px 16px; }
    .drill-done .big { font-size: 2.4rem; margin-bottom: 10px; }
    .drill-done .score { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .drill-done .sub { font-size: 0.84rem; color: var(--text-muted); line-height: 1.6; }

    /* ── Conversation ── */
    #panel-talk { overflow: hidden; }
    .missions {
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .missions-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .mission-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .mission {
      font-size: 0.74rem; padding: 4px 10px; border-radius: 12px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); transition: all 0.3s;
    }
    .mission.done { background: rgba(16,185,129,0.15); border-color: var(--green); color: #6ee7b7; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 13px; scroll-behavior: smooth; }
    .msg { max-width: 84%; display: flex; flex-direction: column; gap: 3px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.ai { align-self: flex-start; align-items: flex-start; }
    .msg.system { align-self: center; max-width: 100%; align-items: center; }
    .bubble { padding: 11px 15px; border-radius: var(--radius); line-height: 1.65; font-size: 0.9rem; word-break: break-word; }
    .msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system .bubble { background: transparent; color: var(--text-muted); font-size: 0.76rem; text-align: center; }
    .correction-box {
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); border-left: 3px solid var(--yellow);
      border-radius: 0 10px 10px 0; padding: 9px 13px; font-size: 0.82rem; line-height: 1.6; color: #fcd34d; margin-top: 6px; width: 100%;
    }
    .correction-box .label, .explain-box .label { font-size: 0.7rem; font-weight: 700; opacity: 0.7; text-transform: uppercase; margin-bottom: 3px; }
    .wrong { text-decoration: line-through; opacity: 0.6; color: var(--red); }
    .right { color: #86efac; font-weight: 700; }
    .explain-box {
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-left: 3px solid var(--green);
      border-radius: 0 10px 10px 0; padding: 9px 13px; font-size: 0.82rem; line-height: 1.6; color: #6ee7b7; margin-top: 6px; width: 100%;
    }
    .msg-meta { font-size: 0.68rem; color: var(--text-muted); padding: 0 4px; }
    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 13px 17px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    .input-area { padding: 12px 14px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .interim { min-height: 20px; font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 8px; font-style: italic; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .text-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 12px; padding: 11px 15px; font-size: 0.9rem; outline: none;
    }
    .text-input:focus { border-color: var(--primary); }
    .round-btn {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer;
      background: var(--surface2); font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; color: var(--text);
    }
    .round-btn:hover { border-color: var(--primary); }
    .round-btn.listening { background: var(--primary); border-color: var(--primary); animation: pulse 1.2s infinite; }
    .round-btn.speaking { background: var(--green); border-color: var(--green); }
    .round-btn.send { background: var(--primary); border: none; color: white; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.6); } 50% { box-shadow: 0 0 0 12px rgba(99,102,241,0); } }
    .mini-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 8px; padding: 5px 10px; font-size: 0.74rem; font-weight: 600; cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary-light); }

    /* ── Review / Progress ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-card .num { font-size: 1.5rem; font-weight: 800; color: var(--primary-light); }
    .stat-card .lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    .lesson-progress-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 15px; margin-bottom: 8px;
    }
    .lesson-progress-row .top { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 600; margin-bottom: 7px; }
    .lesson-progress-row .top .pct { color: var(--primary-light); }
    .bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 3px; transition: width 0.4s; }
    .mission-history { font-size: 0.74rem; color: var(--text-muted); margin-top: 7px; }
    .empty-note { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 40px 16px; line-height: 1.7; }

    /* ── Master roadmap ── */
    .level-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 15px; margin-bottom: 12px; position: relative;
    }
    .level-card.current { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .level-card.locked { opacity: 0.75; }
    .level-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .level-badge {
      font-size: 0.7rem; font-weight: 800; padding: 3px 10px; border-radius: 10px;
      background: var(--primary); color: white; flex-shrink: 0;
    }
    .level-badge.done { background: var(--green); }
    .level-badge.future { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .level-name { font-size: 0.92rem; font-weight: 800; }
    .level-cefr { font-size: 0.72rem; color: var(--text-muted); margin-left: auto; font-weight: 700; }
    .level-goal { font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 10px; }
    .unit-row {
      display: flex; align-items: center; gap: 9px; padding: 8px 0; border-top: 1px solid var(--border);
    }
    .unit-status { font-size: 0.9rem; width: 22px; text-align: center; flex-shrink: 0; }
    .unit-info { flex: 1; min-width: 0; }
    .unit-title { font-size: 0.84rem; font-weight: 600; }
    .unit-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
    .unit-go {
      background: var(--surface2); border: 1px solid var(--border); color: var(--primary-light);
      border-radius: 8px; padding: 5px 12px; font-size: 0.74rem; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .unit-go:hover { border-color: var(--primary); }
  </style>
</head>
<body>

<header>
  <div class="logo">🎓 PREPLY AI 코치<span id="app-version"></span></div>
  <div class="header-controls">
    <span class="streak" id="streak">🔥 0일</span>
    <div class="status-dot" id="status-dot" title="Ollama 연결 상태"></div>
    <select id="voice-sel" title="영어 음성 선택 — 바꾸면 샘플이 재생됩니다"></select>
    <select id="model-sel" title="모델 선택">
      <option value="gemma4:e2b">gemma4:e2b</option>
      <option value="gemma4">gemma4</option>
      <option value="gemma3">gemma3</option>
    </select>
  </div>
</header>

<div class="mode-tabs">
  <button class="mode-tab" data-mode="master" onclick="setMode('master', this)">🗺 마스터</button>
  <button class="mode-tab active" data-mode="study" onclick="setMode('study', this)">📖 레슨</button>
  <button class="mode-tab" data-mode="drill" onclick="setMode('drill', this)">🔁 드릴</button>
  <button class="mode-tab" data-mode="talk" onclick="setMode('talk', this)">🗣 회화</button>
  <button class="mode-tab" data-mode="review" onclick="setMode('review', this)">📝 복습</button>
  <button class="mode-tab" data-mode="progress" onclick="setMode('progress', this)">📊 진도</button>
</div>

<div class="lesson-bar" id="lesson-bar"></div>

<!-- 📖 STUDY -->
<div class="panel active" id="panel-study"><div class="panel-inner" id="study-content"></div></div>

<!-- 🔁 DRILL -->
<div class="panel" id="panel-drill"><div class="panel-inner" id="drill-content"></div></div>

<!-- 🗣 TALK -->
<div class="panel" id="panel-talk">
  <div class="missions" id="missions-box">
    <div class="missions-title">🎯 오늘의 표현 미션 — 대화에서 직접 사용해 보세요</div>
    <div class="mission-list" id="mission-list"></div>
  </div>
  <div id="chat"></div>
  <div class="input-area">
    <div class="interim" id="interim-text"></div>
    <div class="controls">
      <button class="mini-btn" onclick="requestSummary()" title="AI가 오늘 대화를 평가해줍니다">📋 요약</button>
      <input class="text-input" id="text-input" placeholder="영어로 입력하거나 🎙️로 말하세요" maxlength="500"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText();}"/>
      <button class="round-btn" id="mic-btn" onclick="toggleMic()" title="누르면 듣기 시작 · 다 말하면 다시 눌러 전송">🎙️</button>
      <button class="round-btn send" id="send-btn" onclick="sendText()" title="전송">➤</button>
    </div>
  </div>
</div>

<!-- 📝 REVIEW -->
<div class="panel" id="panel-review"><div class="panel-inner" id="review-content"></div></div>

<!-- 📊 PROGRESS -->
<div class="panel" id="panel-progress"><div class="panel-inner" id="progress-content"></div></div>

<!-- 🗺 MASTER ROADMAP -->
<div class="panel" id="panel-master"><div class="panel-inner" id="master-content"></div></div>

<script>
const APP_VERSION = 'v2.6';

/* ═══════════════════════════════════════════════════
   PREPLY 레슨 데이터 (Notion 레슨노트 기반)
═══════════════════════════════════════════════════ */
const LESSONS = [
  {
    id: 1, title: "기초 문법 & 발음", date: "2026-05-28",
    sections: [
      { title: "문장 구조", points: [
        { en: "I / You / We / They + 동사원형", kr: "예: I eat, You study, They go" },
        { en: "She / He / It + 동사 + s/es", kr: "예: She eats, He goes" },
        { en: "부정문: don't / doesn't + 동사원형", kr: "예: I don't eat, She doesn't eat" },
        { en: "의문문: Do/Does + 주어 + 동사원형?", kr: "예: Do you study? Does she eat?" },
        { en: "의문사: What / Why / When + Do/Does + 주어 + 동사?", kr: "예: What do you do?" },
      ]},
      { title: "발음 포인트", points: [
        { en: "A 소리: '아' — apple, at, and", kr: "복식호흡으로 깊게 발음" },
      ]},
    ],
    examples: [
      { en: "I eat rice every day.", kr: "나는 매일 밥을 먹는다." },
      { en: "She doesn't drink coffee.", kr: "그녀는 커피를 마시지 않는다." },
      { en: "What do you do on weekends?", kr: "주말에 무엇을 합니까?" },
    ],
    homework: "긍정문/부정문/의문문 포함 30문장 작성 + 녹음",
    scenario: { title: "일상 루틴 토크", desc: "AI가 하루 일과를 물어봅니다. 현재형으로 답하세요." },
  },
  {
    id: 2, title: "관사 & 과거 시제", date: "2026-06-03",
    sections: [
      { title: "관사", points: [
        { en: "a + 자음 시작: a book, a coffee", kr: "막연한 하나" },
        { en: "an + 모음 시작: an apple, an electronic shaver", kr: "모음(A E I O U) 앞" },
        { en: "the: 특정한 것", kr: "예: the book (방금 말한 그 책)" },
      ]},
      { title: "To 부정사", points: [
        { en: "to + 동사원형 = ~하기 위해", kr: "I went to Hi-Mart to buy a shaver." },
      ]},
      { title: "과거 시제", points: [
        { en: "동사 과거형: ate, drank, went, worked", kr: "" },
        { en: "과거 부정문: didn't + 동사원형", kr: "I didn't eat." },
        { en: "과거 의문문: Did + 주어 + 동사원형?", kr: "Did you eat?" },
      ]},
      { title: "감사 표현", points: [
        { en: "I'm grateful to + 사람 + because...", kr: "사람에게 감사" },
        { en: "I'm grateful for + 동명사", kr: "상황에 감사" },
      ]},

function lessonLabel(l) { return l.preview ? `🔮 선행 ${l.id - 100}` : `${l.id}회차`; }

function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } }

function markPracticedToday() {
  const days = load('va_days', []);
  const today = new Date().toISOString().slice(0, 10);
  if (!days.includes(today)) { days.push(today); store('va_days', days); }
  renderStreak();
}
function calcStreak() {
  const days = new Set(load('va_days', []));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (days.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function renderStreak() { document.getElementById('streak').textContent = `🔥 ${calcStreak()}일`; }

function buildLessonBar() {
  const bar = document.getElementById('lesson-bar');
  bar.innerHTML = '';
  LESSONS.forEach(l => {
    const chip = document.createElement('button');
    chip.className = 'lesson-chip' + (l.preview ? ' preview' : '') + (l.id === currentLesson.id ? ' active' : '');
    chip.textContent = `${lessonLabel(l)} · ${l.title}`;
    chip.onclick = () => selectLesson(l, chip);
    bar.appendChild(chip);
  });
}

function selectLesson(lesson, chip) {
  masterTopic = null;
  document.querySelectorAll('.lesson-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentLesson = lesson;
  history = [];
  missionState = {};
  renderStudy();
  renderMissions();
  if (currentMode === 'drill') renderDrillIntro();
  if (currentMode === 'progress') renderProgress();
  document.getElementById('chat').innerHTML = '';
  addSystemMsg(`${lessonLabel(lesson)} "${lesson.title}" — ${lesson.scenario.title}. ${lesson.scenario.desc}${lesson.preview ? '\n🔮 선행학습: 회화를 시작하면 AI 코치가 먼저 핵심 패턴을 가르쳐 줍니다. "시작"이라고 보내보세요!' : ''}`);
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + mode).classList.add('active');
  document.getElementById('lesson-bar').style.display = (mode === 'review' || mode === 'progress' || mode === 'master') ? 'none' : 'flex';
  if (mode === 'drill' && drillQueue.length === 0) renderDrillIntro();
  if (mode === 'review') renderReview();
  if (mode === 'progress') renderProgress();
  if (mode === 'master') renderMaster();
}

async function checkOllama() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch('/health');
    const data = await r.json();
    dot.classList.toggle('ok', data.status === 'ok');
    dot.title = data.status === 'ok' ? 'Ollama 연결됨: ' + (data.models || []).join(', ') : 'Ollama 오류: ' + data.message;
  } catch {
    dot.classList.remove('ok');
    dot.title = 'Ollama 미연결';
  }
}

    });
    html += `</div>`;
  });
  html += `<div class="study-card"><h3>예문 — 🔊 듣고 따라 말하기</h3>`;
  l.examples.forEach(e => {
    html += `<div class="example-row">
      <div class="txt"><div class="en" style="font-weight:600">${esc(e.en)}</div><div class="kr" style="font-size:0.8rem;color:var(--text-muted)">${esc(e.kr)}</div></div>
      <button class="speak-mini" onclick="tts('${jsAttr(e.en)}', 'en-US')">🔊</button>
    </div>`;
  });
  html += `</div>`;

  if (l.dialogue) {
    html += `<div class="study-card"><h3>💬 실전 대화문 — ${esc(l.dialogue.title)}</h3>
      <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px">각 줄의 🔊로 듣고, ▶︎로 대화 전체를 자동 재생할 수 있어요. 역할(A/B)을 정해 따라 읽어보세요.</div>
      <button class="speak-mini" style="margin-bottom:10px;padding:6px 14px" onclick="playDialogue()">▶︎ 대화 전체 재생</button>`;
    l.dialogue.lines.forEach((ln, i) => {
      const color = ln.sp === 'A' ? 'var(--primary-light)' : 'var(--green)';
      html += `<div class="example-row">
        <div class="txt"><div class="en" style="font-weight:600"><span style="color:${color};font-weight:800">${ln.sp}</span> ${esc(ln.en)}</div>
          <div class="kr" style="font-size:0.8rem;color:var(--text-muted)">${esc(ln.kr)}</div></div>
        <button class="speak-mini" onclick="tts('${jsAttr(ln.en)}', 'en-US')">🔊</button>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="hw-box">📌 <b>${l.preview ? '예습 과제' : '숙제'}</b><br>${esc(l.homework)}</div>`;
  html += `<button class="start-drill-btn" onclick="document.querySelector('[data-mode=drill]').click()">이 레슨으로 말하기 드릴 시작 →</button>`;
  document.getElementById('study-content').innerHTML = html;
}

function startDrill(isReview) {
  drillIsReview = isReview;
  if (isReview) {

function renderDrillCard() {

function normalize(s) {
  return s.toLowerCase()
    .replace(/'m\b/g, ' am').replace(/n't\b/g, ' not').replace(/'re\b/g, ' are')
    .replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
    .replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function similarity(a, b) {
  a = normalize(a); b = normalize(b);
  if (!a || !b) return 0;
  return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
}

function checkDrill() {
  const input = document.getElementById('drill-input');
  const answer = input.value.trim();
  if (!answer) return;
  const item = drillQueue[drillIdx];
  const sim = similarity(answer, item.en);
  const correct = sim >= 0.82;
  drillResults.push(correct);
  recordDrillStat(item.lesson, correct);
  updateWeakList(item, correct);
  markPracticedToday();

  const fb = document.getElementById('drill-feedback');
  fb.className = 'drill-feedback ' + (correct ? 'correct' : 'wrong');
  fb.innerHTML = correct
    ? `✅ 정답입니다!${sim < 0.95 ? ' (거의 완벽 — 정답 문장을 확인하세요)' : ''}
       <div class="target">${esc(item.en)} <button class="speak-mini" onclick="tts('${jsAttr(item.en)}','en-US')">🔊</button></div>`
    : `❌ 아쉬워요. 정답:
       <div class="target">${esc(item.en)} <button class="speak-mini" onclick="tts('${jsAttr(item.en)}','en-US')">🔊</button></div>
       내 답: ${esc(answer)}<br><span style="opacity:0.8;font-size:0.8rem">🔁 이 문장은 복습 목록에 추가되었습니다. 듣고 3번 따라 말해보세요.</span>`;
  tts(item.en, 'en-US');
  input.disabled = true;
  const nextBtn = document.getElementById('drill-check-btn');
  nextBtn.textContent = '다음 →';
  nextBtn.onclick = nextDrill;
  nextBtn.focus();  // Enter로 바로 다음 문제 진행
}

function revealDrill() {
  const item = drillQueue[drillIdx];
  drillResults.push(false);
  recordDrillStat(item.lesson, false);
  updateWeakList(item, false);
  markPracticedToday();
  const fb = document.getElementById('drill-feedback');
  fb.className = 'drill-feedback wrong';
  fb.innerHTML = `정답: <div class="target">${esc(item.en)} <button class="speak-mini" onclick="tts('${jsAttr(item.en)}','en-US')">🔊</button></div>
    <span style="opacity:0.8;font-size:0.8rem">🔁 복습 목록에 추가됨 — 듣고 3번 따라 말해보세요.</span>`;
  tts(item.en, 'en-US');
  document.getElementById('drill-input').disabled = true;
  const nextBtn = document.getElementById('drill-check-btn');
  nextBtn.textContent = '다음 →';
  nextBtn.onclick = nextDrill;
  nextBtn.focus();
}

function nextDrill() { drillIdx++; renderDrillCard(); }

function renderDrillDone(target) {
  const correct = drillResults.filter(Boolean).length;
  const pct = Math.round(correct / drillResults.length * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪';
  const note = pct >= 90 ? '완벽해요! 이제 회화 탭에서 실전으로 사용해 보세요.'
    : pct >= 70 ? '좋아요! 틀린 문장은 복습 탭에서 다시 연습하세요.'
    : '복습 탭에서 틀린 문장을 다시 연습한 뒤 재도전하세요.';
  document.getElementById(target).innerHTML = `
    <div class="drill-card drill-done">
      <div class="big">${emoji}</div>
      <div class="score">${correct} / ${drillResults.length} (${pct}%)</div>
      <div class="sub">${note}</div>
      <div class="drill-actions" style="margin-top:20px">
        <button class="btn" onclick="${drillIsReview ? 'renderReview()' : 'renderDrillIntro()'}">처음으로</button>
        <button class="btn primary" onclick="startDrill(${drillIsReview})">다시 도전</button>
      </div>
    </div>`;
  drillQueue = [];
}

function recordDrillStat(lessonId, correct) {
  const stats = load('va_stats', {});
  const s = stats[lessonId] || { attempts: 0, correct: 0 };
  s.attempts++; if (correct) s.correct++;
  stats[lessonId] = s;
  store('va_stats', stats);
}

/* Leitner 간격 반복: 틀리면 box 0, 맞히면 box+1, box 3이면 졸업 */
function updateWeakList(item, correct) {
  let weak = load('va_weak', []);
  const idx = weak.findIndex(w => w.en === item.en);
  if (correct) {
    if (idx >= 0) {
      weak[idx].box = (weak[idx].box || 0) + 1;
      if (weak[idx].box >= 3) weak.splice(idx, 1);
    }
  } else {
    if (idx >= 0) weak[idx].box = 0;
    else weak.push({ kr: item.kr, en: item.en, lesson: item.lesson, cat: item.cat, box: 0 });
  }
  store('va_weak', weak);
}

function drillMic() {

function sendText() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || isProcessing) return;
  input.value = '';
  sendMessage(text);
}

async function sendMessage(text, hidden) {
  if (!text || isProcessing) return;
  stopSpeaking();
  if (!hidden) {
    addUserMsg(text);
    checkMissions(text);
    markPracticedToday();
  }
  const model = document.getElementById('model-sel').value;
  history.push({ role: 'user', content: text });
  const typingEl = addTypingIndicator();
  isProcessing = true;
  updateTalkBtns();

  const messages = [{ role: 'system', content: buildSystemPrompt() }, ...history];
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages, stream: true })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    typingEl.remove();
    let fullText = '';
    const { textEl } = addAiMsg();
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n').filter(Boolean);
      for (const line of lines) {
        try {
          const obj = JSON.parse(line);
          if (obj.message?.content) {
            fullText += obj.message.content;
            textEl.innerHTML = renderAiText(fullText);
          }
          if (obj.done) break;
        } catch {}
      }
    }
    history.push({ role: 'assistant', content: fullText });
    scrollBottom();
    if (fullText) speakText(fullText);
  } catch (err) {
    typingEl?.remove?.();
    addSystemMsg(`❌ 오류: ${err.message}\nOllama 실행 여부와 모델(${model}) 설치를 확인하세요. → ollama pull ${model}`);
  } finally {
    isProcessing = false;
    updateTalkBtns();
  }
}

function requestSummary() {
  if (history.length < 2) { addSystemMsg('아직 대화가 충분하지 않습니다. 먼저 영어로 대화해 보세요!'); return; }
  sendMessage('지금까지의 대화를 평가해주세요. 한국어로: 1) 잘한 점 2) 자주 틀린 패턴 3) 복습할 표현 3개를 [EXPLAIN: ] 형식으로 정리해주세요.', true);
  addSystemMsg('📋 AI 코치가 오늘 연습을 평가 중...');
}

/* ── 응답 파서: [CORRECT:] [EXPLAIN:] ── */
function renderAiText(raw) {
  const correctionRe = /\[CORRECT:\s*"([^"]+)"\s*→\s*"([^"]+)"\s*\|([^\]]+)\]/g;
  const explainRe = /\[EXPLAIN:\s*([^\]]+)\]/g;
  let plain = raw.replace(correctionRe, '').replace(explainRe, '').trim();
  let html = esc(plain).replace(/\n/g, '<br>');
  let m;
  correctionRe.lastIndex = 0;
  while ((m = correctionRe.exec(raw)) !== null) {
    html += `<div class="correction-box"><div class="label">📝 문법 교정</div>
      <span class="wrong">${esc(m[1])}</span> → <span class="right">${esc(m[2])}</span><br>
      <span style="opacity:0.8;font-size:0.78rem">${esc(m[3].trim())}</span></div>`;
  }
  explainRe.lastIndex = 0;
  while ((m = explainRe.exec(raw)) !== null) {
    html += `<div class="explain-box"><div class="label">💡 코치 설명</div>${esc(m[1].trim()).replace(/\n/g, '<br>')}</div>`;
  }
  return html;
}

      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById('master-content').innerHTML = html;
}

function goToUnit(lessonId) {
  masterTopic = null;
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return;
  currentLesson = lesson;
  history = [];
  missionState = {};
  buildLessonBar();
  renderStudy();
  renderMissions();
  const studyTab = document.querySelector('[data-mode="study"]');
  setMode('study', studyTab);
}

function goToTopic(unitId) {
  const lvl = MASTER_CURRICULUM.find(l => l.units.some(u => u.id === unitId));
  const unit = lvl?.units.find(u => u.id === unitId);
  if (!unit) return;
  masterTopic = { unitId, title: unit.title, sub: unit.sub, level: lvl.level, levelName: lvl.name, cefr: lvl.cefr, topic: unit.topic || '' };

  setMode('talk', talkTab);
  document.getElementById('chat').innerHTML = '';

  addSystemMsg(`🗺 마스터 코스 [${lvl.cefr}] ${unit.title}\n${unit.sub}\n\nAI 코치와 영어로 대화해 보세요. "Hi" 또는 "시작"이라고 보내면 AI가 먼저 핵심 패턴을 소개합니다.`);
}

/* ═══════════════════════════════════════════════════
   STT / TTS
═══════════════════════════════════════════════════ */
let sttFinal = '';       // 이번 발화에서 확정된 텍스트 누적
let sttActive = false;   // 사용자가 마이크를 켜두려는 의도
let sttDrill = false;    // 드릴 모드 여부

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('mic-btn').disabled = true;
    document.getElementById('mic-btn').title = '이 브라우저는 음성 인식 미지원. Chrome을 사용하세요.';
    return;
  }
  recognition = new SR();
  recognition.continuous = true;       // 잠깐 멈춰도 끊기지 않게
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) sttFinal += res[0].transcript + ' ';
      else interim += res[0].transcript;
    }
    const shown = (sttFinal + interim).replace(/\s+/g, ' ').trim();
    if (sttDrill) {
      const di = document.getElementById('drill-input');
      if (di) di.value = shown;
    } else {
      document.getElementById('text-input').value = shown;
      document.getElementById('interim-text').textContent = shown
        ? '🎙️ ' + shown + '  ·  (다 말했으면 마이크를 다시 누르세요)'
        : '🎙️ 듣는 중... 천천히 말해도 괜찮아요';
    }
  };

  recognition.onend = () => {
    // 브라우저가 임의로 멈추면, 사용자가 계속 듣기를 원하는 동안 자동 재시작
    if (sttActive) {
      try { recognition.start(); return; } catch (e) { /* 아직 정리 중이면 무시 */ }
    }
    isListening = false;
    document.getElementById('mic-btn')?.classList.remove('listening');
    document.getElementById('drill-mic')?.classList.remove('listening');
    finishListening();
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return; // 치명적 아님 — 계속 듣기
    sttActive = false;
    isListening = false;
    document.getElementById('mic-btn')?.classList.remove('listening');
    document.getElementById('drill-mic')?.classList.remove('listening');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      addSystemMsg('🎙️ 마이크 권한이 꺼져 있습니다. 주소창 왼쪽 자물쇠 아이콘 → 마이크 → 허용으로 바꾼 뒤 다시 시도하세요. (모바일은 https 주소에서만 동작합니다)');
    } else {
      addSystemMsg(`🎙️ 음성 인식 오류: ${e.error}`);
    }
  };
}

function startMic(drillMode) {
  if (!recognition) return;
  stopSpeaking();
  sttFinal = '';
  sttActive = true;
  sttDrill = drillMode;
  recognition.lang = 'en-US';
  try { recognition.start(); } catch (e) { /* 이미 시작됨 */ }
  isListening = true;
  if (drillMode) {
    document.getElementById('drill-mic')?.classList.add('listening');
  } else {
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('interim-text').textContent = '🎙️ 듣는 중... 천천히 말해도 괜찮아요';
  }
}

function stopMic() {
  sttActive = false;  // 의도 해제 → onend에서 재시작하지 않고 마무리
  try { recognition.stop(); } catch (e) {}
}

function finishListening() {
  if (sttDrill) {
    sttDrill = false;
    return;  // 드릴은 입력칸에 채워두고, 사용자가 확인 버튼을 누르게 둠
  }
  const text = document.getElementById('text-input').value.trim();
  document.getElementById('interim-text').textContent = '';
  if (text) { sendMessage(text); document.getElementById('text-input').value = ''; }
  sttFinal = '';
}

function toggleMic() {
  if (isProcessing || !recognition) return;
  if (sttActive) stopMic();
  else startMic(false);
}

/* 친근한 여성 음성 우선 선택 (macOS/Chrome/Windows 대표 음성 순) */
const PREFERRED_VOICES = {
  en: ['Samantha', 'Google US English', 'Ava', 'Allison', 'Susan', 'Joanna', 'Jenny', 'Aria', 'Zira', 'Victoria', 'Karen', 'Moira', 'Tessa'],
  ko: ['Yuna', 'Google 한국의', 'Heami', 'SunHi'],
};
function pickVoice(lang) {
  const voices = window.speechSynthesis.getVoices();
  const prefix = lang.slice(0, 2);
  const candidates = voices.filter(v => v.lang.replace('_', '-').startsWith(prefix));
  if (!candidates.length) return null;
  // 사용자가 직접 고른 영어 음성이 있으면 최우선
  if (prefix === 'en') {
    const savedName = load('va_voice_en', null);
    const saved = savedName && candidates.find(v => v.name === savedName);
    if (saved) return saved;
  }
  for (const name of (PREFERRED_VOICES[prefix] || [])) {
    const hit = candidates.find(v => v.name.includes(name));
    if (hit) return hit;
  }
  // 이름에 female 표기가 있으면 그것, 없으면 첫 번째
  return candidates.find(v => /female/i.test(v.name)) || candidates[0];
}

/* 헤더의 음성 선택 드롭다운 — 기기에 설치된 영어 음성 목록에서 직접 선택 */
function initVoiceSelector() {
  const sel = document.getElementById('voice-sel');
  if (!window.speechSynthesis) { sel.style.display = 'none'; return; }
  const populate = () => {
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').startsWith('en'));
    if (!voices.length) return;
    const current = pickVoice('en-US');
    sel.innerHTML = voices.map(v =>
      `<option value="${esc(v.name)}" ${current && v.name === current.name ? 'selected' : ''}>🔊 ${esc(v.name)}</option>`
    ).join('');
  };
  populate();
  window.speechSynthesis.onvoiceschanged = populate;
  sel.onchange = () => {
    store('va_voice_en', sel.value);
    tts("Hi! I'm your English coach. Nice to meet you!", 'en-US');
  };
}

function tts(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;   // 살짝 또박또박
  u.pitch = 1.06;  // 살짝 밝은 톤
  const v = pickVoice(lang);
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* A 다음으로 듣기 좋은 영어 여성 음성을 고른다 (A는 제외) */
function pickSecondVoice(voiceA) {
  const candidates = window.speechSynthesis.getVoices()
    .filter(v => v.lang.replace('_', '-').startsWith('en') && (!voiceA || v.name !== voiceA.name));
  if (!candidates.length) return voiceA;
  // 친근한 여성 음성 우선순위에서 A가 아닌 첫 번째
  for (const name of PREFERRED_VOICES.en) {
    const hit = candidates.find(v => v.name.includes(name));
    if (hit) return hit;
  }
  return candidates.find(v => /female/i.test(v.name)) || candidates[0];
}

/* 실전 대화문 전체 자동 재생 — A는 사용자가 고른 음성, B는 또 다른 여성 음성 + 피치로 구분 */
function playDialogue() {
  if (!window.speechSynthesis || !currentLesson.dialogue) return;
  window.speechSynthesis.cancel();
  const voiceA = pickVoice('en-US');
  const voiceB = pickSecondVoice(voiceA);
  const lines = currentLesson.dialogue.lines;
  let i = 0;
  const next = () => {
    if (i >= lines.length) return;
    const ln = lines[i++];
    const isA = ln.sp === 'A';
    const u = new SpeechSynthesisUtterance(ln.en);
    u.lang = 'en-US';
    u.rate = 0.95;
    u.voice = isA ? voiceA : voiceB;
    // 같은 음성이 걸려도 두 화자가 구분되도록 피치를 살짝 다르게 (둘 다 밝은 여성 톤)
    u.pitch = isA ? 1.06 : 1.18;
    u.onend = next;
    u.onerror = next;
    window.speechSynthesis.speak(u);
  };
  next();
}

function speakText(raw) {
  if (!window.speechSynthesis) return;
  stopSpeaking();
  const segments = [];
  const explainRe = /\[EXPLAIN:\s*([^\]]+)\]/g;
  let m, lastIdx = 0;
  while ((m = explainRe.exec(raw)) !== null) {
    if (m.index > lastIdx) segments.push({ text: raw.slice(lastIdx, m.index).replace(/\[CORRECT:[^\]]+\]/g, '').trim(), lang: 'en-US' });
    segments.push({ text: m[1].trim(), lang: 'ko-KR' });
    lastIdx = m.index + m[0].length;
  }
  if (lastIdx < raw.length) segments.push({ text: raw.slice(lastIdx).replace(/\[CORRECT:[^\]]+\]/g, '').replace(/\[EXPLAIN:[^\]]+\]/g, '').trim(), lang: 'en-US' });
  speakQueue(segments, 0);
}

function speakQueue(segments, idx) {
  if (idx >= segments.length) { document.getElementById('mic-btn').classList.remove('speaking'); return; }
  const { text, lang } = segments[idx];
  if (!text) { speakQueue(segments, idx + 1); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;
  u.pitch = 1.06;
  const v = pickVoice(lang);
  if (v) u.voice = v;
  u.onstart = () => document.getElementById('mic-btn').classList.add('speaking');
  u.onend = () => speakQueue(segments, idx + 1);
  u.onerror = () => speakQueue(segments, idx + 1);
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById('mic-btn').classList.remove('speaking');
}

/* ═══════════════════════════════════════════════════
   DOM HELPERS
═══════════════════════════════════════════════════ */
function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${esc(text)}</div><div class="msg-meta">${timeStr()}</div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
}
function addAiMsg() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  div.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = timeStr();
  div.appendChild(meta);
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return { textEl: bubble };
}
function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${esc(text).replace(/\n/g, '<br>')}</div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
}
function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg ai typing';
  div.innerHTML = `<div class="bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}
function timeStr() { return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
/* onclick 속성 안의 JS 문자열용: JS 이스케이프 후 HTML 엔티티 처리 (따옴표로 속성이 깨지지 않게) */
function jsAttr(s) { return esc(escJs(s)); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
