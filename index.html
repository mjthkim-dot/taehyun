<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PREPLY 영어 학습 - 태현의 영어 여정</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-bg: #eef2ff;
      --green: #10b981;
      --green-bg: #d1fae5;
      --orange: #f59e0b;
      --orange-bg: #fef3c7;
      --red: #ef4444;
      --red-bg: #fee2e2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white; padding: 20px 24px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(79,70,229,0.3);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
    header p { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }

    /* ── Nav ── */
    nav {
      display: flex; gap: 6px; padding: 14px 24px;
      background: var(--card); border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      flex-shrink: 0; padding: 8px 16px; border-radius: 30px; border: none;
      background: transparent; color: var(--text-muted); font-size: 0.85rem;
      font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .nav-btn:hover { background: var(--primary-bg); color: var(--primary); }
    .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 3px 10px rgba(79,70,229,0.35); }

    /* ── Main ── */
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── Section ── */
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Cards ── */
    .card {
      background: var(--card); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 14px;
    }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 10px; }

    /* ── Dashboard ── */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card); border-radius: var(--radius); padding: 16px; text-align: center;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .stat-num { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .lesson-cards { display: grid; gap: 12px; }
    .lesson-card {
      background: var(--card); border-radius: var(--radius); padding: 18px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; gap: 16px; align-items: flex-start; cursor: pointer;
      transition: all 0.2s;
    }
    .lesson-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.12); }
    .lesson-num {
      width: 42px; height: 42px; border-radius: 50%; background: var(--primary-bg);
      color: var(--primary); font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .lesson-info h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .lesson-info .date { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      padding: 3px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
      background: var(--primary-bg); color: var(--primary);
    }

    /* ── Lessons Notes ── */
    .accordion-item { margin-bottom: 10px; }
    .accordion-header {
      width: 100%; text-align: left; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; box-shadow: var(--shadow);
      transition: all 0.2s; color: var(--text);
    }
    .accordion-header:hover { border-color: var(--primary); color: var(--primary); }
    .accordion-header.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: var(--primary); color: var(--primary); }
    .accordion-arrow { font-size: 1rem; transition: transform 0.25s; }
    .accordion-header.open .accordion-arrow { transform: rotate(180deg); }
    .accordion-body {
      background: var(--card); border: 1px solid var(--primary); border-top: none;
      border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius);
      padding: 20px; display: none;
    }
    .accordion-body.open { display: block; animation: fadeIn 0.2s ease; }
    .section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--primary); margin: 14px 0 8px; }
    .section-title:first-child { margin-top: 0; }
    .key-point {
      display: flex; gap: 10px; padding: 8px 12px; border-radius: 8px;
      background: var(--bg); margin-bottom: 6px; font-size: 0.87rem; align-items: flex-start;
    }
    .key-point .dot { color: var(--primary); font-weight: 900; flex-shrink: 0; }
    .example-box {
      background: var(--primary-bg); border-left: 3px solid var(--primary);
      padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 0.86rem;
    }
    .example-box .en { font-weight: 700; color: var(--primary); }
    .example-box .kr { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
    .hw-box {
      background: var(--orange-bg); border-radius: 10px; padding: 12px 16px;
      margin-top: 12px; font-size: 0.84rem;
    }
    .hw-box strong { color: var(--orange); }

    /* ── Flashcards ── */
    .flashcard-controls {
      display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: transparent; font-size: 0.8rem; cursor: pointer; color: var(--text-muted);
      transition: all 0.2s; font-weight: 500;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }

    .flashcard-wrapper { perspective: 1000px; }
    .flashcard {
      width: 100%; min-height: 200px; border-radius: var(--radius);
      position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; min-height: 200px; border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; backface-visibility: hidden; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .card-face.front { background: white; }
    .card-face.back { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; transform: rotateY(180deg); }
    .card-face .lang-label { font-size: 0.75rem; font-weight: 700; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .card-face .card-text { font-size: 1.3rem; font-weight: 700; text-align: center; line-height: 1.5; }
    .card-face .card-meta { font-size: 0.75rem; opacity: 0.6; margin-top: 10px; }
    .card-hint { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; }

    .flashcard-nav { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 16px; }
    .nav-arrow {
      width: 44px; height: 44px; border-radius: 50%; border: none; font-size: 1.2rem;
      background: var(--card); box-shadow: var(--shadow); cursor: pointer; display: flex;
      align-items: center; justify-content: center; border: 1px solid var(--border); transition: all 0.2s;
    }
    .nav-arrow:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .card-counter { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); min-width: 60px; text-align: center; }

    .diff-btns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
    .diff-btn {
      padding: 8px 20px; border-radius: 20px; border: none; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .diff-btn.hard { background: var(--red-bg); color: var(--red); }
    .diff-btn.easy { background: var(--green-bg); color: var(--green); }
    .diff-btn:hover { filter: brightness(0.95); transform: scale(1.03); }

    /* ── Quiz ── */
    .quiz-progress { background: var(--border); border-radius: 10px; height: 6px; margin-bottom: 20px; overflow: hidden; }
    .quiz-progress-bar { height: 100%; background: var(--primary); transition: width 0.4s; border-radius: 10px; }
    .quiz-question { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; line-height: 1.5; }
    .quiz-options { display: grid; gap: 10px; }
    .quiz-option {
      width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px;
      border: 2px solid var(--border); background: white; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s; color: var(--text); font-weight: 500;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
    .quiz-option.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
    .quiz-option.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
    .quiz-option:disabled { cursor: default; }
    .quiz-explanation {
      margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 0.86rem; font-weight: 500;
      background: var(--primary-bg); color: var(--primary); border-left: 4px solid var(--primary);
      display: none;
    }
    .quiz-explanation.show { display: block; animation: fadeIn 0.3s ease; }
    .quiz-next-btn {
      margin-top: 16px; width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; display: none;
    }
    .quiz-next-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
    .quiz-next-btn.show { display: block; }
    .quiz-lesson-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem;
      font-weight: 700; background: var(--primary-bg); color: var(--primary); margin-bottom: 12px;
    }

    .score-card {
      text-align: center; padding: 40px 20px; background: var(--card);
      border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .score-num { font-size: 3.5rem; font-weight: 900; color: var(--primary); }
    .score-sub { font-size: 1rem; color: var(--text-muted); margin: 8px 0 20px; }
    .restart-btn {
      padding: 12px 32px; border-radius: 30px; border: none; background: var(--primary);
      color: white; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .restart-btn:hover { background: var(--primary-light); transform: translateY(-1px); }

    /* ── Translation ── */
    .trans-progress-text { font-size: 0.82rem; color: var(--text-muted); text-align: right; margin-bottom: 14px; }
    .trans-korean {
      background: var(--primary-bg); border-radius: 12px; padding: 20px 24px;
      font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 16px;
      color: var(--primary); line-height: 1.5;
    }
    .trans-lesson-tag {
      text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px;
    }
    .trans-input {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border);
      font-size: 0.95rem; font-family: inherit; resize: vertical; min-height: 90px;
      transition: border-color 0.2s; color: var(--text); outline: none;
    }
    .trans-input:focus { border-color: var(--primary); }
    .trans-btns { display: flex; gap: 10px; margin-top: 12px; }
    .btn-reveal {
      flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--primary);
      background: transparent; color: var(--primary); font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-reveal:hover { background: var(--primary-bg); }
    .btn-next-trans {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
      background: var(--primary); color: white; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-next-trans:hover { background: var(--primary-light); }
    .trans-answer {
      margin-top: 14px; padding: 16px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white;
      font-size: 1.05rem; font-weight: 700; text-align: center; display: none;
    }
    .trans-answer.show { display: block; animation: fadeIn 0.3s ease; }
    .trans-nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-num { font-size: 1.6rem; }
      nav { padding: 12px 16px; }
      main { padding: 14px 12px 60px; }
      .card-face .card-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>📚 PREPLY 영어 학습</h1>
  <p>태현님의 영어 여정 · Notion 수업 내용 기반</p>
</header>

<nav>
  <button class="nav-btn active" onclick="showSection('dashboard')">🏠 홈</button>
  <button class="nav-btn" onclick="showSection('lessons')">📖 수업 노트</button>
  <button class="nav-btn" onclick="showSection('flashcards')">🃏 플래시카드</button>
  <button class="nav-btn" onclick="showSection('quiz')">✏️ 문법 퀴즈</button>
  <button class="nav-btn" onclick="showSection('translation')">🔄 번역 연습</button>
</nav>

<main>

  <!-- ─── Dashboard ─── -->
  <div id="section-dashboard" class="section active">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num">4</div>
        <div class="stat-label">완료 수업</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-cards">0</div>
        <div class="stat-label">암기 카드</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-score">—</div>
        <div class="stat-label">최고 퀴즈</div>
      </div>
    </div>

    <div class="card" style="background: linear-gradient(135deg,#4f46e5,#7c3aed); color:white; border:none;">
      <div style="font-size:0.75rem; opacity:0.75; margin-bottom:6px;">오늘의 다짐</div>
      <div style="font-size:0.95rem; font-weight:700; line-height:1.6;">
        "I grow while learning English and achieve my dreams. To improve my English to the level I aim for, I diligently complete given tasks and learn English every day."
      </div>
    </div>

    <div style="font-size:0.9rem; font-weight:700; color:var(--text-muted); margin: 18px 0 10px; text-transform:uppercase; letter-spacing:0.5px;">수업 기록</div>
    <div class="lesson-cards" id="lesson-cards"></div>
  </div>

  <!-- ─── Lessons ─── -->
  <div id="section-lessons" class="section">
    <div id="accordion-container"></div>
  </div>

  <!-- ─── Flashcards ─── -->
  <div id="section-flashcards" class="section">
    <div class="flashcard-controls">
      <button class="filter-btn active" onclick="filterCards('all',this)">전체</button>
      <button class="filter-btn" onclick="filterCards(1,this)">1회차</button>
      <button class="filter-btn" onclick="filterCards(2,this)">2회차</button>
      <button class="filter-btn" onclick="filterCards(3,this)">3회차</button>
      <button class="filter-btn" onclick="filterCards(4,this)">4회차</button>
    </div>
    <div class="flashcard-wrapper">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face front">
          <div class="lang-label">한국어</div>
          <div class="card-text" id="fc-korean"></div>
          <div class="card-meta" id="fc-meta"></div>
        </div>
        <div class="card-face back">
          <div class="lang-label" style="opacity:0.6">English</div>
          <div class="card-text" id="fc-english"></div>
        </div>
      </div>
    </div>
    <div class="card-hint">카드를 클릭하면 영어 답이 나옵니다</div>
    <div class="flashcard-nav">
      <button class="nav-arrow" onclick="prevCard()">←</button>
      <div class="card-counter" id="card-counter">1 / 1</div>
      <button class="nav-arrow" onclick="nextCard()">→</button>
    </div>
    <div class="diff-btns" id="diff-btns" style="display:none">
      <button class="diff-btn hard" onclick="markDifficulty('hard')">😓 어려워요</button>
      <button class="diff-btn easy" onclick="markDifficulty('easy')">😊 알겠어요</button>
    </div>
  </div>

  <!-- ─── Quiz ─── -->
  <div id="section-quiz" class="section">
    <div id="quiz-container">
      <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-bar"></div></div>
      <div class="card">
        <div class="quiz-lesson-badge" id="quiz-badge"></div>
        <div class="quiz-question" id="quiz-question"></div>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="quiz-explanation" id="quiz-explanation"></div>
        <button class="quiz-next-btn" id="quiz-next" onclick="nextQuestion()">다음 문제 →</button>
      </div>
    </div>
    <div id="quiz-result" style="display:none">
      <div class="score-card">
        <div style="font-size:3rem; margin-bottom:12px;">🎉</div>
        <div class="score-num" id="score-display"></div>
        <div class="score-sub" id="score-sub"></div>
        <button class="restart-btn" onclick="restartQuiz()">다시 도전하기</button>
      </div>
    </div>
  </div>

  <!-- ─── Translation ─── -->
  <div id="section-translation" class="section">
    <div class="trans-progress-text" id="trans-progress"></div>
    <div class="card">
      <div class="trans-lesson-tag" id="trans-lesson-tag"></div>
      <div class="trans-korean" id="trans-korean"></div>
      <textarea class="trans-input" id="trans-input" placeholder="영어로 번역해 보세요..."></textarea>
      <div class="trans-btns">
        <button class="btn-reveal" onclick="revealAnswer()">정답 보기</button>
        <button class="btn-next-trans" onclick="nextTranslation()">다음 ➜</button>
      </div>
      <div class="trans-answer" id="trans-answer"></div>
    </div>
  </div>

</main>

<script>
/* ───────── DATA ───────── */
const LESSONS = [
  {
    id: 1,
    title: "기초 문법 & 발음",
    date: "2026-05-28",
    tags: ["현재형", "부정문", "의문문", "발음 A"],
    sections: [
      {
        title: "문장 구조",
        points: [
          { en: "I / You / We / They + 동사원형", kr: "예: I eat, You study, They go" },
          { en: "She / He / It + 동사 + s/es", kr: "예: She eats, He goes, It works" },
          { en: "부정문: don't / doesn't + 동사원형", kr: "예: I don't eat, She doesn't eat" },
          { en: "의문문: Do/Does + 주어 + 동사원형?", kr: "예: Do you study? Does she eat?" },
          { en: "의문사: What / Why / When + Do/Does + 주어 + 동사?", kr: "예: What do you do? When does she eat?" },
        ]
      },
      {
        title: "발음 포인트",
        points: [
          { en: "A 소리: '아' — apple, at, and", kr: "복식호흡으로 깊게 발음" },
          { en: "배에 손 대고 호흡하면서 발음 연습", kr: "원어민은 자연스럽게 복식호흡을 사용" },
        ]
      }
    ],
    examples: [
      { en: "I eat rice every day.", kr: "나는 매일 밥을 먹는다." },
      { en: "She doesn't drink coffee.", kr: "그녀는 커피를 마시지 않는다." },
      { en: "What do you do on weekends?", kr: "주말에 무엇을 합니까?" },
    ],
    homework: "긍정문, 부정문, 의문문 각각 포함한 30개 영어 문장 작성 + 한글 버전 + 녹음"
  },
  {
    id: 2,
    title: "관사 & 과거 시제",
    date: "2026-06-03",
    tags: ["a/an/the", "To 부정사", "과거형", "감사표현"],
    sections: [
      {

/* ───────── NAV ───────── */
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.currentTarget.classList.add('active');

  if (id === 'quiz') initQuiz();
  if (id === 'flashcards') renderCard();
  if (id === 'translation') renderTranslation();
  if (id === 'dashboard') updateStats();
}

/* ───────── DASHBOARD ───────── */
function updateStats() {
  const mastered = JSON.parse(localStorage.getItem('mastered') || '[]');
  document.getElementById('stat-cards').textContent = mastered.length;
  const best = localStorage.getItem('bestScore');
  document.getElementById('stat-score').textContent = best ? best + '%' : '—';
}

function buildDashboard() {
  const container = document.getElementById('lesson-cards');
  LESSONS.forEach(l => {
    const d = document.createElement('div');
    d.className = 'lesson-card';
    d.onclick = () => { document.querySelector('[onclick="showSection(\'lessons\')"]').click(); openAccordion(l.id); };
    d.innerHTML = `
      <div class="lesson-num">${l.id}</div>
      <div class="lesson-info">
        <h3>${l.id}회차 — ${l.title}</h3>
        <div class="date">${l.date}</div>
        <div class="tags">${l.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    `;
    container.appendChild(d);
  });
  updateStats();
}

/* ───────── LESSONS ACCORDION ───────── */
function buildAccordion() {
  const container = document.getElementById('accordion-container');
  LESSONS.forEach(l => {
    const item = document.createElement('div');
    item.className = 'accordion-item';
    const sectionsHTML = l.sections.map(s => `
      <div class="section-title">${s.title}</div>
      ${s.points.map(p => `
        <div class="key-point">
          <span class="dot">▸</span>
          <div>
            <div style="font-weight:600">${p.en}</div>
            ${p.kr ? `<div style="color:var(--text-muted);font-size:0.8rem;margin-top:2px">${p.kr}</div>` : ''}
          </div>
        </div>`).join('')}
    `).join('');

    const examplesHTML = `
      <div class="section-title">연습 예문</div>
      ${l.examples.map(e => `
        <div class="example-box">
          <div class="en">${e.en}</div>
          <div class="kr">${e.kr}</div>
        </div>`).join('')}
    `;

    item.innerHTML = `
      <button class="accordion-header" id="acc-${l.id}" onclick="toggleAccordion(${l.id})">
        <span>${l.id}회차 — ${l.title} <span style="font-weight:400;color:var(--text-muted);font-size:0.8rem">${l.date}</span></span>
        <span class="accordion-arrow">▼</span>
      </button>
      <div class="accordion-body" id="body-${l.id}">
        ${sectionsHTML}
        ${examplesHTML}
        <div class="hw-box"><strong>📝 숙제:</strong> ${l.homework}</div>
      </div>
    `;
    container.appendChild(item);
  });
}

function toggleAccordion(id) {
  const header = document.getElementById('acc-' + id);
  const body = document.getElementById('body-' + id);
  header.classList.toggle('open');
  body.classList.toggle('open');
}

function openAccordion(id) {
  const body = document.getElementById('body-' + id);
  const header = document.getElementById('acc-' + id);
  if (!body.classList.contains('open')) { body.classList.add('open'); header.classList.add('open'); }
  setTimeout(() => header.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

/* ───────── FLASHCARDS ───────── */
function filterCards(lesson, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filteredCards = lesson === 'all' ? [...FLASHCARDS] : FLASHCARDS.filter(c => c.lesson === lesson);
  cardIndex = 0;
  renderCard();
}

function renderCard() {
  if (!filteredCards.length) return;
  const c = filteredCards[cardIndex];
  document.getElementById('fc-korean').textContent = c.kr;
  document.getElementById('fc-english').textContent = c.en;
  document.getElementById('fc-meta').textContent = `${c.lesson}회차 · ${c.cat}`;
  document.getElementById('card-counter').textContent = `${cardIndex + 1} / ${filteredCards.length}`;
  const fc = document.getElementById('flashcard');
  fc.classList.remove('flipped');
  document.getElementById('diff-btns').style.display = 'none';
}

function flipCard() {
  const fc = document.getElementById('flashcard');
  fc.classList.toggle('flipped');
  document.getElementById('diff-btns').style.display = fc.classList.contains('flipped') ? 'flex' : 'none';
}

function prevCard() { if (cardIndex > 0) { cardIndex--; renderCard(); } }
function nextCard() { if (cardIndex < filteredCards.length - 1) { cardIndex++; renderCard(); } }

function markDifficulty(level) {
  const card = filteredCards[cardIndex];
  if (level === 'easy') {
    const mastered = JSON.parse(localStorage.getItem('mastered') || '[]');
    const key = card.kr;
    if (!mastered.includes(key)) mastered.push(key);
    localStorage.setItem('mastered', JSON.stringify(mastered));
  }
  nextCard();
}

/* ───────── QUIZ ───────── */
function initQuiz() {
  quizIndex = 0; quizScore = 0; quizAnswered = false;
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('quiz-result').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const q = QUIZ[quizIndex];
  const pct = ((quizIndex) / QUIZ.length) * 100;
  document.getElementById('quiz-bar').style.width = pct + '%';
  document.getElementById('quiz-badge').textContent = `${q.lesson}회차 문제`;
  document.getElementById('quiz-question').textContent = `Q${quizIndex + 1}. ${q.q}`;

  const opts = document.getElementById('quiz-options');
  opts.innerHTML = q.opts.map((o, i) => `
    <button class="quiz-option" onclick="selectOption(${i})">${o}</button>
  `).join('');

  document.getElementById('quiz-explanation').classList.remove('show');
  document.getElementById('quiz-next').classList.remove('show');
  quizAnswered = false;
}

function selectOption(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = QUIZ[quizIndex];
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((o, idx) => {
    o.disabled = true;
    if (idx === q.ans) o.classList.add('correct');
    else if (idx === i) o.classList.add('wrong');
  });
  if (i === q.ans) quizScore++;

  const exp = document.getElementById('quiz-explanation');
  exp.textContent = q.exp;
  exp.classList.add('show');
  document.getElementById('quiz-next').classList.add('show');
  document.getElementById('quiz-next').textContent = quizIndex < QUIZ.length - 1 ? '다음 문제 →' : '결과 보기 →';
}

function nextQuestion() {
  quizIndex++;
  if (quizIndex < QUIZ.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  const result = document.getElementById('quiz-result');
  result.style.display = 'block';
  const pct = Math.round((quizScore / QUIZ.length) * 100);

  const best = parseInt(localStorage.getItem('bestScore') || '0');
  if (pct > best) localStorage.setItem('bestScore', pct);

  document.getElementById('score-display').textContent = `${quizScore} / ${QUIZ.length}`;
  const msgs = ['더 연습해봐요! 💪', '잘 하고 있어요! 😊', '훌륭해요! 🌟', '완벽해요! 🎉'];
  const msg = pct < 50 ? msgs[0] : pct < 70 ? msgs[1] : pct < 90 ? msgs[2] : msgs[3];
  document.getElementById('score-sub').textContent = `${pct}점 · ${msg}`;
}

function restartQuiz() { initQuiz(); }

/* ───────── TRANSLATION ───────── */
function renderTranslation() {
  const t = TRANSLATIONS[transIndex];
  document.getElementById('trans-progress').textContent = `${transIndex + 1} / ${TRANSLATIONS.length}`;
  document.getElementById('trans-lesson-tag').textContent = `${t.lesson}회차 문장`;
  document.getElementById('trans-korean').textContent = t.kr;
  document.getElementById('trans-input').value = '';
  document.getElementById('trans-answer').classList.remove('show');
  document.getElementById('trans-answer').textContent = '';
}

function revealAnswer() {
  const t = TRANSLATIONS[transIndex];
  const ans = document.getElementById('trans-answer');
  ans.textContent = '✅ ' + t.en;
  ans.classList.add('show');
}

function nextTranslation() {
  transIndex = (transIndex + 1) % TRANSLATIONS.length;
  renderTranslation();
}

/* ───────── INIT ───────── */
buildDashboard();
buildAccordion();
renderCard();
initQuiz();
renderTranslation();
</script>
