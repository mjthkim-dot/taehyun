<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 면접 코파일럿</title>
<meta name="theme-color" content="#0B0C0F">
<style>
  :root {
    --bg: #0B0C0F; --panel: #17181D; --panel2: #1E1F26; --border: #2A2B33;
    --text: #ECECF0; --sub: #A7A7B6; --faint: #6E6E7E;
    --yellow: #F7CE46; --yellow-deep: #E0B32B;
    --me-bg: #4A4030; --me-text: #F0E7CB; --me-sub: #C9BC93;
    --danger: #F06A6A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 상단 컨트롤 바 ─────────────────────────── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .ctrl { display: flex; gap: 6px; }
  .ctrl button {
    width: 34px; height: 30px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .ctrl button.live { background: var(--yellow); color: #16130A; border-color: var(--yellow); }
  .tabs {
    display: flex; gap: 2px; background: var(--panel2); border-radius: 999px;
    padding: 3px; border: 1px solid var(--border);
  }
  .tab {
    padding: 5px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
    color: var(--sub); cursor: pointer; border: none; background: none; font-family: inherit;
  }
  .tab.active { background: var(--text); color: #141519; }
  .spacer { flex: 1; }
  header select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 5px 8px; font-size: 12.5px; font-family: inherit;
  }
  header a { font-size: 12px; color: var(--faint); text-decoration: none; }

  /* ── 실시간 요약 바 ─────────────────────────── */
  .sumbar {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 14px 0; padding: 9px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    font-size: 13px;
  }
  .sumbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); flex: none; }
  .sumbar .label { color: var(--yellow); font-weight: 800; flex: none; }
  .sumbar .line { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 뷰 공통 ────────────────────────────────── */
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view.hidden { display: none; }

  /* ── 라이브: 대화 피드 (채팅 버블) ───────────── */
  #feed { flex: 1; overflow-y: auto; padding: 12px 14px 8px; }
  .row { margin-bottom: 12px; max-width: 92%; }
  .row.me { margin-left: auto; }
  .row .meta { font-size: 11px; color: var(--faint); margin: 0 6px 4px; }
  .row.me .meta { text-align: right; }
  .bubble {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 13px; position: relative;
  }
  .row.me .bubble { background: var(--me-bg); border-color: #5C5138; }
  .bubble .en { font-size: 14.5px; line-height: 1.55; }
  .row.me .bubble .en { color: var(--me-text); }
  .bubble .kr { font-size: 12.5px; color: var(--sub); margin-top: 5px; line-height: 1.5; }
  .row.me .bubble .kr { color: var(--me-sub); }
  .bubble .kr:empty { display: none; }
  .bubble .ask {
    position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--yellow);
    cursor: pointer; font-weight: 700; opacity: .85;
  }
  .row.q .bubble { border-color: var(--yellow-deep); }
  .row.dim { opacity: .45; }
  .empty { color: var(--faint); text-align: center; margin-top: 56px; font-size: 13.5px; line-height: 2; }
  .empty .big { font-size: 30px; }

  /* ── 퀵 액션 ────────────────────────────────── */
  .actions {
    display: flex; gap: 4px; padding: 8px 14px 0; flex-wrap: wrap;
  }
  .actions button {
    background: none; border: none; color: var(--sub); font-size: 12.5px; font-weight: 600;
    cursor: pointer; padding: 6px 10px; border-radius: 9px; font-family: inherit;
  }
  .actions button:hover { background: var(--panel2); color: var(--text); }
  .actions .who {
    margin-left: auto; border: 1px solid var(--border); background: var(--panel2);
  }
  .actions .who.me { color: var(--me-sub); border-color: #5C5138; }

  /* ── 한국어 입력 ────────────────────────────── */
  .quickbar { display: flex; gap: 8px; padding: 8px 14px 12px; }
  .quickbar input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 10px 13px;
    font-size: 13.5px; font-family: inherit; background: var(--panel); color: var(--text);
  }
  .quickbar input::placeholder { color: var(--faint); }
  .quickbar button {
    width: 42px; border: none; border-radius: 12px; background: var(--yellow);
    color: #16130A; font-size: 16px; font-weight: 800; cursor: pointer;
  }

  /* ── ✦ 답변 제안 카드 (플로팅) ────────────────── */
  #card {
    display: none; position: absolute; left: 14px; right: 14px; bottom: 108px;
    background: rgba(20, 21, 26, .97); border: 1px solid var(--border);
    border-radius: 16px; padding: 13px 15px; max-height: 52%; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .5); backdrop-filter: blur(6px);
  }
  #card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #card .head .gist { font-size: 14px; font-weight: 800; flex: 1; }
  #card .head .gist::before { content: "✦ "; color: var(--yellow); }
  #card .head button {
    background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px;
  }
  #card .head button.on { color: var(--yellow); }
  .lrow { display: flex; gap: 10px; margin-top: 10px; }
  .lrow .lab {
    flex: none; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
    height: fit-content; margin-top: 1px;
  }
  .lab.st { background: var(--panel2); color: var(--sub); border: 1px solid var(--border); }
  .lab.an { background: var(--yellow); color: #16130A; }
  .lrow .body { flex: 1; min-width: 0; }
  .lrow .strat { font-size: 13px; color: var(--sub); line-height: 1.55; }
  .lrow .en { font-size: 15px; font-weight: 700; line-height: 1.6; }
  .lrow .kr { font-size: 12.5px; color: var(--sub); line-height: 1.55; margin-top: 6px; }
  .lrow .say { background: none; border: none; cursor: pointer; font-size: 14px; flex: none; color: var(--sub); }

  /* ── 요약/번역 탭 ───────────────────────────── */
  .padview { padding: 14px; overflow-y: auto; }
  .padview pre {
    white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.7;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
  }
  .padview textarea {
    width: 100%; min-height: 90px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 11px; font-size: 14px;
    font-family: inherit; resize: vertical;
  }
  .padview .out {
    margin-top: 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; font-size: 15px; line-height: 1.6; min-height: 46px;
    white-space: pre-wrap;
  }
  .padview .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  .padview .btnrow button {
    padding: 9px 16px; border: none; border-radius: 10px; background: var(--yellow);
    color: #16130A; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .padview .btnrow button.ghost { background: var(--panel2); color: var(--sub); border: 1px solid var(--border); }

  /* 하단 빠른 번역 결과 (답변 카드와 독립 — 생성 중인 답변을 방해하지 않음) */
  .hint-out {
    display: none; align-items: center; gap: 8px; margin: 0 14px;
    background: var(--me-bg); border: 1px solid #5C5138; border-radius: 12px;
    padding: 9px 13px; font-size: 14.5px; color: var(--me-text); font-weight: 600;
  }
  .hint-out .txt { flex: 1; }
  .hint-out .say { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--me-sub); }

  /* 📋 세션 종료 리포트 */
  #report {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: rgba(8, 8, 11, .94); overflow-y: auto; padding: 24px 16px;
  }
  #report .box {
    max-width: 640px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px; padding: 18px;
  }
  #report h2 { font-size: 16px; margin-bottom: 4px; }
  #report h2::before { content: "📋 "; }
  #report .meta { font-size: 12px; color: var(--faint); margin-bottom: 14px; }
  #report pre {
    white-space: pre-wrap; font-family: inherit; font-size: 13.5px; line-height: 1.75;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  }
  #report details { margin-top: 12px; font-size: 12.5px; color: var(--sub); }
  #report details pre { max-height: 220px; overflow-y: auto; margin-top: 8px; }
  #report .btnrow { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  #report .btnrow button {
    flex: 1; min-width: 130px; padding: 10px; border: none; border-radius: 10px;
    font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit;
    background: var(--panel2); color: var(--sub); border: 1px solid var(--border);
  }
  #report .btnrow button.primary { background: var(--yellow); color: #16130A; border: none; }

  .notice { font-size: 11px; color: var(--faint); text-align: center; padding: 0 14px 10px; }
  .notice b { color: var(--sub); }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
</style>
</head>
<body>
<header>
  <div class="ctrl">
    <button id="btn-listen" title="듣기 시작/일시정지">▶</button>
    <button id="btn-stop" title="세션 종료 (기록 지움)">⏹</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-v="live">라이브</button>
    <button class="tab" data-v="summary">요약</button>
    <button class="tab" data-v="translate">번역</button>
  </div>
  <div class="spacer"></div>
  <select id="sens" title="마이크/탭 음성 감지 민감도">
    <option value="high">민감도 높음</option>
    <option value="mid" selected>민감도 보통</option>
    <option value="low">민감도 낮음</option>
  </select>
  <select id="cefr" title="내 영어 레벨">
    <option value="A2">A2</option><option value="B1" selected>B1</option>
    <option value="B2">B2</option><option value="C1">C1</option>
  </select>
  <a href="/interview.html">연습 모드</a>
</header>

<div class="sumbar">
  <span class="dot"></span><span class="label">실시간 요약</span>
  <span class="line" id="sum-line">듣기를 시작하면 대화 요약이 실시간으로 표시됩니다</span>
</div>

<main>
  <!-- 라이브 -->
  <div class="view" id="view-live">
    <div id="feed">
      <div class="empty" id="feed-empty">
        <div class="big">🎧</div>
        ▶ 버튼을 누르면 대화가 실시간 자막 + 한국어 번역으로 표시되고<br>
        질문이 감지되면 답변 카드가 자동으로 뜹니다
      </div>
    </div>
    <div class="actions">
      <button data-intent="agree">👍 동의하기</button>
      <button data-intent="disagree">👎 반박하기</button>
      <button data-intent="ask">💬 질문하기</button>
      <button data-intent="propose">💡 제안하기</button>
      <span class="who" id="stt-ind" style="display:none; border:none; background:none; color:var(--faint); font-size:11.5px; margin-left:auto; padding:6px 10px;">듣는 중…</span>
    </div>
    <div class="hint-out" id="hint-out">
      <span class="txt" id="hint-txt"></span>
      <button class="say" id="hint-say">🔊</button>
      <button class="say" id="hint-x">✕</button>
    </div>
    <div class="quickbar">
      <input type="text" id="hint-in" placeholder="한국어 문장 혹은 단어를 빠르게 번역하기...">
      <button id="hint-go">↑</button>
    </div>
    <!-- ✦ 답변 제안 카드 -->
    <div id="card">
      <div class="head">
        <span class="gist" id="c-gist"></span>
        <button id="c-pin" title="고정">📌</button>
        <button id="c-close" title="닫기">✕</button>
      </div>
      <div class="lrow" id="c-strat-row" style="display:none">
        <span class="lab st">전략</span>
        <div class="body"><div class="strat" id="c-strat"></div></div>
      </div>
      <div id="c-answers"></div>
    </div>
  </div>

  <!-- 요약 -->
  <div class="view hidden padview" id="view-summary">
    <pre id="full-summary">아직 요약할 대화가 없습니다.</pre>
    <div class="btnrow"><button id="btn-full-summary">요약 새로고침</button></div>
  </div>

  <!-- 번역 -->
  <div class="view hidden padview" id="view-translate">
    <textarea id="tr-in" placeholder="한국어 또는 영어를 입력하세요 (자동 감지)"></textarea>
    <div class="btnrow">
      <button id="tr-go">번역</button>
      <button class="ghost" id="tr-say">🔊 듣기</button>
    </div>
    <div class="out" id="tr-out"></div>
  </div>
</main>

<div class="notice">
  ▶ 시작 → 화상회의가 열린 <b>Chrome 탭</b> 선택 + <b>'오디오도 공유'</b> 체크 (상대=탭 오디오, 나=마이크로 화자 자동 분리) ·
  <b>이어폰 사용 OK</b> · macOS에서 Zoom은 웹 브라우저로 접속하세요
</div>

<!-- 📋 세션 종료 리포트 -->
<div id="report">
  <div class="box">
    <h2>세션 리포트</h2>
    <div class="meta" id="rp-meta"></div>
    <pre id="rp-body">⏳ 리포트 생성 중...</pre>
    <details><summary>전체 트랜스크립트 보기</summary><pre id="rp-transcript"></pre></details>
    <div class="btnrow">
      <button id="rp-download">⬇ 트랜스크립트 저장 (.txt)</button>
      <button id="rp-back">계속 이어서 듣기</button>
      <button id="rp-new" class="primary">새 세션 시작</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const feed = $('#feed');
const log = [];                 // {who, text}
let suggestAbort = null;
const trQueue = [];             // 자막 번역 대기열
let translating = false;
let uttCount = 0, lineSumBusy = false;

// ── 질문 감지 휴리스틱 ─────────────────────────────────────
const Q_STARTS = ['what','why','how','when','where','who','which','tell me','tell us',
  'describe','walk me','walk us','could you','can you','would you','do you','did you',
  'have you','are you','were you','is there','give me','give us','let\'s talk',
  'talk me through','explain','share','i\'d love to hear','i am curious','i\'m curious',
  'so realistically','realistically'];
function isQuestion(text) {
  const t = text.trim().toLowerCase();
  if (!t) return false;
  if (t.includes('?')) return true;
  return Q_STARTS.some(s => t.startsWith(s)) && t.split(' ').length >= 3;
}

// ── NDJSON 스트림 공통 리더 ────────────────────────────────
async function streamChat(url, payload, onToken, signal) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload), signal,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      try {
        const obj = JSON.parse(line);
        if (obj.error) throw new Error(obj.error);
        if (obj.message?.content) onToken(obj.message.content);
      } catch (e) { if (e.message && !(e instanceof SyntaxError)) throw e; }
    }
  }
}

const now = () => new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });

// ── 발화 버블 (who: '상대' | '나' — 스트림 출처로 자동 결정) ─
function addUtterance(text, who) {
  $('#feed-empty')?.remove();
  const me = who === '나';
  const q = !me && isQuestion(text);
  log.push({ who, text });
  const row = document.createElement('div');
  row.className = 'row' + (me ? ' me' : '') + (q ? ' q' : '');
  row.innerHTML =
    `<div class="meta">${me ? '나' : '상대'} · ${now()}</div>` +
    `<div class="bubble">${me ? '' : '<span class="ask">답변</span>'}<div class="en"></div><div class="kr"></div></div>`;
  row.querySelector('.en').textContent = text;
  row.querySelector('.ask')?.addEventListener('click', () => suggest(text, 'answer'));
  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
  if (text.split(' ').length >= 3) {
    trQueue.push({ el: row.querySelector('.kr'), text });
    processTrQueue();
  }
  if (q) suggest(text, 'answer', true);      // 질문 자동 감지 → 답변 카드 (📌 고정 시 보호)
  if (++uttCount % 3 === 0) updateLineSummary();  // 3발화마다 실시간 요약 갱신
  return row;
}

// ── 자막 번역 큐 (답변 제안이 항상 우선) ───────────────────
async function processTrQueue() {
  if (translating || suggestAbort || !trQueue.length) return;
  translating = true;
  const item = trQueue.shift();
  try {
    await streamChat('/api/translate', { text: item.text },
      tk => { item.el.textContent += tk; });
  } catch { /* 자막 번역 실패는 조용히 넘어감 */ }
  finally { translating = false; processTrQueue(); }
}

// ── 실시간 한 줄 요약 (상단 바) ────────────────────────────
async function updateLineSummary() {
  if (lineSumBusy || suggestAbort || !log.length) return;
  lineSumBusy = true;
  let out = '';
  try {
    await streamChat('/api/live/summary',
      { transcript: log.slice(-14).map(l => `${l.who}: ${l.text}`).join('\n'), mode: 'line' },
      tk => { out += tk; });
    if (out.trim()) $('#sum-line').textContent = out.trim();
  } catch { /* 요약 실패는 무시 */ }
  finally { lineSumBusy = false; }
}

// ── ✦ 답변 카드 렌더링 ─────────────────────────────────────
let pinned = false;

function answerRow(en, kr, label) {
  const row = document.createElement('div');
  row.className = 'lrow';
  row.innerHTML = `<span class="lab an">${label || '답변'}</span>
    <div class="body"><div class="en"></div><div class="kr"></div></div>
    <button class="say">🔊</button>`;
  row.querySelector('.en').textContent = en;
  row.querySelector('.kr').textContent = kr || '';
  row.querySelector('.say').addEventListener('click', () => speak(en));
  return row;
}

// 스트리밍 파싱 — 새 형식: EN/KR 블록들 먼저, META(요지|전략)는 맨 뒤
function renderCard(raw) {
  const box = $('#c-answers');
  box.innerHTML = '';
  for (const b of raw.split('===')) {
    if (/META|요지\s*=/.test(b)) {
      const gist = (b.match(/요지\s*=\s*([^|]+)/) || [])[1]?.trim();
      const strat = (b.match(/전략\s*=\s*(.+)/) || [])[1]?.trim();
      if (gist) $('#c-gist').textContent = gist;
      $('#c-strat-row').style.display = strat ? 'flex' : 'none';
      if (strat) $('#c-strat').textContent = strat;
      continue;
    }
    const en = ((b.match(/EN\s*[:：]\s*([\s\S]*?)(?=\nKR\s*[:：]|$)/) || [])[1] || '').trim();
    const kr = ((b.match(/KR\s*[:：]\s*([\s\S]*)/) || [])[1] || '').trim();
    if (en) box.appendChild(answerRow(en, kr));
  }
}

// ⚡ 미리 생성된 맞춤 답변 즉시 렌더링 (0초)
function renderCardData(entry) {
  const levelNote = entry.cefr && entry.cefr !== $('#cefr').value ? ` (${entry.cefr} 기준 생성)` : '';
  $('#c-gist').textContent = '⚡ ' + (entry.gist_ko || entry.question_kr || '') + levelNote;
  $('#c-strat-row').style.display = entry.strategy_ko ? 'flex' : 'none';
  $('#c-strat').textContent = entry.strategy_ko || '';
  const box = $('#c-answers');
  box.innerHTML = '';
  (entry.answers || []).forEach(a => box.appendChild(answerRow(a.en, a.kr)));
}

async function suggest(target, intent, auto) {
  // 📌 고정 중에는 자동 감지가 카드를 덮어쓰지 않는다 (읽는 중 보호).
  //    수동 클릭(답변 버튼/퀵 액션)은 사용자 의도이므로 고정을 해제하고 진행.
  if (auto && pinned) return;
  if (!auto && pinned) { pinned = false; $('#c-pin').classList.remove('on'); }
  if (suggestAbort) suggestAbort.abort();
  const card = $('#card');
  card.style.display = 'block';
  // 1) 미리 준비된 맞춤 답변과 매칭되면 생성 없이 즉시 표시
  if (intent === 'answer') {
    try {
      const r = await fetch('/api/live/cached?q=' + encodeURIComponent(target));
      const d = await r.json();
      if (d.hit) { renderCardData(d.entry); processTrQueue(); return; }
    } catch { /* 캐시 실패는 무시하고 생성으로 */ }
  }
  // 2) 캐시 미스 → 실시간 생성 (답변이 먼저 스트리밍됨)
  suggestAbort = new AbortController();
  $('#c-gist').textContent = target.length > 60 ? target.slice(0, 60) + '…' : target;
  $('#c-strat-row').style.display = 'none';
  $('#c-answers').innerHTML = '<div class="lrow"><span class="lab an">답변</span><div class="body"><div class="en">⏳ 생성 중...</div></div></div>';
  const context = log.slice(-7).map(l => `${l.who === '나' ? 'Candidate' : 'Interviewer'}: ${l.text}`).join('\n');
  let raw = '';
  try {
    await streamChat('/api/live/suggest',
      { question: target, cefr: $('#cefr').value, context, intent },
      tk => { raw += tk; renderCard(raw); }, suggestAbort.signal);
  } catch (e) {
    if (e.name !== 'AbortError') $('#c-gist').textContent = '⚠️ ' + e.message;
  } finally {
    suggestAbort = null;
    processTrQueue();
  }
}
$('#c-close').addEventListener('click', () => { $('#card').style.display = 'none'; pinned = false; $('#c-pin').classList.remove('on'); });
$('#c-pin').addEventListener('click', () => { pinned = !pinned; $('#c-pin').classList.toggle('on', pinned); });

// ── 퀵 액션 (동의/반박/질문/제안) — 마지막 상대 발화 기준 ───
document.querySelectorAll('.actions [data-intent]').forEach(btn => {
  btn.addEventListener('click', () => {
    const last = [...log].reverse().find(l => l.who === '상대');
    if (last) suggest(last.text, btn.dataset.intent);
  });
});

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ════════════════════════════════════════════════════════════
//  🎙 이중 스트림 캡처 + Groq Whisper STT — 화자 자동 분리
//    · 상대: getDisplayMedia로 화상회의 '탭 오디오'를 직접 캡처
//    · 나:   getUserMedia 마이크
//  두 스트림을 각각 VAD(음성 구간 감지)로 세그먼트로 잘라
//  /api/stt(Groq whisper-large-v3-turbo)에 보낸다.
//  → 화자 분리 정확 + 이어폰 사용 가능 + Web Speech보다 인식 품질 ↑
// ════════════════════════════════════════════════════════════
let audioCtx = null, tabCap = null, micCap = null;
let pendingStt = 0;
// STT 장애 복원력: 실패 시 지수 백오프(2→4→…→30초) 동안 세그먼트 전송을 멈추고
// 상태를 화면에 계속 표시한다 — "조용히 죽는" 상황 방지.
let sttFails = 0, sttBackoffUntil = 0, sttKeyMissing = false;

function sttStatus() {
  const el = $('#stt-ind');
  if (sttKeyMissing) {
    el.style.display = 'inline'; el.style.color = 'var(--danger)';
    el.textContent = '⚠️ GROQ_API_KEY 없음 — 음성 인식 불가';
  } else if (Date.now() < sttBackoffUntil) {
    el.style.display = 'inline'; el.style.color = 'var(--danger)';
    el.textContent = `⚠️ 인식 오류 — ${Math.ceil((sttBackoffUntil - Date.now()) / 1000)}초 후 재시도`;
    setTimeout(sttStatus, 1000);
  } else if (pendingStt > 0) {
    el.style.display = 'inline'; el.style.color = 'var(--faint)';
    el.textContent = '듣는 중…';
  } else {
    el.style.display = 'none';
  }
}
function sttPending(delta) { pendingStt += delta; sttStatus(); }

// 민감도 프리셋 — 적응형 노이즈 플로어에 곱하는 배수 + 최소 임계값
const SENS = {
  high: { mult: 1.9, min: 0.005 },
  mid:  { mult: 2.6, min: 0.009 },
  low:  { mult: 3.4, min: 0.014 },
};
const sensCfg = () => SENS[$('#sens').value] || SENS.mid;

class SegmentRecorder {
  constructor(stream, who) {
    this.stream = stream; this.who = who;
    this.src = audioCtx.createMediaStreamSource(stream);
    this.analyser = audioCtx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.src.connect(this.analyser);
    this.buf = new Uint8Array(this.analyser.fftSize);
    this.noise = 0.006;             // 적응형 노이즈 플로어 (조용할 때 학습)
    this.hadSpeech = false; this.speechMs = 0; this.silenceMs = 0; this.segMs = 0;
    this.mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    this._arm();
    this.timer = setInterval(() => this._tick(), 100);
  }
  _arm() {
    this.chunks = [];
    this.recorder = new MediaRecorder(this.stream, { mimeType: this.mime, audioBitsPerSecond: 48000 });
    this.recorder.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
    this.recorder.onstop = () => {
      const blob = new Blob(this.chunks, { type: this.mime });
      // 최소 0.3초 이상 실제 발화가 있었던 세그먼트만 전송 (노이즈 팝 필터)
      const send = this.hadSpeech && this.speechMs >= 300 && blob.size > 2500;
      this.hadSpeech = false; this.speechMs = 0; this.silenceMs = 0; this.segMs = 0;
      if (this.stream.active) { this._arm(); }
      if (send) this._transcribe(blob);
    };
    this.recorder.start();
  }
  _rms() {
    this.analyser.getByteTimeDomainData(this.buf);
    let s = 0;
    for (let i = 0; i < this.buf.length; i++) { const v = (this.buf[i] - 128) / 128; s += v * v; }
    return Math.sqrt(s / this.buf.length);
  }
  _tick() {
    if (!this.recorder || this.recorder.state !== 'recording') return;
    this.segMs += 100;
    const rms = this._rms();
    const cfg = sensCfg();
    // 임계값 = max(최소값, 학습된 노이즈 플로어 × 배수) — 환경 소음에 자동 적응
    const speaking = rms > Math.max(cfg.min, this.noise * cfg.mult);
    if (speaking) { this.hadSpeech = true; this.speechMs += 100; this.silenceMs = 0; }
    else {
      this.silenceMs += 100;
      this.noise = this.noise * 0.9 + rms * 0.1;   // 조용할 때만 노이즈 플로어 갱신
    }
    // 발화(0.3초+) 후 0.6초 침묵 → 문장 컷 · 10초 강제 컷 · 무음 5초마다 버퍼 리셋
    if ((this.hadSpeech && this.speechMs >= 300 && this.silenceMs >= 600) ||
        this.segMs >= 10000 || (!this.hadSpeech && this.segMs >= 5000)) {
      this.recorder.stop();
    }
  }
  async _transcribe(blob) {
    if (sttKeyMissing || Date.now() < sttBackoffUntil) return;   // 백오프 중엔 전송 중단
    sttPending(1);
    try {
      // lang 미지정 → Whisper 언어 자동 감지 (한국어/영어 혼용 면접 대응)
      const res = await fetch('/api/stt', {
        method: 'POST', headers: { 'Content-Type': 'audio/webm' }, body: blob });
      const d = await res.json();
      if (res.status === 503) { sttKeyMissing = true; throw new Error(d.error); }
      if (!res.ok) throw new Error(d.error || `STT 오류 (${res.status})`);
      sttFails = 0;                                              // 성공 → 백오프 초기화
      const text = (d.text || '').trim();
      // Whisper가 무음에서 만들어내는 환청 토막("you", "Thank you." 등) 필터
      if (text && text.split(' ').length >= 2 && !/^thank you\.?$/i.test(text)) {
        addUtterance(text, this.who);
      }
    } catch (e) {
      sttFails += 1;
      sttBackoffUntil = Date.now() + Math.min(30, 2 ** sttFails) * 1000;
      console.warn('STT 실패:', e.message);
    } finally { sttPending(-1); }
  }
  stop() {
    clearInterval(this.timer);
    try { if (this.recorder.state !== 'inactive') { this.recorder.onstop = null; this.recorder.stop(); } } catch {}
    this.src.disconnect();
    this.stream.getTracks().forEach(t => t.stop());
  }
}

function stopListening() {
  tabCap?.stop(); micCap?.stop();
  tabCap = micCap = null;
  $('#btn-listen').textContent = '▶';
  $('#btn-listen').classList.remove('live');
}

async function startListening() {
  let tab;
  try {
    // 1) 화상회의 탭 선택 + '오디오도 공유' 체크 → 상대 목소리
    tab = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (e) { return; /* 사용자가 취소 */ }
  if (!tab.getAudioTracks().length) {
    tab.getTracks().forEach(t => t.stop());
    alert("탭 오디오가 공유되지 않았어요.\n\n'Chrome 탭' 목록에서 화상회의 탭을 고른 뒤,\n왼쪽 아래 '오디오도 공유' 체크박스를 켜 주세요.");
    return;
  }
  let mic;
  try {
    // 2) 마이크 → 내 목소리 (에코 캔슬로 스피커 소리 유입 억제)
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    tab.getTracks().forEach(t => t.stop());
    alert('마이크 권한을 허용해 주세요.');
    return;
  }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  tabCap = new SegmentRecorder(tab, '상대');
  micCap = new SegmentRecorder(mic, '나');
  const vTrack = tab.getVideoTracks()[0];
  if (vTrack) vTrack.onended = stopListening;   // 사용자가 공유 중단하면 함께 정지
  $('#btn-listen').textContent = '⏸';
  $('#btn-listen').classList.add('live');
}

$('#btn-listen').addEventListener('click', () => tabCap ? stopListening() : startListening());

// ── ⏹ 세션 종료 → 📋 사후 리포트 (기록은 리포트 확인 후 지움) ──
function resetSession() {
  log.length = 0; uttCount = 0;
  feed.innerHTML = '<div class="empty" id="feed-empty"><div class="big">🎧</div>▶ 버튼을 누르면 대화가 실시간 자막 + 한국어 번역으로 표시되고<br>질문이 감지되면 답변 카드가 자동으로 뜹니다</div>';
  $('#card').style.display = 'none';
  pinned = false; $('#c-pin').classList.remove('on');
  $('#sum-line').textContent = '듣기를 시작하면 대화 요약이 실시간으로 표시됩니다';
}
const transcriptText = () => log.map(l => `${l.who}: ${l.text}`).join('\n');

async function openReport() {
  $('#report').style.display = 'block';
  const myWords = log.filter(l => l.who === '나')
                     .reduce((n, l) => n + l.text.split(' ').length, 0);
  $('#rp-meta').textContent = `발화 ${log.length}개 · 내 발화 단어 수 ${myWords} · ${new Date().toLocaleString('ko-KR')}`;
  $('#rp-transcript').textContent = transcriptText();
  const body = $('#rp-body');
  body.textContent = '⏳ 리포트 생성 중...';
  try {
    let first = true;
    await streamChat('/api/live/report', { transcript: transcriptText() },
      tk => { if (first) { body.textContent = ''; first = false; } body.textContent += tk; });
  } catch (e) { body.textContent = '⚠️ 리포트 생성 실패: ' + e.message; }
}

$('#btn-stop').addEventListener('click', () => {
  stopListening();
  if (log.length) openReport();
  else resetSession();
});
$('#rp-back').addEventListener('click', () => { $('#report').style.display = 'none'; });
$('#rp-new').addEventListener('click', () => { $('#report').style.display = 'none'; resetSession(); });
$('#rp-download').addEventListener('click', () => {
  const stamp = new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-');
  const blob = new Blob([`영어 면접 트랜스크립트 (${new Date().toLocaleString('ko-KR')})\n\n` +
                         transcriptText() + '\n\n--- 리포트 ---\n' + $('#rp-body').textContent],
                        { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `interview-${stamp}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── 탭 전환 ────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ['live', 'summary', 'translate'].forEach(v =>
      $('#view-' + v).classList.toggle('hidden', v !== tab.dataset.v));
    if (tab.dataset.v === 'summary' && log.length) fullSummary();
  });
});

// ── 요약 탭 ────────────────────────────────────────────────
async function fullSummary() {
  const out = $('#full-summary');
  out.textContent = '⏳ 요약 중...';
  try {
    let first = true;
    await streamChat('/api/live/summary',
      { transcript: log.map(l => `${l.who}: ${l.text}`).join('\n'), mode: 'full' },
      tk => { if (first) { out.textContent = ''; first = false; } out.textContent += tk; });
  } catch (e) { out.textContent = '⚠️ ' + e.message; }
}
$('#btn-full-summary').addEventListener('click', () => log.length && fullSummary());

// ── 번역 탭 ────────────────────────────────────────────────
async function doTranslate() {
  const text = $('#tr-in').value.trim();
  if (!text) return;
  const out = $('#tr-out');
  out.textContent = '';
  try {
    await streamChat('/api/translate', { text }, tk => { out.textContent += tk; });
  } catch (e) { out.textContent = '⚠️ ' + e.message; }
}
$('#tr-go').addEventListener('click', doTranslate);
$('#tr-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) doTranslate(); });
$('#tr-say').addEventListener('click', () => { const t = $('#tr-out').textContent; if (t) speak(t); });

// ── 🇰🇷 빠른 번역 입력 — 전용 출력줄 사용 (진행 중인 답변 생성을 방해하지 않음) ──
let hintAbort = null;
async function quickHint() {
  const text = $('#hint-in').value.trim();
  if (!text) return;
  $('#hint-in').value = '';
  if (hintAbort) hintAbort.abort();
  hintAbort = new AbortController();
  const out = $('#hint-out'), txt = $('#hint-txt');
  out.style.display = 'flex';
  txt.textContent = '';
  try {
    await streamChat('/api/translate', { text },
      tk => { txt.textContent += tk; }, hintAbort.signal);
  } catch (err) {
    if (err.name !== 'AbortError') txt.textContent = '⚠️ ' + err.message;
  } finally { hintAbort = null; }
}
$('#hint-go').addEventListener('click', quickHint);
$('#hint-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') quickHint(); });
$('#hint-say').addEventListener('click', () => { const t = $('#hint-txt').textContent; if (t) speak(t); });
$('#hint-x').addEventListener('click', () => { $('#hint-out').style.display = 'none'; });

// ── 데스크톱 전용 안내 — 모바일에는 탭 오디오 캡처 API가 없음 ──
if (!navigator.mediaDevices?.getDisplayMedia) {
  $('#btn-listen').disabled = true;
  $('#sum-line').textContent = '⚠️ 이 브라우저는 탭 오디오 캡처를 지원하지 않아요 — 라이브 모드는 데스크톱 Chrome에서 사용하세요';
}

speechSynthesis.getVoices();
</script>
